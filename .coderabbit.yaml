# CodeRabbit 配置
# 文档: https://docs.coderabbit.ai/guides/configure-coderabbit

# 语言设置
language: zh-CN

# 自动审查设置
reviews:
  # 打开 PR 时自动审查（reviews.auto_review.enabled）
  auto_review:
    enabled: true
    # 每次 push 后增量复审
    auto_incremental_review: true
  # 审查请求变更
  request_changes_workflow: true
  # 高层级摘要
  high_level_summary: true
  # 诗歌风格（关闭）
  poem: false
  # 审查状态
  review_status: true
  # Walkthrough 不折叠
  collapse_walkthrough: false

# 聊天功能
chat:
  auto_reply: true
