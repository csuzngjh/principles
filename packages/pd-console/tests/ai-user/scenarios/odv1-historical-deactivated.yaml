# Owner Decision Experience v1 — Scenario 3: historical deactivated (SPEC AI QA S3).
# 正确答案必须能从页面得出："对应执行方式已停用；历史上曾发生过效果"——不是仍在执行。
id: odv1-historical-deactivated
persona: 第一次使用 PD 的普通用户，不了解 PD 内部机制
goal: 打开"主任务未完成前不得推进次要议题"这条已批准过的原则详情页，判断：这条原则现在是否仍通过对应规则在拦截 Agent 的行为？过去是否发生过真实效果？
success:
  - 页面说明此前的执行方式已停用，当前没有正在执行的生效方式
  - 页面保留了历史行为记录（效果/出现的区分可见，且不宣称现在仍生效）
  - 页面保留了批准历史
  - 页面没有出现"Runtime 恢复前不要批准"这类与已完成决定矛盾的泛化文案；历史处理问题（若有）的表述说明其与当前操作的关系尚未确认
maxSteps: 10
