# Owner Decision Experience v1 — Scenario 1: novice facing a pending decision.
# 完全不了解 PD 的 Owner 只用 Console，必须能凭页面回答 SPEC §22 的核心理解问题。
id: odv1-novice-pending-decision
persona: 第一次使用 PD 的普通用户，完全不了解 PD 的内部概念（不知道什么是原则、审批、通道、运行时）
goal: 在原则库里找到当前需要你决定的那条原则，仅凭页面内容弄清楚：发生了什么、Agent 会学到什么行为准则、为什么这么判断、什么时候适用、批准后会怎样、有什么风险、能否撤销，然后（但不要真的点击确认）找到批准和拒绝入口
success:
  - 能从页面读出发生了什么事件（不出现内部术语或要求理解内部状态机）
  - 能读出一条人类可读的行为准则（而不是技术配置原文）
  - 能读出批准后的真实后果（且不把批准理解为已经生效）
  - 能读到风险或不确定性的说明
  - 能找到批准/拒绝的操作入口及确认提示
  - 能读到撤销/停止影响的边界说明（不承诺撤回已发生的影响）
observe:
  - 页面是否存在需要先理解 PD 内部概念才能读懂的内容（若有记录为 UX failure）
  - 是否出现互斥矛盾的说法（如"可批准"与"无待审批"同屏）
maxSteps: 14
