# PRI-754 demo scenario — AI User QA 基础框架验收样例。
# 视角：第一次接触 PD 的真实新用户，对产品概念零先验。
id: first-run-onboarding
persona: 第一次使用 PD 的开发者，不了解 PD 的概念、术语和界面布局
goal: 完成 PD 初始化，并确认系统处于正常运行状态
success:
  - 页面明确展示系统处于运行/健康状态
  - 能找到完成初始化所需的入口或清晰指引
observe:
  - 首屏是否让用户知道下一步该做什么
  - 初始化过程中是否有清晰的状态反馈
  - 遇到看不懂的概念时能否自助找到解释
maxSteps: 12
