# electron-builder config for PD Companion (PRI-526).
# NSIS per-user installer (no admin required); artifact consumed by
# companion-release.yml and linked from the website download page.
appId: party.principles.disciple.companion
productName: PD Companion
directories:
  output: release
# Runtime dependency: @principles/install-layout (real runtime import from
# src/main + src/lib — the single install-directory truth, never duplicated
# here). electron-builder auto-includes production node_modules alongside the
# explicit file list; scripts/verify-package.mjs fails the build if the
# install-layout executable JS is missing from the packaged app.asar.
files:
  - dist/**/*
  - assets/**/*
  - package.json
asarUnpack: []
win:
  icon: assets/icon.png
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  artifactName: pd-companion-${version}-setup.${ext}
