        .fromTo("#s3-card .status", { opacity: 0 }, { opacity: 1, duration: .45, ease: "sine.out" }, 11.3)

      // Scene 4 — the Owner reads, then clicks Approve; the card records it.

        .fromTo("#s4-cursor", { opacity: 0, x: 170, y: 230 }, { opacity: 1, x: 0, y: 0, duration: .55, ease: "power2.inOut" }, 14.9)
        .to("#s4-approve", { scale: .96, duration: .12, ease: "power2.in" }, 15.5)

        .fromTo("#s6-cta", { opacity: 0 }, { opacity: 1, duration: .45, ease: "sine.out" }, 26.6);

      window.__timelines.main = tl;
    </script>
