  <script>
    const tl = gsap.timeline({ paused: true });

    // ---- Motion System（全片统一；八章同块，Phase 3 有一致性校验）----
    const M = Object.freeze({
      ease: { in: "power2.out", hero: "power3.out", agg: "power2.inOut", state: "power1.out", exit: "power2.in", cam: "sine.inOut" },
      dur: { in: 0.55, hero: 0.7, agg: 0.7, state: 0.35, exit: 0.45, cam: 4.4 },
    });

    // 镜头：对话转记录时缓推，属性收束时回稳
    tl.fromTo("#c3-cam", { scale: 1, y: 0 }, { scale: 1.03, y: -8, duration: 31.7, ease: M.ease.cam, transformOrigin: "50% 46%" }, 0);
    tl.to("#c3-cam", { scale: 1.012, y: 0, duration: 5.0, ease: M.ease.cam }, 31.7);

    // Every incoming message takes room from the older rows in this viewport.
    const chat = [
      { at: -1.2, who: "你", text: "这个改动先一起把方案过一遍。", width: 815 },
      { at: -0.6, who: "AI", text: "我已经按当前方案推进实现。", width: 780 },
      { at: -0.4, who: "你", text: "方向得到认可，不代表具体设计已经批准。", width: 1190, gold: true },
      { at: 1.98, who: "你", text: "先看一下这个问题。", width: 622 },
      { at: 2.64, who: "AI", text: "我再检查一遍。", width: 590 },
      { at: 3.17, who: "AI", text: "这里还有一处需要核对。", width: 746 },
      { at: 3.64, who: "你", text: "先把测试结果发我。", width: 650 },
      { at: 4.06, who: "AI", text: "第一轮结果出来了。", width: 676 },
      { at: 4.43, who: "你", text: "继续看下一项。", width: 614 },
      { at: 4.77, who: "AI", text: "这一处已经确认。", width: 644 },
      { at: 5.08, who: "你", text: "还有另一个问题。", width: 628 },
      { at: 5.37, who: "AI", text: "我来定位原因。", width: 612 },
      { at: 5.65, who: "AI", text: "原因找到了。", width: 581 },
      { at: 5.92, who: "你", text: "好，接着说。", width: 576 },
      { at: 6.18, who: "AI", text: "我把结果整理一下。", width: 686 },
    ];
    const stream = document.getElementById("c3-messages");
    const thumb = document.getElementById("c3-scroll-thumb");

    function svgNode(tag, attrs) {
      const element = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [name, value] of Object.entries(attrs)) element.setAttribute(name, value);
      return element;
    }

    const rows = chat.map((message, index) => {
      const { who, text, gold } = message;
      const group = svgNode("g", {});
      const shell = svgNode("rect", {
        rx: 8, fill: gold ? "#302820" : "#1e3044",
        stroke: gold ? "#a87945" : "#37526a", "stroke-width": 1.3,
      });
      const ink = svgNode("rect", {
        rx: 3, fill: gold ? "#edb967" : "#6893af",
        class: gold ? "c3-reminder-ink" : "",
      });
      const sender = svgNode("text", {
        x: 25, y: gold ? 43 : 38, class: "c3-speaker", fill: gold ? "#f2c380" : "#9db7ca",
      });
      const words = svgNode("text", {
        x: 91, y: gold ? 44 : 39, class: gold ? "c3-message c3-reminder-words" : "c3-message",
        fill: gold ? "#ffe2a8" : "#d1e0ee",
      });
      sender.textContent = who;
      words.textContent = text;
      const clipId = "c3-text-aperture-" + index;
      const clip = svgNode("clipPath", { id: clipId });
      const aperture = svgNode("rect", {});
      clip.append(aperture);
      const textLayer = svgNode("g", { "clip-path": "url(#" + clipId + ")" });
      textLayer.append(sender, words);
      group.append(clip, shell, ink, textLayer);
      stream.append(group);
      return { ...message, group, shell, aperture, ink, textLayer };
    });

    const clamp = (n) => Math.max(0, Math.min(1, n));
    const smooth = (n) => n * n * (3 - 2 * n);

    function paintHistory(time) {
      let later = 0;
      let bottom = 361;
      for (let index = rows.length - 1; index >= 0; index -= 1) {
        const row = rows[index];
        const age = time - row.at;
        const arrived = smooth(clamp(age / 0.36));
        const pressure = Math.max(0, later - (row.gold ? 0.24 : 0.65));
        const left = Math.max(0, 1 - pressure / (row.gold ? 7.35 : 9.7));
        const height = (row.gold ? 72 : 58) * Math.pow(left, row.gold ? 2.28 : 1.9) * arrived;
        const width = row.width * Math.pow(left, row.gold ? 1.62 : 0.86);
        later += arrived;
        if (height < 0.15 || width < 1) {
          row.group.setAttribute("opacity", "0");
          continue;
        }

        const x = (row.who === "AI" ? 66 : 10) + 20 * (1 - arrived);
        const y = bottom - height;
        bottom = y - 11 * clamp(height / 52) * arrived;
        const legibility = smooth(clamp((height - 29) / 21));
        const inkHeight = Math.min(height, row.gold ? 4.0 : 2.6);
        const shellAlpha = smooth(clamp((height - 7) / 25));
        row.group.setAttribute("opacity", arrived.toFixed(3));
        row.group.setAttribute("transform", "translate(" + x.toFixed(2) + " " + y.toFixed(2) + ")");
        row.shell.setAttribute("width", width.toFixed(2));
        row.shell.setAttribute("height", height.toFixed(2));
        row.shell.setAttribute("opacity", shellAlpha.toFixed(3));
        row.ink.setAttribute("width", (width * (row.gold ? 1 : 0.82)).toFixed(2));
        row.ink.setAttribute("height", inkHeight.toFixed(2));
        row.ink.setAttribute("y", ((height - inkHeight) / 2).toFixed(2));
        row.ink.setAttribute("opacity", ((1 - legibility) * (row.gold ? 0.98 : 0.56)).toFixed(3));
        row.aperture.setAttribute("width", width.toFixed(2));
        row.aperture.setAttribute("height", height.toFixed(2));
        row.textLayer.setAttribute("opacity", legibility.toFixed(3));
      }
      const thumbHeight = Math.max(36, 178 - later * 10.5);
      thumb.setAttribute("height", thumbHeight.toFixed(2));
      thumb.setAttribute("y", (363 - thumbHeight).toFixed(2));
    }

    const playhead = { time: 0 };
    paintHistory(0);
    tl.to(playhead, { time: 7.21, duration: 7.21, ease: "none",
      onUpdate: () => paintHistory(playhead.time) }, 0);
    tl.to("#c3-history", { opacity: 0, duration: 0.46, ease: M.ease.exit }, 7.31);
    tl.set("#c3-diagram-tag", { opacity: 0 }, 7.8);
    tl.set("#c3-record-tag", { opacity: 0.9 }, 7.8);
    tl.fromTo("#c3-beam", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.6, ease: M.ease.agg }, 7.8);
    tl.fromTo("#c3-pain", { opacity: 0, scaleY: 0.08, clipPath: "inset(0% 0% 100% 0%)" }, { opacity: 1, scaleY: 1, clipPath: "inset(0% 0% 0% 0%)", duration: 0.75, ease: M.ease.agg, transformOrigin: "50% 0%" }, 7.85);
    tl.to("#c3-beam", { opacity: 0, duration: 0.5, ease: M.ease.exit }, 8.9);
    tl.fromTo("#c3-f1", { opacity: 0, y: 10, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, y: 0, clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: M.ease.hero }, 9.4);
    tl.fromTo("#c3-f2", { opacity: 0, y: 10, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, y: 0, clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: M.ease.hero }, 11.4);
    tl.fromTo("#c3-f3", { opacity: 0, y: 10, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, y: 0, clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: M.ease.hero }, 13.4);

    // 17.09 由 Owner 主动记录（独占该横带；21.0 起退场，把位置让给下一拍）
    tl.fromTo("#c3-owner", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: M.ease.in }, 17.1);
    tl.to(".field", { opacity: 0.62, duration: M.dur.in, ease: M.ease.in }, 17.1);
    tl.to("#c3-owner", { opacity: 0, duration: 0.35, ease: M.ease.exit }, 20.95);

    // 21.39 不是工具报错，也不是系统自动认定
    tl.fromTo("#c3-neg1", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: M.ease.in }, 21.4);
    tl.to(".field", { opacity: 0.45, duration: M.dur.in, ease: M.ease.in }, 21.4);
    tl.fromTo("#c3-neg2", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: M.ease.in }, 23.2);
    tl.fromTo("#c3-neg1 s, #c3-neg2 s", { textDecorationColor: "rgba(208,154,106,0)" }, { textDecorationColor: "rgba(208,154,106,0.9)", duration: 0.5 }, 24.6);

    // 27.76 一次值得进一步分析的真实经验（先清空横带，再落结论）
    tl.to(["#c3-neg1", "#c3-neg2"], { opacity: 0, duration: 0.4 }, 27.45);
    tl.fromTo("#c3-value", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.55 }, 27.95);

    // 31.66 成为一条可追溯、可分析、可持续管理的记录
    tl.to(["#c3-neg1", "#c3-neg2", "#c3-value", "#c3-owner"], { opacity: 0, duration: 0.5 }, 31.6);
    tl.to("#c3-pain", { y: -70, scale: 0.9, duration: 1.0, ease: "power2.inOut" }, 31.7);
    tl.fromTo("#c3-rule", { opacity: 0, scaleX: 0 }, { opacity: 0.9, scaleX: 1, duration: 1.2, ease: "power2.inOut" }, 32.0);
    tl.fromTo("#c3-a1", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45 }, 33.4);
    tl.fromTo("#c3-a2", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45 }, 34.8);
    tl.fromTo("#c3-a3", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45 }, 36.2);

    window.__timelines["c3"] = tl;
  </script>
