  <script>
    const T = window.PROTO_TIMING || (window.parent && window.parent.PROTO_TIMING);
    if (!T) throw new Error("timeline.js missing: PROTO_TIMING unavailable");
    const S = T.shots.s4;
    const L1 = S.lines[1][0] - S.start;
    const L2 = S.lines[2][0] - S.start;

    const tl = gsap.timeline({ paused: true });

    gsap.set(["#tl-top", "#tl-bot"], { scaleX: 0 });
    gsap.set("#cross", { scaleX: 0 });
    gsap.set("#stop", { scaleX: 0 });

    // 0.40 原则已激活 —— 但这不是结论
    tl.fromTo("#s4-active", { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.5 }, 0.40);
    tl.to("#s4-active", { opacity: 0.35, duration: 0.9 }, 2.60);

    // 0.90 第一次任务的时间轴展开
    tl.to("#tl-top", { scaleX: 1, duration: 1.0, ease: "power2.inOut" }, 0.90);
    tl.fromTo("#lb-top", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.5 }, 1.10);
    tl.fromTo("#n-t1, #n-t2", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.35, stagger: 0.35 }, 1.60);
    tl.fromTo("#e-t1, #e-t2", { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.35 }, 1.65);

    // 3.40 越过了设计确认边界
    tl.fromTo("#cross", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 3.40);
    tl.to("#cross", { scaleX: 1, duration: 0.9, ease: "power2.inOut" }, 3.45);
    tl.fromTo("#n-t3", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 4.15);
    tl.fromTo("#e-t3", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 4.20);
    tl.fromTo("#s4-denied", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.45 }, 4.55);

    // 4.90 后续任务的时间轴展开：同一条边界，这次停在门前
    tl.to("#tl-bot", { scaleX: 1, duration: 0.9, ease: "power2.inOut" }, 4.90);
    tl.fromTo("#lb-bot", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.5 }, 5.05);
    tl.fromTo("#n-b1, #n-b2", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.35, stagger: 0.45 }, 5.30);
    tl.fromTo("#e-b1, #e-b2", { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.45 }, 5.33);

    // 7.40 请求批准：停在边界之前
    tl.fromTo("#stop", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 7.35);
    tl.to("#stop", { scaleX: 1, duration: 0.7, ease: "power2.out" }, 7.40);
    tl.fromTo("#n-b3", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 7.95);
    tl.fromTo("#s4-ask", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.45 }, 8.15);

    // 8.90 两种处理方式的对照
    tl.fromTo("#cmp", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.55 }, 8.90);

    // 9.80 真实观察节点（单次记录，不是实验结论）
    tl.fromTo("#obsline", { opacity: 0, scaleY: 0 },
      { opacity: 1, scaleY: 1, transformOrigin: "50% 100%", duration: 0.4 }, 9.80);
    tl.fromTo("#obs", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5 }, 10.05);
    tl.fromTo("#caveat", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.5 }, 10.70);

    // 12.15 时间轴继续延伸，但后续区域是待验证
    tl.fromTo("#future", { opacity: 0 }, { opacity: 1, duration: 0.3 }, L2);
    tl.to("#future", { scaleX: 1, duration: 1.1, ease: "power2.inOut" }, L2 + 0.05);
    tl.fromTo("#pending", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.45 }, L2 + 0.45);
    tl.fromTo("#q1, #q2, #q3", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.18 }, L2 + 0.95);

    // 14.90 Examiner 作为长期验证机制出现
    tl.fromTo("#exam", { opacity: 0, scale: 0.9, transformOrigin: "50% 50%" },
      { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.5)" }, L2 + 2.60);
    tl.fromTo("#exlbl", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.45 }, L2 + 2.95);
    tl.fromTo("#exsub", { opacity: 0 }, { opacity: 1, duration: 0.45 }, L2 + 3.25);

    // 16.20 收束：不把单次观察说成长期改善
    tl.fromTo("#concl", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6 }, 16.20);
    tl.fromTo("#wrap", { scale: 1 }, { scale: 0.985, duration: 2.6, ease: "sine.out" }, 16.40);

    window.__timelines["s4"] = tl;
