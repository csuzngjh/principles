  <script>
    const tl = gsap.timeline({ paused: true });

    // ---- Motion System（全片统一；八章同块，Phase 3 有一致性校验）----
    const M = Object.freeze({
      ease: { in: "power2.out", hero: "power3.out", agg: "power2.inOut", state: "power1.out", exit: "power2.in", cam: "sine.inOut" },
      dur: { in: 0.55, hero: 0.7, agg: 0.7, state: 0.35, exit: 0.45, cam: 4.4 },
    });

    // ---- SVG 光点：按真实路径长度采样，不依赖人工 x/y 坐标 ----
    const c8PathEl = document.querySelector("#c8-linkpath");
    const c8DotEl = document.querySelector("#c8-linkdot");

    if (!c8PathEl || !c8DotEl) {
      throw new Error("CH08 SVG path or motion dot is missing");
    }

    const c8PathLength = c8PathEl.getTotalLength();

    c8PathEl.setAttribute("stroke-dasharray", String(c8PathLength));
    c8PathEl.setAttribute("stroke-dashoffset", String(c8PathLength));

    const c8Motion = { distance: 0 };

    const updateC8Dot = () => {
      const point = c8PathEl.getPointAtLength(c8Motion.distance);
      c8DotEl.setAttribute("cx", point.x.toFixed(3));
      c8DotEl.setAttribute("cy", point.y.toFixed(3));
    };

    updateC8Dot();

    // 镜头：前 29.6 s 缓推，随后收束回稳；落版段镜头完全静止
    tl.fromTo("#c8-cam", { scale: 1, y: 0 }, { scale: 1.028, y: -8, duration: 29.6, ease: M.ease.cam, transformOrigin: "50% 46%" }, 0);
    tl.to("#c8-cam", { scale: 1, y: 0, duration: M.dur.cam, ease: M.ease.cam }, 29.6);

    // 0.25 这也是为什么 PD 还需要 Examiner（首帧即在位）
    tl.set("#c8-pdw", { opacity: 1 }, 0);
    tl.fromTo("#c8-pdw", { x: -16 }, { x: 0, duration: M.dur.hero, ease: M.ease.hero }, 0.0);
    tl.fromTo("#c8-arrowA", { opacity: 0, x: -6 }, { opacity: 1, x: 0, duration: M.dur.state, ease: M.ease.in }, 1.2);
    tl.fromTo("#c8-ex", { opacity: 0, x: 18 }, { opacity: 1, x: 0, duration: M.dur.hero, ease: M.ease.hero }, 1.5);

    // 3.61 一次正确的表现，只是开始（上一组退场，收成单点）
    tl.to(["#c8-pdw", "#c8-arrowA", "#c8-ex"], { opacity: 0, duration: M.dur.exit, ease: M.ease.exit, stagger: 0.04 }, 3.5);
    tl.fromTo("#c8-one", { opacity: 0, y: 14, scale: 0.985 }, { opacity: 1, y: 0, scale: 1, duration: M.dur.hero, ease: M.ease.hero }, 3.72);

    // 6.55 四个检验问题：逐项揭示，已说过的问题降权
    tl.to("#c8-one", { opacity: 0, duration: M.dur.exit, ease: M.ease.exit }, 6.35);
    tl.fromTo("#c8-q1", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: M.dur.in, ease: M.ease.in }, 6.75);
    tl.fromTo("#c8-q2", { opacity: 0, y: 16 }, { opacity: 0.92, y: 0, duration: M.dur.in, ease: M.ease.in }, 10.3);
    tl.to("#c8-q1", { opacity: 0.5, duration: M.dur.in }, 10.3);
    tl.fromTo("#c8-q3", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: M.dur.in, ease: M.ease.in }, 13.3);
    tl.to(["#c8-q1", "#c8-q2"], { opacity: 0.4, duration: M.dur.in }, 13.3);
    tl.fromTo("#c8-q4", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: M.dur.in, ease: M.ease.in }, 17.6);
    tl.to(["#c8-q1", "#c8-q2", "#c8-q3"], { opacity: 0.28, duration: M.dur.in }, 17.6);
    tl.to("#c8-q4", { opacity: 1, duration: M.dur.in }, 18.2);

    // 21.71 Examiner 持续观察：问题让位，PD 与 Examiner 之间画出连接
    tl.to(".q8", { opacity: 0, duration: M.dur.exit, ease: M.ease.exit, stagger: 0.03 }, 21.55);
    tl.fromTo("#c8-rp", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: M.dur.in, ease: M.ease.in }, 21.9);
    tl.fromTo("#c8-link", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 22.5);
    // SVG 路径自身的描边动画
    tl.to("#c8-linkpath", { strokeDashoffset: 0, duration: 1.1, ease: M.ease.agg }, 22.55);

    // 光点亮起
    tl.fromTo("#c8-linkdot", { opacity: 0 }, { opacity: 1, duration: 1.1, ease: "none" }, 22.55);

    // 光点沿 SVG 实际路径运动
    tl.to(c8Motion, { distance: c8PathLength, duration: 1.1, ease: M.ease.agg, onUpdate: updateC8Dot }, 22.55);
    tl.fromTo("#c8-ra", { opacity: 0 }, { opacity: 1, duration: M.dur.state }, 23.2);
    tl.fromTo("#c8-re", { opacity: 0, x: 18 }, { opacity: 1, x: 0, duration: M.dur.hero, ease: M.ease.hero }, 23.4);

    // 26.20 不是让 Agent 记住更多
    tl.to(["#c8-rp", "#c8-ra", "#c8-re"], { opacity: 0, duration: M.dur.exit, ease: M.ease.exit }, 26.0);
    tl.to("#c8-link", { opacity: 0, duration: M.dur.exit }, 26.0);
    tl.fromTo("#c8-not", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: M.dur.in, ease: M.ease.in }, 26.3);

    // 29.90 而是让一次纠正，成为下一次正确选择的开始
    tl.to("#c8-not", { opacity: 0, duration: M.dur.exit, ease: M.ease.exit }, 29.75);
    tl.fromTo("#c8-is", { opacity: 0, y: 16, clipPath: "inset(0% 0% 100% 0%)" }, { opacity: 1, y: 0, clipPath: "inset(0% 0% 0% 0%)", duration: M.dur.hero, ease: M.ease.hero }, 30.0);

    tl.to("#c8-is", { opacity: 0, y: -90, duration: M.dur.exit, ease: M.ease.exit }, 34.0);
    tl.fromTo("#c8-brand", { opacity: 0, y: 14, scale: 1.02 }, { opacity: 1, y: 0, scale: 1, duration: M.dur.hero, ease: M.ease.hero }, 34.55);
    tl.fromTo("#c8-rule", { opacity: 0, scaleX: 0.6 }, { opacity: 1, scaleX: 1, duration: 0.85, ease: M.ease.agg, transformOrigin: "50% 50%" }, 35.1);

    // 36.66 落版标语：37.50 完成，此后到章末 41.437 保持稳定（3.94 s）
    tl.fromTo("#c8-tag", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.75, ease: M.ease.in }, 36.75);

    window.__timelines["c8"] = tl;
