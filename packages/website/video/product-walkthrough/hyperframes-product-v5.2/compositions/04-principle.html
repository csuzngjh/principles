  <script>
    const tl = gsap.timeline({ paused: true });

    // ---- Motion System（全片统一；八章同块，Phase 3 有一致性校验）----
    const M = Object.freeze({
      ease: { in: "power2.out", hero: "power3.out", agg: "power2.inOut", state: "power1.out", exit: "power2.in", cam: "sine.inOut" },
      dur: { in: 0.55, hero: 0.7, agg: 0.7, state: 0.35, exit: 0.45, cam: 4.4 },
    });

    // SVG 主轴光点：在最终路径上采样，保证运动点始终贴合路径
    const c4PathEl = document.querySelector("#c4-track-path");
    const c4PulseEl = document.querySelector("#c4-pulse");
    if (!c4PathEl || !c4PulseEl) {
      throw new Error("CH04 decision path or pulse is missing");
    }
    const c4PathLength = c4PathEl.getTotalLength();
    const c4Motion = { distance: 0 };
    const updateC4Pulse = () => {
      const point = c4PathEl.getPointAtLength(c4Motion.distance);
      c4PulseEl.setAttribute("cx", point.x.toFixed(3));
      c4PulseEl.setAttribute("cy", point.y.toFixed(3));
    };
    updateC4Pulse();

    // 镜头：诊断段缓推 → 原则成形时保持 → 沉淀为判断依据时回稳（动态转稳定）
    tl.fromTo("#c4-cam", { scale: 1, y: 0 }, { scale: 1.028, y: -8, duration: 40.0, ease: M.ease.cam, transformOrigin: "50% 46%" }, 0);
    tl.to("#c4-cam", { scale: 1.014, y: -4, duration: 7.7, ease: M.ease.cam }, 40.0);
    tl.to("#c4-cam", { scale: 1, y: 0, duration: 4.6, ease: M.ease.cam }, 47.7);

    // 0.25 诊断：理解问题背后的原因（首帧即在位，只做位移）
    tl.set("#c4-diag", { opacity: 1 }, 0);
    tl.fromTo("#c4-diag", { y: -8 }, { y: 0, duration: 0.5, ease: M.ease.in }, 0);
    tl.fromTo("#c4-c1", { opacity: 0, y: 16, clipPath: "inset(0% 0% 100% 0%)" }, { opacity: 1, y: 0, clipPath: "inset(0% 0% 0% 0%)", duration: M.dur.hero, ease: M.ease.hero }, 2.2);
    tl.fromTo("#c4-c2", { opacity: 0, y: 16, clipPath: "inset(0% 0% 100% 0%)" }, { opacity: 1, y: 0, clipPath: "inset(0% 0% 0% 0%)", duration: M.dur.hero, ease: M.ease.hero }, 4.0);

    // 7.74 真正需要解决的两件事
    tl.to(["#c4-c1", "#c4-c2"], { borderColor: "rgba(226,184,107,0.45)", duration: 0.7 }, 8.0);
    tl.to(["#c4-c1", "#c4-c2"], { borderColor: "rgba(126,184,218,0.16)", duration: 0.7 }, 13.6);

    // 16.07 最终形成的原则是：两因向中间收束，原则文字从收束点成形
    tl.to("#c4-diag", { opacity: 0, y: -14, duration: 0.5, ease: M.ease.exit }, 16.0);
    tl.to("#c4-c1", { opacity: 0, x: 150, scale: 0.94, duration: M.dur.agg, ease: M.ease.agg }, 16.0);
    tl.to("#c4-c2", { opacity: 0, x: -150, scale: 0.94, duration: M.dur.agg, ease: M.ease.agg }, 16.05);
    tl.fromTo("#c4-lead", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: M.ease.in }, 16.3);

    // 18.44 原则原文：自下而上遮罩揭示，形成稳定的重量
    tl.fromTo("#c4-ruletext", { opacity: 0, y: 18, clipPath: "inset(0% 0% 100% 0%)" }, { opacity: 1, y: 0, clipPath: "inset(0% 0% 0% 0%)", duration: 0.85, ease: M.ease.hero }, 18.4);

    // 五个步骤先依次落位；在最后一张卡片出现前，不提前显示空悬的长横线
    tl.fromTo("#c4-t1", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: M.ease.in }, 24.0);
    tl.fromTo("#c4-t2", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: M.ease.in }, 25.6);
    tl.fromTo("#c4-t3", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: M.ease.in }, 27.6);
    tl.fromTo("#c4-t4", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: M.ease.in }, 30.0);
    tl.fromTo("#c4-t5", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: M.ease.in }, 32.6);

    // 五步全部就位后，连接支线与主轴同时出现；主轴从起伏状态收束为稳定判断链
    tl.fromTo("#c4-track", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: M.ease.in }, 33.05);
    tl.fromTo("#c4-track-path",
      { attr: { d: "M 0 32 C 120 -28 240 92 360 32 C 480 92 600 -28 721 32 C 800 -24 890 88 970 32 C 1055 88 1145 -24 1229 32" } },
      { attr: { d: "M 0 32 C 120 32 240 32 360 32 C 480 32 600 32 721 32 C 800 32 890 32 970 32 C 1055 32 1145 32 1229 32" }, duration: 2.2, ease: "power3.inOut", immediateRender: false },
      33.1);

    // 五个锚点按步骤顺序点亮；最后一束光沿已经收束的主轴走完五步
    tl.fromTo("#c4-node-1", { opacity: 0, scale: 0.35 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, 33.2);
    tl.fromTo("#c4-node-2", { opacity: 0, scale: 0.35 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, 33.4);
    tl.fromTo("#c4-node-3", { opacity: 0, scale: 0.35 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, 33.6);
    tl.fromTo("#c4-node-4", { opacity: 0, scale: 0.35 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, 33.8);
    tl.fromTo("#c4-node-5", { opacity: 0, scale: 0.35 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, 34.0);
    tl.fromTo("#c4-pulse", { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "none" }, 35.35);
    tl.to(c4Motion, { distance: c4PathLength, duration: 1.15, ease: "power2.inOut", onUpdate: updateC4Pulse }, 35.35);
    tl.to("#c4-pulse", { opacity: 0, duration: 0.25, ease: M.ease.exit }, 36.45);

    tl.fromTo("#c4-scope", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: M.ease.in }, 36.8);

    // 40.69 简单低风险修复：不增加机械审批
    tl.fromTo("#c4-light", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6 }, 40.8);
    tl.to(["#c4-t1", "#c4-t2", "#c4-t3", "#c4-t4", "#c4-t5", "#c4-scope"], { opacity: 0.3, duration: 0.6 }, 41.0);

    // 47.67 沉淀为可复用的判断依据：动态收住，落成一枚稳定 token
    tl.to(["#c4-lead", "#c4-light"], { opacity: 0, duration: 0.6, ease: M.ease.exit }, 47.7);
    tl.to([".chip4", "#c4-scope"], { opacity: 0.1, duration: 0.7 }, 47.7);
    tl.to("#c4-track", { opacity: 0, duration: 0.7 }, 47.7);
    tl.to("#c4-ruletext", { opacity: 0.3, duration: 0.7 }, 47.7);
    tl.fromTo("#c4-rule", { opacity: 0, scaleX: 0 }, { opacity: 0.9, scaleX: 1, duration: 1.1, ease: "power2.inOut" }, 47.9);
    tl.fromTo("#c4-token", { opacity: 0, y: 10, scale: 1.04 }, { opacity: 1, y: 0, scale: 1, duration: M.dur.hero, ease: M.ease.hero }, 49.2);
    tl.fromTo("#c4-sink", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.7, ease: M.ease.in }, 50.4);

    window.__timelines["c4"] = tl;
  </script>
