name: Deploy Website

on:
  push:
    branches:
      - main
    # The website build reads only packages/website + the workspace manifests.
    # A merge that touches none of these cannot change the deployed bytes, so
    # it must not spend a runner on LFS checkout + full VitePress build.
    # workflow_dispatch still bypasses the filter for a manual redeploy.
    paths:
      - 'packages/website/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

# Back-to-back merges: the newer run deploys newer bytes, so the older one is
# worthless. Never cancel a manual dispatch's predecessor differently — the
# group is per ref, and main is the only branch this workflow deploys.
concurrency:
  group: deploy-website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with Git LFS)
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Verify LFS assets pulled
        run: |
          # Fail fast if mp4/webp are still LFS pointers (130 bytes) instead of real content
          for f in \
            packages/website/public/homepage-demo-zh.mp4 \
            packages/website/public/homepage-demo-en.mp4 \
            packages/website/public/images/homepage-demo-poster-zh.webp \
            packages/website/public/images/homepage-demo-poster-en.webp; do
            size=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$size" -lt 1024 ]; then
              echo "::error::$f is $size bytes — Git LFS pull failed (expected real content >1KB)"
              exit 1
            fi
            echo "[ok] $f: $size bytes"
          done

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run docs:build -w @principles/website

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/website
          command: pages deploy --project-name=principles-website --branch=main
