name: Deploy Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with Git LFS)
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Verify LFS assets pulled
        run: |
          # Fail fast if mp4/webp are still LFS pointers (130 bytes) instead of real content
          for f in \
            packages/website/public/homepage-demo-zh.mp4 \
            packages/website/public/homepage-demo-en.mp4 \
            packages/website/public/images/homepage-demo-poster-zh.webp \
            packages/website/public/images/homepage-demo-poster-en.webp; do
            size=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$size" -lt 1024 ]; then
              echo "::error::$f is $size bytes — Git LFS pull failed (expected real content >1KB)"
              exit 1
            fi
            echo "[ok] $f: $size bytes"
          done

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run docs:build -w @principles/website

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: principles-website
          directory: packages/website/.vitepress/dist
          branch: main
