name: Version Packages

# SPEC v1.2 §16 — the rolling Version Packages PR automation. The changesets
# action ONLY creates/updates the Version PR; it never publishes, never tags,
# never creates GitHub releases (create-github-releases/push-git-tags are
# explicitly off — those are PD publish-train closing steps).
#
# The same workflow closes the release-cohort loop: when a push to main IS the
# Version PR landing commit — proven by reproduction against its first parent,
# not by message/actor or merge-vs-squash shape — it dispatches the publish
# train bound to that exact SHA (SPEC §17, PRI-922).

on:
  push:
    branches: [main]
  # PRI-1014: human recovery entry for a wedged Version PR branch. The
  # workflow still never runs for pull_request events.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # gh workflow run in the cohort-dispatch step below.
  actions: write

concurrency:
  group: version-packages-main
  cancel-in-progress: false

jobs:
  version:
    name: Version Packages PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # The action pushes with its own github-token; the checkout
          # credential is not needed and stays out of scope.
          persist-credentials: false
          # Cohort detection may need first-parent history.
          fetch-depth: 100

      - name: Fetch existing Version PR branch
        # PRI-1014: changesets/action does `git checkout changeset-release/main`
        # before materializing. If that ref is absent, it creates a branch from
        # main and then its ref update is rejected when the Version PR branch
        # already exists. Fetch ONLY this bot branch, and tolerate its absence
        # (normal case immediately after a Version PR merge), so ordinary
        # checkouts and PR flows are untouched.
        run: |
          if git ls-remote --exit-code --heads origin changeset-release/main >/dev/null 2>&1; then
            git fetch --no-tags origin "+refs/heads/changeset-release/main:refs/heads/changeset-release/main"
          else
            echo "No existing changeset-release/main branch — the action will create one."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check Version PR token
        id: token-check
        env:
          PD_VERSION_PR_TOKEN: ${{ secrets.PD_VERSION_PR_TOKEN }}
        run: |
          if [ -z "$PD_VERSION_PR_TOKEN" ]; then
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PD_VERSION_PR_TOKEN is not configured — skipping Version Packages PR creation. Without the secret the action falls back to GITHUB_TOKEN, which this repository does not permit to create pull requests (and whose PRs would not trigger required checks anyway). Pending changesets stay pending until the secret exists. Setup: GitHub → Settings → Secrets and variables → Actions → New repository secret PD_VERSION_PR_TOKEN = a fine-grained PAT with contents:write + pull-requests:write."
          else
            echo "armed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize version plan (changeset version + mirror + lockfile)
        id: changesets
        if: steps.token-check.outputs.armed == 'true'
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # PD's materialization pipeline: changeset version, the approved
          # component mirror, and lockfile materialization (SPEC §13).
          # npm ci above already installed the workspace the CLI needs.
          version-script: node scripts/release/materialize-version-plan.mjs
          commit-message: 'chore: version packages [version-packages]'
          pr-title: 'Version Packages'
          # PD owns tags/releases in the publish train (SPEC §16/§25/§26).
          create-github-releases: false
          push-git-tags: false
          # PRI-1014: the GitHub API force-update path returned
          # "Reference cannot be updated" once the Version PR branch tip had
          # diverged from main. The action's Git CLI push path is the supported
          # way to rebuild that bot branch; it uses the same github-token below.
          push-with-git-cli: true
          # Manual workflow_dispatch must never inherit the operator's current
          # branch as the PR base; the Version PR always targets main.
          pr-base-branch: main
          # PD_VERSION_PR_TOKEN (a fine-grained PAT with contents:write +
          # pull-requests:write) is REQUIRED on this repository: the repo
          # setting does not permit GITHUB_TOKEN to create pull requests
          # (observed at the first post-cutover run, 2026-09-21), and a
          # GITHUB_TOKEN PR would not trigger the required
          # "Verify Merge Gate" check anyway. The token-check step above
          # skips this action with setup instructions until the secret
          # exists.
          github-token: ${{ secrets.PD_VERSION_PR_TOKEN || github.token }}

      - name: Dispatch publish train on cohort merge
        # A push that leaves NO pending changesets and IS the Version PR
        # landing commit = a release cohort. Dispatch the publish train bound
        # to this exact SHA; feature pushes are ignored.
        if: steps.changesets.outputs.has-changesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if node scripts/release/resolve-release-cohort.mjs --is-cohort "$GITHUB_SHA"; then
            echo "Release cohort detected at $GITHUB_SHA — dispatching publish train."
            gh workflow run publish-npm.yml --ref main -f cohort_sha="$GITHUB_SHA"
          else
            echo "Not a release cohort — no publish dispatch."
          fi
