name: Release Reproducibility (Full Matrix)

# Tier 2: full-platform double-build verification. Runs as a mandatory
# reusable gate in publish-npm.yml or by explicit manual dispatch. PRs use
# the quick-check workflow
# (release-reproducibility.yml) for fast feedback; this workflow provides
# the definitive per-platform byte-reproducibility evidence required by
# SPEC §18-3 before release publication.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit to verify — the release cohort SHA when called from the publish train (SPEC v1.2 G5); empty = the triggering SHA.'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit to verify (defaults to the triggering SHA).'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  native-release-matrix:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025]
        node: ['22.22.2', '24.12.0', '26.7.0']
    runs-on: ${{ matrix.runner }}
    # 60 min: Windows runners need well beyond 30 min for npm ci + all
    # workspace builds + the double-build byte comparison + the smoke
    # install. Multiple Windows/macOS-Intel matrix jobs were cancelled by
    # this job-level timeout at exactly the 30-minute boundary while inside
    # the smoke step (run evidence in the PR) — with no failure logs, which
    # read as mystery cancellations. Keep a timeout (never remove it); only
    # raise it to cover the measured real duration.
    timeout-minutes: 60
    env:
      SOURCE_DATE_EPOCH: '1700000000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Build every release component from the clean checkout
        run: |
          npm run build
          npm run build:production --workspace=principles-disciple
          npm run build --workspace=principles-disciple
          npm run build --workspace=@principles/pd-cli
          npm run build --workspace=@principles/pd-console
          npm run build --workspace=create-principles-disciple
      - name: Build the real production asset twice and compare bytes
        shell: bash
        run: |
          # PRI-874: the asset carries its EMBEDDED product identity (SPEC
          # §12) — the installer refuses unstamped payloads and the upgrade
          # gate derives candidateVersion from this stamp. Both builds use
          # the same resolved identity so the byte comparison stays valid.
          PRODUCT_VERSION="$(node scripts/resolve-product-version.mjs)"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          node packages/create-principles-disciple/scripts/build-self-contained-release.mjs --output "$PUBLICATION_ONE" --product-version "$PRODUCT_VERSION" --source-commit "$SOURCE_COMMIT"
          node packages/create-principles-disciple/scripts/build-self-contained-release.mjs --output "$PUBLICATION_TWO" --product-version "$PRODUCT_VERSION" --source-commit "$SOURCE_COMMIT"
          if node packages/create-principles-disciple/scripts/compare-release-archives.mjs \
            "$PUBLICATION_ONE/asset.tar" \
            "$PUBLICATION_TWO/asset.tar"; then
            rm -rf "$PUBLICATION_ONE" "$PUBLICATION_TWO/payload"
          else
            node packages/create-principles-disciple/scripts/diff-release-archives.mjs \
              "$PUBLICATION_ONE/asset.tar" "$PUBLICATION_TWO/asset.tar" || true
            exit 1
          fi
        env:
          PUBLICATION_ONE: ${{ runner.temp }}/pd-publication-one
          PUBLICATION_TWO: ${{ runner.temp }}/pd-publication-two
      - name: Install and probe the published archive without npm
        run: npm test --workspace=create-principles-disciple -- --run tests/release-asset-smoke.test.ts
        env:
          PD_RELEASE_SMOKE_PUBLICATION: ${{ runner.temp }}/pd-publication-two
      # PRI-671: the LINUX N-1 → candidate N upgrade gate stays cost-cheap in
      # the matrix (~8 min on ubuntu, run evidence) and keeps per-release Linux
      # gate evidence. The WINDOWS gate is its own job (upgrade-gate-windows):
      # Windows apply-full measures 17-23 min and cannot share the smoke job's
      # 60 min budget.
      - name: N-1 to N real upgrade gate (Console /apply-full, linux)
        if: matrix.runner == 'ubuntu-24.04' && matrix.node == '22.22.2'
        run: npm test --workspace=create-principles-disciple -- --run tests/release-upgrade-gate.test.ts
        env:
          PD_RELEASE_SMOKE_PUBLICATION: ${{ runner.temp }}/pd-publication-two
          # PRI-874: the test copies transaction journals + a state summary
          # here BEFORE its temp-root cleanup, so failures stay diagnosable.
          PD_UPGRADE_GATE_DIAG_DIR: ${{ github.workspace }}/upgrade-gate-diagnostics
      # PRI-913: junction lifecycle regression (real install → reconcile
      # idempotency → mixed-tree diagnosis → rollback → uninstall) on the
      # same double-build-verified asset. Linux leg here; the authoritative
      # Windows reparse semantics run in the upgrade-gate-windows job.
      - name: Junction lifecycle gate (linux)
        if: matrix.runner == 'ubuntu-24.04' && matrix.node == '22.22.2'
        run: npm test --workspace=create-principles-disciple -- --run tests/release-junction-lifecycle.test.ts
        env:
          PD_RELEASE_SMOKE_PUBLICATION: ${{ runner.temp }}/pd-publication-two
      - name: Upload upgrade-gate diagnostics on failure
        if: matrix.runner == 'ubuntu-24.04' && matrix.node == '22.22.2' && failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade-gate-diagnostics-linux
          path: upgrade-gate-diagnostics
          if-no-files-found: ignore
          retention-days: 7
      # Hand the double-build-verified WINDOWS asset to the standalone
      # upgrade-gate-windows job (incident platform only — the gate derives
      # its N-1 payload from THIS exact asset).
      - name: Upload release asset for the windows upgrade gate
        if: matrix.runner == 'windows-2025' && matrix.node == '22.22.2'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-asset-windows
          path: ${{ runner.temp }}/pd-publication-two
          if-no-files-found: error
          retention-days: 1

  # PRI-671 Phase 2: the Windows N-1 → candidate N upgrade gate is a
  # disaster-recovery rehearsal, not a release smoke — it gets its own runner
  # slot and its own 120 min budget. It reuses the double-build-verified
  # windows asset (no asset rebuild) plus the same package build steps the
  # gate harness needs. Windows-only: the incident platform; ubuntu coverage
  # stays inside the matrix.
  upgrade-gate-windows:
    name: N-1 to N real upgrade gate (windows-2025, 22.22.2)
    needs: native-release-matrix
    runs-on: windows-2025
    # 180 min: measured full upgrade gate on Windows ≈ 50-60 min (extract-n +
    # extract-n1 ≈ 21 min, install ≈ 7 min, apply-full ≈ 17-23 min) PLUS the
    # PRI-913 junction lifecycle leg (one extract + two real installs with
    # backup/restore churn, ≈ 45-60 min on the same Defender-scanned disk);
    # the smoke job's 60 min budget cannot hold either heavy leg.
    timeout-minutes: 180
    env:
      SOURCE_DATE_EPOCH: '1700000000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      # The gate restamps the derived N-1 payload with the production asset
      # builder and drives the installed console; both need the workspace
      # build artifacts (not a rebuild of the release asset itself).
      - name: Build every release component from the clean checkout
        run: |
          npm run build
          npm run build:production --workspace=principles-disciple
          npm run build --workspace=principles-disciple
          npm run build --workspace=@principles/pd-cli
          npm run build --workspace=@principles/pd-console
          npm run build --workspace=create-principles-disciple
      - name: Download the double-build-verified windows release asset
        uses: actions/download-artifact@v4
        with:
          name: release-asset-windows
          path: ${{ runner.temp }}/pd-publication-two
      - name: N-1 to N real upgrade gate (Console /apply-full, windows)
        run: npm test --workspace=create-principles-disciple -- --run tests/release-upgrade-gate.test.ts
        env:
          PD_RELEASE_SMOKE_PUBLICATION: ${{ runner.temp }}/pd-publication-two
          # PRI-874: journals + state summary land here before temp cleanup.
          PD_UPGRADE_GATE_DIAG_DIR: ${{ github.workspace }}/upgrade-gate-diagnostics
      # PRI-913: the Windows reparse-point lifecycle (real install → reconcile
      # idempotency → mixed-tree diagnosis → rollback restore → uninstall
      # safety) on the SAME double-build-verified asset. This is the
      # authoritative junction leg — Windows junctions are the production
      # topology the PRI-912 pass ships.
      - name: Junction lifecycle gate (windows)
        run: npm test --workspace=create-principles-disciple -- --run tests/release-junction-lifecycle.test.ts
        env:
          PD_RELEASE_SMOKE_PUBLICATION: ${{ runner.temp }}/pd-publication-two
      - name: Upload upgrade-gate diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade-gate-diagnostics-windows
          path: upgrade-gate-diagnostics
          if-no-files-found: ignore
          retention-days: 7
