name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Lightweight meta-checks — a superseded commit's labels/audit have no value.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Auto Label PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  size:
    name: Check PR Size
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Label PR Size
        uses: codelytv/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: 'size/XS'
          xs_max_size: '10'
          s_label: 'size/S'
          s_max_size: '100'
          m_label: 'size/M'
          m_max_size: '500'
          l_label: 'size/L'
          l_max_size: '1000'
          xl_label: 'size/XL'
          fail_if_xl: 'false'

  welcome:
    name: Welcome First Time Contributor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v3
        # This action returns exit code 1 for non-first-time contributors
        # which is expected behavior, not an error
        continue-on-error: true
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pr-message: |
            👋 Welcome! Thanks for your first contribution to Principles Disciple!
            A maintainer will review your PR soon.

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    # 10m was exceeded (cancelled mid `npm audit`) in the 2026-09-04
    # slow-registry window: `npm ci` + `npm audit` are both registry-bound.
    # Budget 30m so a slow registry degrades speed, not the verdict.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          # 22 (the CI default) instead of 24: `npm audit` resolves the tree
          # from package-lock.json and is Node-version agnostic. VERIFIED
          # 2026-11-18 on the same lockfile rather than assumed:
          #   node 22.23.5 / npm 10.9.11 vs node 24.22.3 / npm 11.21.3
          #   -> same 16 advisories, same 11 vulnerabilities (7 high, 4
          #      moderate), same `--audit-level=high` exit code 1, and the
          #      same 409 resolved prod packages. The only difference is
          #      npm 11's `fixAvailable` suggestion text, which this job does
          #      not consume. Sharing the main cache entry therefore costs
          #      nothing and avoids a third ~1.5GB entry.
          node-version: '22'
          cache: 'npm'
      # Shared materialized-install cache. This job only needs the tree for
      # `npm audit`; a hit skips the ~40s install entirely.
      - name: Restore node_modules
        uses: ./.github/actions/restore-node-modules
        with:
          node-version: '22'
      - name: npm audit (high+)
        run: npm audit --audit-level=high --omit=dev || true
        # Non-blocking for now: surface issues without failing PRs.
        # Tighten to blocking once current high advisories are triaged.
