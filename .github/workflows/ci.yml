name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # Manual re-trigger: PR-event delivery has proven lossy during platform
  # incidents; dispatch runs the exact same jobs on any ref.
  workflow_dispatch:

# A new commit on a PR makes the previous commit's run worthless — cancel it
# so queued runner capacity goes to the newest HEAD. Main/develop pushes and
# other events never cancel (their runs have independent value).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # CI Impact Resolver — SHADOW MODE (CI Governance SPEC §9).
  # Computes and REPORTS the predicted verification scopes for this PR but
  # does not gate or skip anything: every job below still runs exactly as
  # before. The prediction lands in the Step Summary and as an artifact so
  # shadow evaluation can later compare predictions against real outcomes
  # (false-negative hunting) before any enforcement PR exists.
  impact:
    name: CI Impact (Shadow)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          # Full history so the base SHA of the PR event is reachable.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'

      - name: Compute CI impact (SHADOW — nothing is skipped)
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse HEAD~1)"
          fi
          if [ -z "$HEAD" ]; then
            HEAD="$(git rev-parse HEAD)"
          fi
          echo "base=$BASE head=$HEAD"
          node scripts/ci/impact.mjs --base "$BASE" --head "$HEAD" --format json > impact.json
          node scripts/ci/impact.mjs --base "$BASE" --head "$HEAD" --format markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload impact prediction (shadow evidence)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.0.1
        with:
          name: ci-impact-${{ github.sha }}
          path: impact.json
          retention-days: 30

  verify-merge:
    name: Verify Merge Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          # Full history so check-runtime-contract can resolve origin/main...HEAD.
          fetch-depth: 0
          # verify:merge runs test:website, whose homepage-contract test reads
          # the real .mp4/.webp LFS assets. Without LFS, they are 132-byte
          # pointer files and the size assertion fails.
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run canonical merge gate
        run: npm run verify:merge

  release-parity:
    name: Release Build Parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (workspace root)
        run: npm ci --ignore-scripts

      - name: Build workspace (core then plugin)
        run: npm run build

      - name: Verify publish dry-run
        working-directory: packages/openclaw-plugin
        run: |
          set -o pipefail
          npm pack --dry-run 2>&1 | head -50

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run ESLint
        run: npm run lint --if-present

  # The former `test` matrix job (Node 20/22) ran `npm test --if-present` at
  # the workspace root, which has NO test script — a ~25s no-op per matrix
  # leg. Real coverage comes from the per-package jobs below, and the
  # installer package (the only product that pins engines) requires
  # node >=22, so the Node 20 leg covered nothing. Removed 2026-08-27.

  # Per-package test jobs: verify:merge does NOT run package tests. These
  # jobs are the real coverage for every package.

  test-principles-core:
    name: Test principles-core
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules (better-sqlite3)
        run: npm rebuild better-sqlite3

      - name: Build
        working-directory: packages/principles-core
        run: npm run build

      - name: Test with coverage
        working-directory: packages/principles-core
        run: npm run test -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./packages/principles-core/coverage/coverage-final.json
          flags: principles-core
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  test-pd-cli:
    name: Test pd-cli
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules (better-sqlite3)
        run: npm rebuild better-sqlite3

      - name: Build core dependency
        run: npm run build --workspace=@principles/core

      - name: Build install layout dependency
        run: npm run build --workspace=@principles/install-layout

      - name: Build host runtime dependency
        run: npm run build --workspace=@principles/host-runtime

      - name: Build codex adapter dependency
        run: npm run build --workspace=@principles/codex-adapter

      - name: Build plugin dependency
        run: npm run build --workspace=principles-disciple

      - name: Build and test
        working-directory: packages/pd-cli
        run: npm run build && npm test

  test-pd-companion:
    name: Test pd-companion
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      # --ignore-scripts matches sibling jobs; companion unit tests exercise
      # the pure lib layer only — the electron binary is not needed on Linux.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build install layout dependency
        run: npm run build --workspace=@principles/install-layout

      - name: Build and test
        working-directory: packages/pd-companion
        run: npm run build && npm test

  test-pd-console:
    name: Test pd-console
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules (better-sqlite3)
        run: npm rebuild better-sqlite3

      - name: Build dependencies
        run: npm run build

      - name: Test with coverage
        working-directory: packages/pd-console
        run: npm run test -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./packages/pd-console/coverage/coverage-final.json
          flags: pd-console
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # The two heavy smoke suites (real npm pack → real install → real release
  # asset build) are ~97% of this package's test wall time. They run as
  # separate PARALLEL jobs so the fast contract/unit suite stops queueing
  # behind them. Each job rebuilds its own dependencies — the smokes MUST
  # construct their own real artifacts (hermetic semantics preserved); only
  # the dependency build is duplicated, never the artifact under test.
  test-create-principles-disciple:
    name: Test create-principles-disciple
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules (better-sqlite3)
        run: npm rebuild better-sqlite3

      - name: Build dependencies
        run: |
          npm run build --workspace=@principles/core
          npm run build --workspace=@principles/install-layout
          npm run build --workspace=@principles/host-runtime
          npm run build --workspace=@principles/codex-adapter
          npm run build:bundle --workspace=principles-disciple
          npm run build --workspace=principles-disciple
          npm run build --workspace=@principles/pd-cli
          npm run build --workspace=@principles/pd-console

      - name: Build and test (fast suite)
        working-directory: packages/create-principles-disciple
        run: npm run build && npm run test:fast

  smoke-packaged-install:
    name: Test packaged install smoke
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules (better-sqlite3)
        run: npm rebuild better-sqlite3

      - name: Build dependencies
        run: |
          npm run build --workspace=@principles/core
          npm run build --workspace=@principles/install-layout
          npm run build --workspace=@principles/host-runtime
          npm run build --workspace=@principles/codex-adapter
          npm run build:bundle --workspace=principles-disciple
          npm run build --workspace=principles-disciple
          npm run build --workspace=@principles/pd-cli
          npm run build --workspace=@principles/pd-console

      - name: Build and run packaged install smoke
        working-directory: packages/create-principles-disciple
        run: npm run build && npm run test:smoke:packaged

  smoke-release-asset:
    name: Test release asset smoke
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules (better-sqlite3)
        run: npm rebuild better-sqlite3

      - name: Build dependencies
        run: |
          npm run build --workspace=@principles/core
          npm run build --workspace=@principles/install-layout
          npm run build --workspace=@principles/host-runtime
          npm run build --workspace=@principles/codex-adapter
          npm run build:bundle --workspace=principles-disciple
          npm run build --workspace=principles-disciple
          npm run build --workspace=@principles/pd-cli
          npm run build --workspace=@principles/pd-console

      - name: Build and run release asset smoke
        working-directory: packages/create-principles-disciple
        run: npm run build && npm run test:smoke:release-asset

  test-scripts:
    name: Test scripts
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test scripts
        run: npm run test:scripts

  test-host-runtime:
    name: Test host-runtime
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules (better-sqlite3)
        run: npm rebuild better-sqlite3

      - name: Build dependencies
        run: |
          npm run build --workspace=@principles/core
          npm run build --workspace=@principles/install-layout

      - name: Build and test
        run: npm run build --workspace=@principles/host-runtime && npm test --workspace=@principles/host-runtime

  test-host-runtime-parity:
    name: Test host runtime parity
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules (better-sqlite3)
        run: npm rebuild better-sqlite3

      - name: Build runtime dependencies and OpenClaw plugin
        run: |
          npm run build --workspace=@principles/core
          npm run build --workspace=@principles/install-layout
          npm run build --workspace=@principles/host-runtime
          npm run build --workspace=principles-disciple

      - name: Verify real OpenClaw host parity and published bundle
        run: npm run test:host-runtime-parity --workspace=principles-disciple

  test-codex-adapter:
    name: Test codex-adapter
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules (better-sqlite3)
        run: npm rebuild better-sqlite3

      - name: Build runtime dependencies
        run: |
          npm run build --workspace=@principles/core
          npm run build --workspace=@principles/install-layout
          npm run build --workspace=@principles/host-runtime

      - name: Build and test adapter
        run: npm test --workspace=@principles/codex-adapter

  build-openclaw-plugin:
    name: Build OpenClaw Plugin
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: TypeScript Check
        working-directory: packages/openclaw-plugin
        run: npx tsc --noEmit

      - name: Production Build & Verify
        working-directory: packages/openclaw-plugin
        run: npm run build:production

  typecheck-pd-console:
    name: TypeScript Check (pd-console)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build dependencies
        run: npm run build

      - name: TypeScript Check
        working-directory: packages/pd-console
        run: npx tsc --noEmit

  test-openclaw-plugin-unit:
    name: Test OpenClaw Plugin (unit)
    runs-on: ubuntu-latest
    needs: build-openclaw-plugin
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        working-directory: packages/openclaw-plugin
        run: npm ci

      - name: Build dependencies
        run: npm run build

      - name: Run unit tests
        working-directory: packages/openclaw-plugin
        run: npm run test:unit

  test-openclaw-plugin-integration:
    name: Test OpenClaw Plugin (integration)
    runs-on: ubuntu-latest
    needs: build-openclaw-plugin
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        working-directory: packages/openclaw-plugin
        run: npm ci

      - name: Build dependencies
        run: npm run build

      - name: Run integration tests
        working-directory: packages/openclaw-plugin
        run: npm run test:integration

  test-openclaw-plugin-coverage:
    name: Test OpenClaw Plugin (coverage)
    runs-on: ubuntu-latest
    needs: build-openclaw-plugin
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install --include=dev

      - name: Build dependencies
        run: npm run build

      - name: Build production artifacts
        working-directory: packages/openclaw-plugin
        run: npm run build:production

      - name: Run tests with coverage
        working-directory: packages/openclaw-plugin
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./packages/openclaw-plugin/coverage/coverage-final.json
          flags: openclaw-plugin
          fail_ci_if_error: false
