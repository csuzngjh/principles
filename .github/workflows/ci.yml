name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # Manual re-trigger: PR-event delivery has proven lossy during platform
  # incidents; dispatch runs the exact same jobs on any ref.
  workflow_dispatch:

# A new commit on a PR makes the previous commit's run worthless — cancel it
# so queued runner capacity goes to the newest HEAD. Main/develop pushes and
# other events never cancel (their runs have independent value).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  codex-plugin-delivery:
    name: Codex plugin delivery contract
    needs: impact
    if: needs.impact.result != 'success' || fromJSON(needs.impact.outputs.impact).scopes.plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
      - name: Check discoverable plugin metadata
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/release/sync-codex-runtime-pins.mjs --check-base "$PR_BASE_SHA"
      - name: Probe exact published runtime capability
        run: npm run check:runtime-pin

  # CI Impact Resolver — SCOPE GATE (shadow 2026-09-22 → 2026-10-27, live
  # since then). Computes the affected verification scopes from the real
  # workspace dependency graph and exposes them as the `impact` output;
  # per-package jobs below consume them through
  #   needs.impact.result != 'success' || fromJSON(...).scopes.<scope>
  # conditions. The != 'success' prefix makes the gate FAIL OPEN: if this
  # resolver job itself fails, every gated job runs (a resolver outage can
  # never silently skip tests). Unknown/root-level changes broaden to every
  # scope inside the resolver (scripts/ci/impact.mjs). The prediction still
  # lands in the Step Summary and as an artifact for false-negative hunting.
  # Always-running jobs: this one, verify-merge (the required check), and the
  # advisory telemetry-guard.
  impact:
    name: CI Impact Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      impact: ${{ steps.compute.outputs.impact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          # Full history so the base SHA of the PR event is reachable.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'

      - name: Compute CI impact
        id: compute
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse HEAD~1)"
          fi
          if [ -z "$HEAD" ]; then
            HEAD="$(git rev-parse HEAD)"
          fi
          echo "base=$BASE head=$HEAD"
          node scripts/ci/impact.mjs --base "$BASE" --head "$HEAD" --format json > impact.json
          node scripts/ci/impact.mjs --base "$BASE" --head "$HEAD" --format markdown >> "$GITHUB_STEP_SUMMARY"
          # Compact single-line JSON for job outputs (fromJSON consumers).
          echo "impact=$(jq -c . impact.json)" >> "$GITHUB_OUTPUT"

      - name: Upload impact prediction (gate evidence)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.0.1
        with:
          name: ci-impact-${{ github.sha }}
          path: impact.json
          retention-days: 30

  # PRI-773 telemetry union guard — ADVISORY (report-only, never gates).
  # Two-way diff between the TelemetryEventType union and real emit sites:
  # unregistered names are silently dropped today (ERR-060). Until the
  # catch-up registration lands and this graduates into verify:merge with
  # --strict, drift is reported in the job log and Step Summary only.
  telemetry-guard:
    name: Telemetry Union Guard (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'

      - name: Telemetry union <-> emit-site diff (advisory)
        run: node scripts/check-telemetry-events.cjs

  verify-merge:
    name: Verify Merge Gate
    runs-on: ubuntu-latest
    # 35m: verify:merge gained check:pipeline-contract (PRI-828 Safety Net,
    # focused vitest journeys, ~4 min on top of the previous static gate set).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          # Full history so check-runtime-contract can resolve origin/main...HEAD.
          fetch-depth: 0
          # verify:merge runs test:website, whose homepage-contract test reads
          # the real .mp4/.webp LFS assets. Without LFS, they are 132-byte
          # pointer files and the size assertion fails.
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # SPEC v1.2 §11 — normal PR release-intent guard (changesets). Runs
      # inside the required Verify Merge Gate job so a red guard blocks the
      # merge under branch protection. Dual-mode by proof (SPEC §12.1): a
      # reproducible Version Packages PR passes the version contract; a
      # normal PR must declare its own release intent. Push events (main)
      # have no PR diff context — the guard no-ops there.
      - name: Release intent guard (changesets)
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/release/check-pr-release-intent.mjs

      - name: Run canonical merge gate
        run: npm run verify:merge

  release-parity:
    name: Release Build Parity
    needs: impact
    if: needs.impact.result != 'success' || fromJSON(needs.impact.outputs.impact).scopes.plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (workspace root)
        run: npm ci --ignore-scripts

      - name: Build workspace (core then plugin)
        run: npm run build

      - name: Verify publish dry-run
        working-directory: packages/openclaw-plugin
        # File capture, not `| head`: prepack now prints the bundle-budget
        # evidence block, so the pipeline's line budget decides npm's exit
        # code via EPIPE under pipefail (PRI-919 CI incident) — the display
        # limit must never be able to fake a publish failure.
        run: |
          set +e
          npm pack --dry-run > /tmp/pack-dry-run.log 2>&1
          status=$?
          tail -n 80 /tmp/pack-dry-run.log
          exit $status

  lint:
    name: Lint
    needs: impact
    # eslint runs across every package — any package scope (incl. transitive) gates it.
    if: needs.impact.result != 'success' || fromJSON(needs.impact.outputs.impact).scopes.anyPackage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run ESLint
        run: npm run lint --if-present

  # The former `test` matrix job (Node 20/22) ran `npm test --if-present` at
  # the workspace root, which has NO test script — a ~25s no-op per matrix
  # leg. Real coverage comes from the per-package jobs below, and the
  # installer package (the only product that pins engines) requires
  # node >=22, so the Node 20 leg covered nothing. Removed 2026-08-27.

  # Per-package test jobs: verify:merge does NOT run package tests. These
  # jobs are the real coverage for every package.

  test-principles-core:
    name: Test principles-core
    needs: impact
    if: needs.impact.result != 'success' || fromJSON(needs.impact.outputs.impact).scopes.core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules (better-sqlite3)
        run: npm rebuild better-sqlite3

      - name: Build
        working-directory: packages/principles-core
        run: npm run build

      - name: Test with coverage
        working-directory: packages/principles-core
        run: npm run test -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./packages/principles-core/coverage/coverage-final.json
          flags: principles-core
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  test-pd-cli:
    name: Test pd-cli
    needs: impact
    if: needs.impact.result != 'success' || fromJSON(needs.impact.outputs.impact).scopes.cli
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules (better-sqlite3)
        run: npm rebuild better-sqlite3

      - name: Build core dependency
        run: npm run build --workspace=@principles/core

      - name: Build install layout dependency
        run: npm run build --workspace=@principles/install-layout

      - name: Build host runtime dependency
        run: npm run build --workspace=@principles/host-runtime

      - name: Build codex adapter dependency
        run: npm run build --workspace=@principles/codex-adapter

      - name: Build workbuddy adapter dependency
        run: npm run build --workspace=@principles/workbuddy-adapter

      - name: Build plugin dependency
        run: npm run build --workspace=principles-disciple

      - name: Build and test
        working-directory: packages/pd-cli
        run: npm run build && npm test

  test-pd-console:
    name: Test pd-console
    needs: impact
    if: needs.impact.result != 'success' || fromJSON(needs.impact.outputs.impact).scopes.console
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules (better-sqlite3)
        run: npm rebuild better-sqlite3

      - name: Build dependencies
        run: npm run build

      - name: Test with coverage
        working-directory: packages/pd-console
        run: npm run test -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./packages/pd-console/coverage/coverage-final.json
          flags: pd-console
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # The two heavy smoke suites (real npm pack → real install → real release
  # asset build) are ~97% of this package's test wall time. They run as
  # separate PARALLEL jobs so the fast contract/unit suite stops queueing
  # behind them. Each job rebuilds its own dependencies — the smokes MUST
  # construct their own real artifacts (hermetic semantics preserved); only
  # the dependency build is duplicated, never the artifact under test.
  test-create-principles-disciple:
    name: Test create-principles-disciple
    needs: impact
    if: needs.impact.result != 'success' || fromJSON(needs.impact.outputs.impact).scopes.installer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules (better-sqlite3)
        run: npm rebuild better-sqlite3

      - name: Build dependencies
        run: |
          npm run build --workspace=@principles/core
          npm run build --workspace=@principles/install-layout
          npm run build --workspace=@principles/host-runtime
          npm run build --workspace=@principles/codex-adapter
          npm run build --workspace=@principles/workbuddy-adapter
          npm run build:bundle --workspace=principles-disciple
          npm run build --workspace=principles-disciple
          npm run build --workspace=create-principles-disciple
          npm run build --workspace=@principles/pd-cli
          npm run build --workspace=@principles/pd-console

      - name: Build and test (fast suite)
        working-directory: packages/create-principles-disciple
        run: npm run build && npm run test:fast

  smoke-packaged-install:
    name: Test packaged install smoke
    needs: impact
    if: needs.impact.result != 'success' || fromJSON(needs.impact.outputs.impact).scopes.release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules (better-sqlite3)
        run: npm rebuild better-sqlite3

      - name: Build dependencies
        run: |
          npm run build --workspace=@principles/core
          npm run build --workspace=@principles/install-layout
          npm run build --workspace=@principles/host-runtime
          npm run build --workspace=@principles/codex-adapter
          npm run build --workspace=@principles/workbuddy-adapter
          npm run build:bundle --workspace=principles-disciple
          npm run build --workspace=principles-disciple
          npm run build --workspace=create-principles-disciple
          npm run build --workspace=@principles/pd-cli
          npm run build --workspace=@principles/pd-console

      - name: Build and run packaged install smoke
        working-directory: packages/create-principles-disciple
        run: npm run build && npm run test:smoke:packaged

  smoke-release-asset:
    name: Test release asset smoke
    needs: impact
    if: needs.impact.result != 'success' || fromJSON(needs.impact.outputs.impact).scopes.release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules (better-sqlite3)
        run: npm rebuild better-sqlite3

      - name: Build dependencies
        run: |
          npm run build --workspace=@principles/core
          npm run build --workspace=@principles/install-layout
          npm run build --workspace=@principles/host-runtime
          npm run build --workspace=@principles/codex-adapter
          npm run build --workspace=@principles/workbuddy-adapter
          npm run build:bundle --workspace=principles-disciple
          npm run build --workspace=principles-disciple
          npm run build --workspace=create-principles-disciple
          npm run build --workspace=@principles/pd-cli
          npm run build --workspace=@principles/pd-console

      - name: Build and run release asset smoke
        working-directory: packages/create-principles-disciple
        run: npm run build && npm run test:smoke:release-asset

  # Consolidated 2026-10-27 (CI slimming): scripts, host-runtime, host
  # runtime parity, codex-adapter and pd-companion were five separate jobs —
  # five npm ci installs plus five dependency builds for ~4 min of combined
  # test time, queued as a second wave behind `lint`. They now share one
  # runner; every suite and command is unchanged.
  test-shared-runtime:
    name: Test shared runtime & adapters
    needs: impact
    # Any of the five consolidated suites' scopes (parity needs plugin; the
    # scripts suite is covered by broad — root scripts/ changes broaden).
    if: needs.impact.result != 'success' || fromJSON(needs.impact.outputs.impact).scopes.hostRuntime || fromJSON(needs.impact.outputs.impact).scopes.installLayout || fromJSON(needs.impact.outputs.impact).scopes.codexAdapter || fromJSON(needs.impact.outputs.impact).scopes.plugin || fromJSON(needs.impact.outputs.impact).scopes.companion
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules (better-sqlite3)
        run: npm rebuild better-sqlite3

      - name: Build dependencies
        # Superset of the five former jobs' dependency sets: core +
        # install-layout + host-runtime + plugin (parity needs the plugin).
        run: |
          npm run build --workspace=@principles/core
          npm run build --workspace=@principles/install-layout
          npm run build --workspace=@principles/host-runtime
          npm run build --workspace=principles-disciple

      # PRI-819: the telemetry smoke config regression test validates the
      # generated YAML through the real @principles/core/runtime-v2
      # validatePdConfig (production parser path), which resolves the built
      # package exports — core is already built above.
      - name: Test scripts
        run: npm run test:scripts

      # PRI-868: the legacy-installer deactivation contract lives in the root
      # tests/ directory, which no other CI job collects. Run it from the repo
      # root here so a future guard deletion fails CI instead of staying green.
      - name: Test root guard contracts
        run: npm run test:guard-contracts

      - name: Test host-runtime
        run: npm run build --workspace=@principles/host-runtime && npm test --workspace=@principles/host-runtime

      - name: Verify real OpenClaw host parity and published bundle
        # The published-bundle suite decides its own skip during the changesets
        # pending-publish window (see
        # tests/package/published-host-runtime-bundle.test.ts), so this step
        # runs the full parity command unconditionally on every branch.
        working-directory: packages/openclaw-plugin
        run: npm run test:host-runtime-parity --workspace=principles-disciple

      - name: Test codex-adapter
        run: npm test --workspace=@principles/codex-adapter

      # Companion unit tests exercise the pure lib layer only — the electron
      # binary is not needed on Linux.
      - name: Build and test pd-companion
        run: npm run build --workspace=@principles/pd-companion && npm test --workspace=@principles/pd-companion

  build-openclaw-plugin:
    name: Build OpenClaw Plugin
    needs: impact
    if: needs.impact.result != 'success' || fromJSON(needs.impact.outputs.impact).scopes.plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: TypeScript Check
        working-directory: packages/openclaw-plugin
        run: npx tsc --noEmit

      - name: Production Build & Verify
        working-directory: packages/openclaw-plugin
        run: npm run build:production

  typecheck-pd-console:
    name: TypeScript Check (pd-console)
    needs: impact
    if: needs.impact.result != 'success' || fromJSON(needs.impact.outputs.impact).scopes.console
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build dependencies
        run: npm run build

      - name: TypeScript Check
        working-directory: packages/pd-console
        run: npx tsc --noEmit

  # Consolidated 2026-10-27 (CI slimming): the former separate (unit) and
  # (integration) jobs each ran a SUBSET of this job's default vitest
  # collection — `npx vitest run --coverage` already executes every test
  # file (see vitest.config.ts layering: unit globs + integration globs).
  # The two redundant jobs were removed; coverage + Codecov upload unchanged.
  test-openclaw-plugin-coverage:
    name: Test OpenClaw Plugin (unit+integration+coverage)
    needs: impact
    if: needs.impact.result != 'success' || fromJSON(needs.impact.outputs.impact).scopes.plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install --include=dev

      - name: Build dependencies
        run: npm run build

      - name: Build production artifacts
        working-directory: packages/openclaw-plugin
        run: npm run build:production

      - name: Run tests with coverage
        working-directory: packages/openclaw-plugin
        run: npx vitest run --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./packages/openclaw-plugin/coverage/coverage-final.json
          flags: openclaw-plugin
          fail_ci_if_error: false
