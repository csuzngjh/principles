name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-merge:
    name: Verify Merge Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run canonical merge gate
        run: npm run verify:merge

  release-parity:
    name: Release Build Parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (workspace root)
        run: npm ci --ignore-scripts

      - name: Build workspace (core then plugin)
        run: npm run build

      - name: Verify publish dry-run
        working-directory: packages/openclaw-plugin
        run: |
          set -o pipefail
          npm pack --dry-run 2>&1 | head -50

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run ESLint
        run: npm run lint --if-present

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test --if-present

  # Per-package test jobs: verify:merge does NOT run package tests, and the
  # root `test` job runs `npm test --if-present` which is a no-op (no root
  # test script). These jobs fill the gap so principles-core, pd-cli,
  # pd-console, and create-principles-disciple tests actually run in CI.

  test-principles-core:
    name: Test principles-core
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules (better-sqlite3)
        run: npm rebuild better-sqlite3

      - name: Build and test
        working-directory: packages/principles-core
        run: npm run build && npm test

  test-pd-cli:
    name: Test pd-cli
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules (better-sqlite3)
        run: npm rebuild better-sqlite3

      - name: Build core dependency
        run: npm run build --workspace=@principles/core

      - name: Build and test
        working-directory: packages/pd-cli
        run: npm run build && npm test

  test-pd-console:
    name: Test pd-console
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules (better-sqlite3)
        run: npm rebuild better-sqlite3

      - name: Build dependencies
        run: npm run build

      - name: Test
        working-directory: packages/pd-console
        run: npm test

  test-create-principles-disciple:
    name: Test create-principles-disciple
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules (better-sqlite3)
        run: npm rebuild better-sqlite3

      - name: Build dependencies
        run: |
          npm run build --workspace=@principles/core
          npm run build --workspace=principles-disciple
          npm run build --workspace=@principles/pd-cli
          npm run build --workspace=@principles/pd-console

      - name: Build and test
        working-directory: packages/create-principles-disciple
        run: npm run build && npm test

  build-openclaw-plugin:
    name: Build OpenClaw Plugin
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: TypeScript Check
        working-directory: packages/openclaw-plugin
        run: npx tsc --noEmit

      - name: Production Build & Verify
        working-directory: packages/openclaw-plugin
        run: npm run build:production

  typecheck-pd-console:
    name: TypeScript Check (pd-console)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build dependencies
        run: npm run build

      - name: TypeScript Check
        working-directory: packages/pd-console
        run: npx tsc --noEmit

  test-openclaw-plugin-unit:
    name: Test OpenClaw Plugin (unit)
    runs-on: ubuntu-latest
    needs: build-openclaw-plugin
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        working-directory: packages/openclaw-plugin
        run: npm ci

      - name: Build dependencies
        run: npm run build

      - name: Run unit tests
        working-directory: packages/openclaw-plugin
        run: npm run test:unit

  test-openclaw-plugin-integration:
    name: Test OpenClaw Plugin (integration)
    runs-on: ubuntu-latest
    needs: build-openclaw-plugin
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        working-directory: packages/openclaw-plugin
        run: npm ci

      - name: Build dependencies
        run: npm run build

      - name: Run integration tests
        working-directory: packages/openclaw-plugin
        run: npm run test:integration

  test-openclaw-plugin-coverage:
    name: Test OpenClaw Plugin (coverage)
    runs-on: ubuntu-latest
    needs: build-openclaw-plugin
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install --include=dev

      - name: Build dependencies
        run: npm run build

      - name: Build production artifacts
        working-directory: packages/openclaw-plugin
        run: npm run build:production

      - name: Run tests with coverage
        working-directory: packages/openclaw-plugin
        run: npm run test:coverage
