name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # Merge queue: inert until "Require merge queue" is enabled on the main
  # branch protection rule, then the queue re-runs this workflow against the
  # merge-group commit. The required check NAME does not change — Verify Merge
  # Gate is still the only required context.
  merge_group:
  # Manual re-trigger: PR-event delivery has proven lossy during platform
  # incidents; dispatch runs the exact same jobs on any ref.
  workflow_dispatch:

# A new commit on a PR makes the previous commit's run worthless — cancel it
# so queued runner capacity goes to the newest HEAD. Main/develop pushes and
# other events never cancel (their runs have independent value).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  codex-plugin-delivery:
    name: Codex plugin delivery contract
    needs: impact
    if: ${{ !cancelled() && (needs.impact.result != 'success' || fromJSON(needs.impact.outputs.impact).scopes.plugin || fromJSON(needs.impact.outputs.impact).scopes.mcpServer) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '24'
          cache: 'npm'
      - name: Check discoverable plugin metadata
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/release/sync-codex-runtime-pins.mjs --check-base "$PR_BASE_SHA"
      # PRI-1071 P1-4E: pd-mcp-server@0.1.0 is not published yet, so the
      # historical published-cohort probe (`check:runtime-pin --install`,
      # which pulls every pin from the registry) cannot run on a PR. Verify
      # the SAME delivery contract against the packages THIS PR builds:
      # isolated tarball install (no @principles copy comes from the
      # registry), the S1-S8 installed-bytes capability probe, then a real
      # stdio start of the installed MCP server. The registry cohort check
      # remains in the publish train, after the version is actually public.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build the PR runtime cohort (dependency order)
        run: |
          npm run build --workspace=@principles/core
          npm run build --workspace=@principles/install-layout
          npm run build --workspace=@principles/host-runtime
          npm run build --workspace=@principles/codex-adapter
          npm run build --workspace=@principles/pd-mcp-server
      - name: Pack the PR runtime cohort as tarballs
        run: |
          TARBALL_DIR="$RUNNER_TEMP/pd-runtime-tarballs"
          mkdir -p "$TARBALL_DIR"
          npm pack --ignore-scripts --pack-destination "$TARBALL_DIR" \
            --workspace=@principles/core \
            --workspace=@principles/install-layout \
            --workspace=@principles/host-runtime \
            --workspace=@principles/codex-adapter \
            --workspace=@principles/pd-mcp-server
          ls -1 "$TARBALL_DIR"
      - name: Install the PR runtime into an isolated directory
        run: |
          RUNTIME_DIR="$RUNNER_TEMP/pd-runtime"
          mkdir -p "$RUNTIME_DIR"
          printf '{"name":"pd-codex-runtime","private":true}\n' > "$RUNTIME_DIR/package.json"
          (cd "$RUNTIME_DIR" && npm install --no-audit --no-fund --omit=dev "$RUNNER_TEMP"/pd-runtime-tarballs/*.tgz)
      - name: Probe the installed cohort (Owner controls / Codex V2 / DesignGate)
        run: node plugins/principles-disciple/scripts/verify-pinned-runtime-capability.cjs --runtime-dir "$RUNNER_TEMP/pd-runtime" --workspace "$RUNNER_TEMP/pd-probe-workspace"
      - name: Start the installed MCP server over real stdio
        run: node scripts/ci/verify-installed-mcp-server.mjs --runtime-dir "$RUNNER_TEMP/pd-runtime" --workspace "$RUNNER_TEMP/pd-mcp-workspace"

  # CI Impact Resolver — SCOPE GATE (shadow 2026-09-22 → 2026-10-27, live
  # since then). Computes the affected verification scopes from the real
  # workspace dependency graph and exposes them as the `impact` output;
  # per-package jobs below consume them through
  #   !cancelled() && (needs.impact.result != 'success' || fromJSON(...).scopes.<scope>)
  # conditions. The explicit !cancelled() status function is REQUIRED:
  # GitHub implicitly prepends success() to any `if` without a status
  # function, which would make a failed impact job SKIP every gated job
  # instead of running them (review catch 2026-10-27). With the guard, the
  # gate FAILS OPEN: if this resolver job fails, every gated job runs (a
  # resolver outage can never silently skip tests). Pinned by
  # scripts/__tests__/ci-impact-gate-contract.test.ts. Unknown/root-level
  # changes broaden to every scope inside the resolver (scripts/ci/impact.mjs).
  # The prediction still lands in the Step Summary and as an artifact for
  # false-negative hunting. Always-running jobs: this one, verify-merge (the
  # required check), and the advisory telemetry-guard.
  impact:
    name: CI Impact Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      impact: ${{ steps.compute.outputs.impact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          # Full history so the base SHA of the PR event is reachable.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'

      - name: Compute CI impact
        id: compute
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse HEAD~1)"
          fi
          if [ -z "$HEAD" ]; then
            HEAD="$(git rev-parse HEAD)"
          fi
          echo "base=$BASE head=$HEAD"
          node scripts/ci/impact.mjs --base "$BASE" --head "$HEAD" --format json > impact.json
          node scripts/ci/impact.mjs --base "$BASE" --head "$HEAD" --format markdown >> "$GITHUB_STEP_SUMMARY"
          # Compact single-line JSON for job outputs (fromJSON consumers).
          echo "impact=$(jq -c . impact.json)" >> "$GITHUB_OUTPUT"

      - name: Upload impact prediction (gate evidence)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.0.1
        with:
          name: ci-impact-${{ github.sha }}
          path: impact.json
          retention-days: 30

  # PRI-773 telemetry union guard — ADVISORY (report-only, never gates).
  # Two-way diff between the TelemetryEventType union and real emit sites:
  # unregistered names are silently dropped today (ERR-060). Until the
  # catch-up registration lands and this graduates into verify:merge with
  # --strict, drift is reported in the job log and Step Summary only.
  telemetry-guard:
    name: Telemetry Union Guard (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'

      - name: Telemetry union <-> emit-site diff (advisory)
        run: node scripts/check-telemetry-events.cjs

  verify-merge:
    name: Verify Merge Gate
    runs-on: ubuntu-latest
    # 35m: verify:merge gained check:pipeline-contract (PRI-828 Safety Net,
    # focused vitest journeys, ~4 min on top of the previous static gate set).
    timeout-minutes: 35
    env:
      # Bounded ESLint pool for the gate only. Serial stays the default in
      # lint-by-package.mjs (the OOM-safe mode); 2 is the conservative value for
      # a 4-core ubuntu runner, and any package that fails in the pool is
      # retried once serially before it can fail the gate.
      PD_LINT_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          # Full history so check-runtime-contract can resolve origin/main...HEAD.
          fetch-depth: 0
          # verify:merge runs test:website, whose homepage-contract test reads
          # the real .mp4/.webp LFS assets. Without LFS, they are 132-byte
          # pointer files and the size assertion fails.
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'npm'

      # Cache the materialized install graph so the gate does not pay `npm ci`
      # (~40s) on every PR. Key is lockfile + Node version + OS: any dependency
      # change misses the cache and falls back to a real `npm ci`. Scripts stay
      # ignored, so the cached tree is the same one `npm ci --ignore-scripts`
      # would produce.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}-node-modules

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      # SPEC v1.2 §11 — normal PR release-intent guard (changesets). Runs
      # inside the required Verify Merge Gate job so a red guard blocks the
      # merge under branch protection. Dual-mode by proof (SPEC §12.1): a
      # reproducible Version Packages PR passes the version contract; a
      # normal PR must declare its own release intent. Push events (main)
      # have no PR diff context — the guard no-ops there.
      - name: Release intent guard (changesets)
        if: github.event_name == 'pull_request'
        env:
          # PRI-964: the checkout is GitHub's merge ref. Its first parent is the
          # LIVE base tip, while base.sha is frozen at PR-open time and goes
          # stale as main advances. The guard derives the base from the merge
          # ref (or origin/main when the PR head was checked out) instead.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/release/check-pr-release-intent.mjs

      - name: Run canonical merge gate
        run: npm run verify:merge

  release-parity:
    name: Release Build Parity
    needs: impact
    if: ${{ !cancelled() && (needs.impact.result != 'success' || fromJSON(needs.impact.outputs.impact).scopes.plugin) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (workspace root)
        run: npm ci --ignore-scripts

      - name: Build workspace (core then plugin)
        run: npm run build

      - name: Verify publish dry-run
        working-directory: packages/openclaw-plugin
        # File capture, not `| head`: prepack now prints the bundle-budget
        # evidence block, so the pipeline's line budget decides npm's exit
        # code via EPIPE under pipefail (PRI-919 CI incident) — the display
        # limit must never be able to fake a publish failure.
        run: |
          set +e
          npm pack --dry-run > /tmp/pack-dry-run.log 2>&1
          status=$?
          tail -n 80 /tmp/pack-dry-run.log
          exit $status

  lint:
    name: Lint
    needs: impact
    # eslint runs across every package — any package scope (incl. transitive) gates it.
    if: ${{ !cancelled() && (needs.impact.result != 'success' || fromJSON(needs.impact.outputs.impact).scopes.anyPackage) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run ESLint
        run: npm run lint --if-present

  # The former `test` matrix job (Node 20/22) ran `npm test --if-present` at
  # the workspace root, which has NO test script — a ~25s no-op per matrix
  # leg. Real coverage comes from the per-package jobs below, and the
  # installer package (the only product that pins engines) requires
  # node >=22, so the Node 20 leg covered nothing. Removed 2026-08-27.

  # Per-package test jobs: verify:merge runs only the install-layout and
  # pd-mcp-server binding-contract suites. These jobs are the real coverage for
  # every package.

  test-principles-core:
    name: Test principles-core
    needs: impact
    if: ${{ !cancelled() && (needs.impact.result != 'success' || fromJSON(needs.impact.outputs.impact).scopes.core) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules (better-sqlite3)
        run: npm rebuild better-sqlite3

      - name: Build
        working-directory: packages/principles-core
        run: npm run build

      - name: Test with coverage
        working-directory: packages/principles-core
        run: npm run test -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./packages/principles-core/coverage/coverage-final.json
          flags: principles-core
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  test-pd-mcp-server:
    name: Test pd-mcp-server
    needs: impact
    if: ${{ !cancelled() && (needs.impact.result != 'success' || fromJSON(needs.impact.outputs.impact).scopes.mcpServer) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules (better-sqlite3)
        run: npm rebuild better-sqlite3

      # The package's own test script builds dist/ first; the Gate 3
      # capability it imports comes from the workspace-linked core dist.
      - name: Build dependency (principles-core)
        run: npm run build --workspace=@principles/core

      # The binding-contract parity test imports the shared declaration from
      # @principles/install-layout's built entry point.
      - name: Build dependency (@principles/install-layout)
        run: npm run build --workspace=@principles/install-layout

      - name: Test (unit + real-process stdio contract)
        run: npm test --workspace=@principles/pd-mcp-server

  test-pd-cli:
    name: Test pd-cli
    needs: impact
    if: ${{ !cancelled() && (needs.impact.result != 'success' || fromJSON(needs.impact.outputs.impact).scopes.cli) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules (better-sqlite3)
        run: npm rebuild better-sqlite3

      - name: Build core dependency
        run: npm run build --workspace=@principles/core

      - name: Build install layout dependency
        run: npm run build --workspace=@principles/install-layout

      - name: Build host runtime dependency
        run: npm run build --workspace=@principles/host-runtime

      - name: Build codex adapter dependency
        run: npm run build --workspace=@principles/codex-adapter

      - name: Build workbuddy adapter dependency
        run: npm run build --workspace=@principles/workbuddy-adapter

      - name: Build plugin dependency
        run: npm run build --workspace=principles-disciple

      - name: Build and test
        working-directory: packages/pd-cli
        run: npm run build && npm test

  test-pd-console:
    name: Test pd-console
    needs: impact
    if: ${{ !cancelled() && (needs.impact.result != 'success' || fromJSON(needs.impact.outputs.impact).scopes.console) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules (better-sqlite3)
        run: npm rebuild better-sqlite3

      - name: Build dependencies
        run: npm run build

      - name: Test with coverage
        working-directory: packages/pd-console
        run: npm run test -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./packages/pd-console/coverage/coverage-final.json
          flags: pd-console
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # The two heavy smoke suites (real npm pack → real install → real release
  # asset build) are ~97% of this package's test wall time. They run as
  # separate PARALLEL jobs so the fast contract/unit suite stops queueing
  # behind them. Each job rebuilds its own dependencies — the smokes MUST
  # construct their own real artifacts (hermetic semantics preserved); only
  # the dependency build is duplicated, never the artifact under test.
  test-create-principles-disciple:
    name: Test create-principles-disciple
    needs: impact
    if: ${{ !cancelled() && (needs.impact.result != 'success' || fromJSON(needs.impact.outputs.impact).scopes.installer) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules (better-sqlite3)
        run: npm rebuild better-sqlite3

      - name: Build dependencies
        run: |
          npm run build --workspace=@principles/core
          npm run build --workspace=@principles/install-layout
          npm run build --workspace=@principles/host-runtime
          npm run build --workspace=@principles/codex-adapter
          npm run build --workspace=@principles/workbuddy-adapter
          npm run build --workspace=@principles/pd-mcp-server
          npm run build:bundle --workspace=principles-disciple
          npm run build --workspace=principles-disciple
          npm run build --workspace=create-principles-disciple
          npm run build --workspace=@principles/pd-cli
          npm run build --workspace=@principles/pd-console

      - name: Typecheck tests
        run: npm run typecheck:tests --workspace=create-principles-disciple

      - name: Build and test (fast suite)
        working-directory: packages/create-principles-disciple
        run: npm run build && npm run test:fast

  skill-render-contract:
    name: Test skill render contract
    needs: impact
    if: ${{ !cancelled() && (needs.impact.result != 'success' || fromJSON(needs.impact.outputs.impact).scopes.installer) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build pd-skills
        run: npm run build --workspace=@principles/pd-skills
      - name: Test pd-skills
        run: npm test --workspace=@principles/pd-skills
      - name: Verify every host artifact matches the single source
        run: node packages/pd-skills/dist/cli.js render --check

  smoke-packaged-install:
    name: Test packaged install smoke
    needs: impact
    if: ${{ !cancelled() && (needs.impact.result != 'success' || fromJSON(needs.impact.outputs.impact).scopes.release) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules (better-sqlite3)
        run: npm rebuild better-sqlite3

      - name: Build dependencies
        run: |
          npm run build --workspace=@principles/core
          npm run build --workspace=@principles/install-layout
          npm run build --workspace=@principles/host-runtime
          npm run build --workspace=@principles/codex-adapter
          npm run build --workspace=@principles/workbuddy-adapter
          npm run build --workspace=@principles/pd-mcp-server
          npm run build:bundle --workspace=principles-disciple
          npm run build --workspace=principles-disciple
          npm run build --workspace=create-principles-disciple
          npm run build --workspace=@principles/pd-cli
          npm run build --workspace=@principles/pd-console

      - name: Build and run packaged install smoke
        working-directory: packages/create-principles-disciple
        run: npm run build && npm run test:smoke:packaged

  smoke-release-asset:
    name: Test release asset smoke
    needs: impact
    if: ${{ !cancelled() && (needs.impact.result != 'success' || fromJSON(needs.impact.outputs.impact).scopes.release) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules (better-sqlite3)
        run: npm rebuild better-sqlite3

      - name: Build dependencies
        run: |
          npm run build --workspace=@principles/core
          npm run build --workspace=@principles/install-layout
          npm run build --workspace=@principles/host-runtime
          npm run build --workspace=@principles/codex-adapter
          npm run build --workspace=@principles/workbuddy-adapter
          npm run build --workspace=@principles/pd-mcp-server
          npm run build:bundle --workspace=principles-disciple
          npm run build --workspace=principles-disciple
          npm run build --workspace=create-principles-disciple
          npm run build --workspace=@principles/pd-cli
          npm run build --workspace=@principles/pd-console

      - name: Build and run release asset smoke
        working-directory: packages/create-principles-disciple
        run: npm run build && npm run test:smoke:release-asset

  # Consolidated 2026-10-27 (CI slimming): scripts, host-runtime, host
  # runtime parity, codex-adapter and pd-companion were five separate jobs —
  # five npm ci installs plus five dependency builds for ~4 min of combined
  # test time, queued as a second wave behind `lint`. They now share one
  # runner; every suite and command is unchanged.
  test-shared-runtime:
    name: Test shared runtime & adapters
    needs: impact
    # Any of the consolidated suites' scopes (parity needs plugin; the
    # scripts suite is covered by broad — root scripts/ changes broaden).
    if: ${{ !cancelled() && (needs.impact.result != 'success' || fromJSON(needs.impact.outputs.impact).scopes.hostRuntime || fromJSON(needs.impact.outputs.impact).scopes.installLayout || fromJSON(needs.impact.outputs.impact).scopes.codexAdapter || fromJSON(needs.impact.outputs.impact).scopes.plugin || fromJSON(needs.impact.outputs.impact).scopes.companion) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules (better-sqlite3)
        run: npm rebuild better-sqlite3

      - name: Build dependencies
        # Superset of the five former jobs' dependency sets: core +
        # install-layout + host-runtime + plugin (parity needs the plugin).
        # The codex delivery contract launches the REAL built pd-mcp-server
        # bytes, so that package is built here too (core first: its dist is
        # the server's compile-time dependency).
        run: |
          npm run build --workspace=@principles/core
          npm run build --workspace=@principles/pd-mcp-server
          npm run build --workspace=@principles/install-layout
          npm run build --workspace=@principles/host-runtime
          npm run build --workspace=principles-disciple
          # PRI-1150 review P2-D: the PRI-1147 harness regression tests moved
          # into scripts/__tests__ import @principles/codex-adapter (via
          # chain-harness) — its dist must be built for the scripts job.
          npm run build --workspace=@principles/codex-adapter

      # PRI-819: the telemetry smoke config regression test validates the
      # generated YAML through the real @principles/core/runtime
      # validatePdConfig (production parser path), which resolves the built
      # package exports — core is already built above.
      - name: Test scripts
        run: npm run test:scripts

      # PRI-868: the legacy-installer deactivation contract lives in the root
      # tests/ directory, which no other CI job collects. Run it from the repo
      # root here so a future guard deletion fails CI instead of staying green.
      - name: Test root guard contracts
        run: npm run test:guard-contracts

      - name: Test host-runtime
        run: npm run build --workspace=@principles/host-runtime && npm test --workspace=@principles/host-runtime

      - name: Verify real OpenClaw host parity and published bundle
        # The published-bundle suite decides its own skip during the changesets
        # pending-publish window (see
        # tests/package/published-host-runtime-bundle.test.ts), so this step
        # runs the full parity command unconditionally on every branch.
        working-directory: packages/openclaw-plugin
        run: npm run test:host-runtime-parity --workspace=principles-disciple

      - name: Test codex-adapter
        run: npm test --workspace=@principles/codex-adapter

      # Companion unit tests exercise the pure lib layer only — the electron
      # binary is not needed on Linux.
      - name: Build and test pd-companion
        run: npm run build --workspace=@principles/pd-companion && npm test --workspace=@principles/pd-companion

  # PRI-1066: workbuddy-adapter had a scope in the impact resolver but no job
  # consumed it, so a v2 contract-test regression there could not fail CI.
  # It cannot join the Ubuntu suite: its frozen host-contract fixtures are REAL
  # Windows payloads (`D:\...` cwd) and the decoder deliberately rejects a
  # non-absolute cwd, so the fixtures fail on Linux for platform reasons before
  # any product assertion can run. Run the package on a Windows runner instead
  # of weakening or skipping its evidence.
  test-workbuddy-adapter:
    name: Test workbuddy-adapter (Windows fixtures)
    needs: impact
    if: ${{ !cancelled() && (needs.impact.result != 'success' || fromJSON(needs.impact.outputs.impact).scopes.workbuddyAdapter) }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules (better-sqlite3)
        run: npm rebuild better-sqlite3

      - name: Build dependencies
        run: |
          npm run build --workspace=@principles/core
          npm run build --workspace=@principles/install-layout
          npm run build --workspace=@principles/host-runtime

      - name: Test workbuddy-adapter
        run: npm test --workspace=@principles/workbuddy-adapter

  build-openclaw-plugin:
    name: Build OpenClaw Plugin
    needs: impact
    if: ${{ !cancelled() && (needs.impact.result != 'success' || fromJSON(needs.impact.outputs.impact).scopes.plugin) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: TypeScript Check
        working-directory: packages/openclaw-plugin
        run: npx tsc --noEmit

      - name: Production Build & Verify
        working-directory: packages/openclaw-plugin
        run: npm run build:production

  typecheck-pd-console:
    name: TypeScript Check (pd-console)
    needs: impact
    if: ${{ !cancelled() && (needs.impact.result != 'success' || fromJSON(needs.impact.outputs.impact).scopes.console) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build dependencies
        run: npm run build

      - name: TypeScript Check
        working-directory: packages/pd-console
        run: npx tsc --noEmit

  # Consolidated 2026-10-27 (CI slimming): the former separate (unit) and
  # (integration) jobs each ran a SUBSET of this job's default vitest
  # collection — `npx vitest run --coverage` already executes every test
  # file (see vitest.config.ts layering: unit globs + integration globs).
  # The two redundant jobs were removed; coverage + Codecov upload unchanged.
  test-openclaw-plugin-coverage:
    name: Test OpenClaw Plugin (unit+integration+coverage)
    needs: impact
    if: ${{ !cancelled() && (needs.impact.result != 'success' || fromJSON(needs.impact.outputs.impact).scopes.plugin) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install --include=dev

      - name: Build dependencies
        run: npm run build

      - name: Build production artifacts
        working-directory: packages/openclaw-plugin
        run: npm run build:production

      - name: Run tests with coverage
        working-directory: packages/openclaw-plugin
        run: npx vitest run --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./packages/openclaw-plugin/coverage/coverage-final.json
          flags: openclaw-plugin
          fail_ci_if_error: false
