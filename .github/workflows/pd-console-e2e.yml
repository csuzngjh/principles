name: pd-console E2E

on:
  pull_request:
    paths:
      - 'packages/pd-console/**'
      - 'packages/principles-core/**'
      - 'packages/host-runtime/**'
      - 'packages/openclaw-plugin/**'
      - 'packages/pd-cli/**'
      - 'docs/specs/features/story-a/rulecode-owner-live-decision.feature'
      - '.github/workflows/pd-console-e2e.yml'
  workflow_dispatch:

concurrency:
  group: pd-console-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules
        run: npm rebuild better-sqlite3

      - name: Build core
        run: npm run build

      - name: Build pd-console UI
        run: cd packages/pd-console && npm run build:ui

      # ubuntu-latest already ships every Chromium runtime library the suite
      # needs. `--with-deps` additionally apt-installs font/xfont packages from
      # archive.ubuntu.com + security.ubuntu.com, which has been the sole cause
      # of E2E red on unrelated PRs and on main (DNS: "Temporary failure
      # resolving 'security.ubuntu.com'", apt exit 100) — the test steps never
      # ran. This suite has no screenshot assertions, so those fonts are not
      # needed for correctness. Install only the browser: same real tests, one
      # less unreachable network dependency.
      - name: Install Playwright browsers
        run: cd packages/pd-console && npx playwright install chromium

      - name: Run E2E tests
        run: cd packages/pd-console && npx playwright test

      - name: Run authenticated RuleCode Owner E2E
        run: cd packages/pd-console && npx playwright test --config playwright.owner.config.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pd-console-playwright-report
          path: packages/pd-console/playwright-report/
          retention-days: 14
