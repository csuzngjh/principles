name: pd-console E2E

on:
  pull_request:
    paths:
      - 'packages/pd-console/**'
      - 'packages/principles-core/**'
      - 'packages/host-runtime/**'
      - 'packages/openclaw-plugin/**'
      - 'packages/pd-cli/**'
      - 'docs/specs/features/story-a/rulecode-owner-live-decision.feature'
      - '.github/workflows/pd-console-e2e.yml'
  workflow_dispatch:

concurrency:
  group: pd-console-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules
        run: npm rebuild better-sqlite3

      - name: Build core
        run: npm run build

      - name: Build pd-console UI
        run: cd packages/pd-console && npm run build:ui

      - name: Install Playwright browsers
        run: cd packages/pd-console && npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: cd packages/pd-console && npx playwright test

      - name: Run authenticated RuleCode Owner E2E
        run: cd packages/pd-console && npx playwright test --config playwright.owner.config.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pd-console-playwright-report
          path: packages/pd-console/playwright-report/
          retention-days: 14
