name: E2E Regression Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  regression-test:
    name: OpenClaw Plugin Regression Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The root build graph compiles every workspace (incl. create-principles-disciple),
      # so dependencies must be installed at the workspace root, not per-package.
      - name: Install dependencies (workspace root)
        run: npm ci --ignore-scripts

      - name: Build repository (authoritative build graph)
        run: npm run build

      - name: Run regression tests
        working-directory: packages/openclaw-plugin
        run: npx vitest run tests/core/regression-v1-9-1.test.ts --reporter=verbose

      - name: Run full test suite (sanity)
        working-directory: packages/openclaw-plugin
        run: npm test
