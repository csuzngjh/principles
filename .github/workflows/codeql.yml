name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual re-trigger for platform-incident recovery (PR-event lossy days).
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'  # Weekly Monday 04:23 UTC

# Supersede older analysis runs on the same PR; scheduled and main analyses
# never cancel.
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.3
        with:
          category: '/language:${{ matrix.language }}'
