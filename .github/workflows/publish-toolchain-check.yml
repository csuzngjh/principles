name: Publish toolchain check

# Proves the npm the publish legs will actually resolve, without publishing
# anything. Runs on every PR that can change the publish toolchain and on
# manual dispatch, so the evidence exists before a release train is dispatched.
#
# The setup-node inputs below MUST stay identical to the `Setup Node.js` step
# of `publish-full-product` in publish-npm.yml, and the pin MUST stay in the
# shared composite action — no caller overrides `npm_pin`, so the version
# printed here is the version every publish leg and the preflight rehearsal
# resolve. The contract test
# packages/create-principles-disciple/tests/release-target-matrix.test.ts
# asserts that alignment, so drift goes red.

on:
  pull_request:
    paths:
      - '.github/workflows/publish-npm.yml'
      - '.github/workflows/publish-toolchain-check.yml'
      - '.github/actions/publish-toolchain/**'
      - 'packages/create-principles-disciple/tests/release-target-matrix.test.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-toolchain-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain-check:
    name: Publish toolchain check (npm >= 11.5.1)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22.22.2'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Pin npm for OIDC trusted publishing
        uses: ./.github/actions/publish-toolchain

      # The action already parses `npm -v` and asserts the OIDC floor, so this
      # step only prints the resolved toolchain — no second copy of the floor
      # that could drift from the action's.
      - name: Print the resolved toolchain
        run: |
          set -euo pipefail
          node -v
          npm -v
          command -v npm
