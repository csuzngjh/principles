name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        default: 'principles-disciple'
        type: choice
        options:
          # full-product: one release train — the full release matrix runs
          # ONCE and the publish-full-product job publishes all 7 packages
          # as SEQUENTIAL STEPS in dependency order inside a single job
          # (step order = execution order; a failed step stops the job, so
          # an upstream publish failure blocks every downstream package).
          # Replaces the old pattern of 7 manual dispatches, each re-running
          # the full cross-platform matrix.
          - full-product
          - principles-disciple
          - '@principles/core'
          - '@principles/pd-cli'
          - create-principles-disciple
          - '@principles/host-runtime'
          - '@principles/install-layout'
          - '@principles/codex-adapter'
      version_bump:
        description: 'Version bump type'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
  push:
    branches: [main]
    paths:
      - 'packages/openclaw-plugin/**'
      - 'packages/principles-core/**'
      - 'packages/pd-cli/**'
      - 'packages/pd-console/**'
      - 'packages/create-principles-disciple/**'
      - 'packages/host-runtime/**'
      - 'packages/install-layout/**'
      - 'packages/codex-adapter/**'
  schedule:
    # Every Friday 04:00 UTC = Beijing 12:00 — weekly release.
    # Publishes principles-disciple + create-principles-disciple so users
    # get the latest pd-console/core/cli via the Web UI full update.
    - cron: '0 4 * * 5'

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-reproducibility:
    name: Verify Full Release Matrix
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    uses: ./.github/workflows/release-reproducibility-full.yml
    permissions:
      contents: read

  detect:
    name: Detect Changed Packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      is_full_product: ${{ steps.detect.outputs.is_full_product }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ github.event.inputs.package }}"
            IS_FULL="false"
            case "$INPUT" in
              "full-product")
                # Single release train: the full-matrix gate opens once and
                # the publish-full-product job publishes every package as
                # SEQUENTIAL STEPS in one job — the authoritative order
                # lives in that job's step sequence (no matrix scheduling).
                # This matrix value only feeds the release-reproducibility
                # non-empty gate and run summaries; it mirrors the same
                # dependency order: core -> install-layout -> host-runtime
                # (exact dep on install-layout@0.1.0) -> codex-adapter ->
                # pd-cli -> plugin -> installer (re-bundles the fresh
                # plugin; lockstep preserved).
                echo 'matrix=[{"pkg_dir":"principles-core","npm_name":"@principles/core"},{"pkg_dir":"install-layout","npm_name":"@principles/install-layout"},{"pkg_dir":"host-runtime","npm_name":"@principles/host-runtime"},{"pkg_dir":"codex-adapter","npm_name":"@principles/codex-adapter"},{"pkg_dir":"pd-cli","npm_name":"@principles/pd-cli"},{"pkg_dir":"openclaw-plugin","npm_name":"principles-disciple"},{"pkg_dir":"create-principles-disciple","npm_name":"create-principles-disciple"}]' >> $GITHUB_OUTPUT
                IS_FULL="true"
                ;;
              "principles-disciple")
                # Lockstep (mirrors the push-path rule below): the installer
                # bundles the plugin, so publishing the plugin alone leaves
                # /apply-full unable to deliver what /check promises. This
                # branch used to exit before that rule ran (update-drift
                # recurrence, PRI-558 follow-up 2026-08-22).
                echo 'matrix=[{"pkg_dir":"openclaw-plugin","npm_name":"principles-disciple"},{"pkg_dir":"create-principles-disciple","npm_name":"create-principles-disciple"}]' >> $GITHUB_OUTPUT
                ;;
              "@principles/core")
                echo 'matrix=[{"pkg_dir":"principles-core","npm_name":"@principles/core"}]' >> $GITHUB_OUTPUT
                ;;
              "@principles/pd-cli")
                echo 'matrix=[{"pkg_dir":"pd-cli","npm_name":"@principles/pd-cli"}]' >> $GITHUB_OUTPUT
                ;;
              "create-principles-disciple")
                echo 'matrix=[{"pkg_dir":"create-principles-disciple","npm_name":"create-principles-disciple"}]' >> $GITHUB_OUTPUT
                ;;
              "@principles/host-runtime")
                echo 'matrix=[{"pkg_dir":"host-runtime","npm_name":"@principles/host-runtime"}]' >> $GITHUB_OUTPUT
                ;;
              "@principles/install-layout")
                echo 'matrix=[{"pkg_dir":"install-layout","npm_name":"@principles/install-layout"}]' >> $GITHUB_OUTPUT
                ;;
              "@principles/codex-adapter")
                echo 'matrix=[{"pkg_dir":"codex-adapter","npm_name":"@principles/codex-adapter"}]' >> $GITHUB_OUTPUT
                ;;
              *)
                echo "Unknown package: $INPUT"
                exit 1
                ;;
            esac
            echo "is_full_product=$IS_FULL" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Not a dispatch (push / schedule): never the full-product train.
          echo "is_full_product=false" >> $GITHUB_OUTPUT

          # Weekly schedule: publish principles-disciple + create-principles-disciple
          # so users get the latest pd-console/core/cli via Web UI full update.
          # Skip if no commits since the last tag (avoid empty releases).
          if [ "${{ github.event_name }}" = "schedule" ]; then
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$LAST_TAG" ]; then
              COMMITS_SINCE=$(git rev-list --count "$LAST_TAG"..HEAD 2>/dev/null || echo "0")
              if [ "$COMMITS_SINCE" -eq 0 ]; then
                echo "No commits since $LAST_TAG — skipping weekly release"
                echo "matrix=[]" >> $GITHUB_OUTPUT
                exit 0
              fi
              echo "Weekly release: $COMMITS_SINCE commits since $LAST_TAG"
            fi
            # principles-disciple first (so bundle-plugin.mjs can sync version),
            # then create-principles-disciple (bundles all latest code).
            echo 'matrix=[{"pkg_dir":"openclaw-plugin","npm_name":"principles-disciple"},{"pkg_dir":"create-principles-disciple","npm_name":"create-principles-disciple"}]' >> $GITHUB_OUTPUT
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED_FILES=$(git diff --name-only HEAD~1..HEAD)
          else
            CHANGED_FILES=$(git diff --name-only "$BEFORE" "$AFTER" 2>/dev/null || git diff --name-only HEAD~1..HEAD)
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          MATRIX="["
          FIRST=true

          check_and_add() {
            local DIR="$1"
            local NPM_NAME="$2"
            if echo "$CHANGED_FILES" | grep -q "^packages/$DIR/"; then
              if [ "$FIRST" = true ]; then
                FIRST=false
              else
                MATRIX+=","
              fi
              MATRIX+="{\"pkg_dir\":\"$DIR\",\"npm_name\":\"$NPM_NAME\"}"
              echo "Detected change: $DIR ($NPM_NAME)"
            fi
          }

          check_and_add "principles-core" "@principles/core"
          # Dependency-first order: install-layout before host-runtime
          # (host-runtime declares an EXACT runtime dep on
          # @principles/install-layout@0.1.0, so a push that changes both
          # must land install-layout first), host-runtime before
          # codex-adapter/pd-cli (both declare it as a dependency), and
          # codex-adapter before pd-cli. A consumer running
          # `npm install -g @principles/codex-adapter` (or pd-cli) fails
          # dependency resolution if a declared dep is missing; each
          # package's publish step also re-verifies via registry preflight.
          check_and_add "install-layout" "@principles/install-layout"
          check_and_add "host-runtime" "@principles/host-runtime"
          check_and_add "codex-adapter" "@principles/codex-adapter"
          check_and_add "openclaw-plugin" "principles-disciple"
          check_and_add "pd-cli" "@principles/pd-cli"
          check_and_add "create-principles-disciple" "create-principles-disciple"

          # CRITICAL (update-drift fix): the Web UI full update installs the
          # bundled plugin from create-principles-disciple, NOT from the
          # principles-disciple package directly. The installer captures the
          # plugin version at build time. If the plugin is published but the
          # installer is not, /check (plugin latest) promises a version that
          # /apply-full can never deliver → permanent false "update available"
          # and no-op updates. So ANY push that publishes the plugin MUST also
          # republish the installer (which re-bundles the freshly published
          # plugin). Matrix is sequential (max-parallel: 1), and the installer
          # is appended AFTER the plugin was added above, so it runs last and
          # picks up the just-published plugin version.
          if echo "$MATRIX" | grep -q '"pkg_dir":"openclaw-plugin"'; then
            if echo "$MATRIX" | grep -q '"pkg_dir":"create-principles-disciple"'; then
              echo "Plugin + installer both publishing — installer re-bundles fresh plugin."
            else
              MATRIX="${MATRIX%]}"
              if [ "$MATRIX" != "[" ]; then MATRIX+=","; fi
              MATRIX+='{"pkg_dir":"create-principles-disciple","npm_name":"create-principles-disciple"}'
              echo "Plugin change detected — forcing create-principles-disciple publish (keeps update channels in lockstep)."
            fi
          fi

          # CRITICAL (console-delivery fix): pd-console has no npm package of
          # its own — the console UI ships ONLY inside the installer bundle
          # (console/). A console-only merge must republish the installer,
          # otherwise /check never moves and users can never receive UI
          # updates (PRI-558 follow-up 2026-08-22: the Principles timeline
          # redesign sat unreachable on main for a full day for this reason).
          if echo "$CHANGED_FILES" | grep -q "^packages/pd-console/"; then
            if ! echo "$MATRIX" | grep -q '"pkg_dir":"create-principles-disciple"'; then
              MATRIX="${MATRIX%]}"
              if [ "$MATRIX" != "[" ]; then MATRIX+=","; fi
              MATRIX+='{"pkg_dir":"create-principles-disciple","npm_name":"create-principles-disciple"}'
              echo "pd-console change detected — forcing create-principles-disciple publish (console ships only in the installer)."
            fi
          fi

          MATRIX+="]"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  publish:
    name: Publish ${{ matrix.npm_name }}
    needs: [detect, release-reproducibility]
    # Single-package dispatch / push / schedule path ONLY. The full-product
    # release train publishes via the sequential publish-full-product job
    # below (step order = dependency order); max-parallel: 1 here limits
    # concurrent runners, it does NOT order matrix entries — ordering on
    # this path is advisory (best-effort declaration order) with each
    # package's registry preflight as the hard guard.
    if: needs.detect.outputs.matrix != '[]' && needs.detect.outputs.is_full_product != 'true'
    strategy:
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix) }}
      fail-fast: false
      max-parallel: 1
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get npm latest version
        id: npm-version
        run: |
          NPM_NAME="${{ matrix.npm_name }}"
          NPM_VERSION=$(npm view "$NPM_NAME" version 2>/dev/null || echo "0.0.0")
          echo "npm_version=$NPM_VERSION" >> $GITHUB_OUTPUT
          echo "Latest npm version of $NPM_NAME: $NPM_VERSION"

      - name: Analyze commits for version bump
        id: analyze
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.version_bump == 'auto')
        run: |
          NPM_VERSION="${{ steps.npm-version.outputs.npm_version }}"
          LAST_TAG="v$NPM_VERSION"

          if git rev-parse "$LAST_TAG" >/dev/null 2>&1; then
            COMMITS=$(git log "$LAST_TAG..HEAD" --oneline)
          else
            COMMITS=$(git log -10 --oneline)
          fi

          echo "Commits since npm v$NPM_VERSION:"
          echo "$COMMITS"

          BUMP="patch"

          if echo "$COMMITS" | grep -qE "^[a-f0-9]+ (feat|feature)(\(.+\))?!:"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE "^[a-f0-9]+ .+!:"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE "^[a-f0-9]+ (feat|feature)(\(.+\))?:"; then
            BUMP="minor"
          fi

          echo "Detected version bump: $BUMP"
          echo "bump=$BUMP" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.NPM_TOKEN }}

      - name: Build core
        run: npm run build --workspace=@principles/core

      - name: Build host runtime
        run: npm run build --workspace=@principles/host-runtime

      - name: Build install layout
        run: npm run build --workspace=@principles/install-layout

      - name: Build target package
        run: |
          PKG_DIR="${{ matrix.pkg_dir }}"
          if [ "$PKG_DIR" = "openclaw-plugin" ]; then
            npm run build --workspace=principles-disciple
          elif [ "$PKG_DIR" = "pd-cli" ]; then
            # pd-cli imports types from principles-disciple — build it first
            # (same ordering the create-principles-disciple branch uses).
            npm run build --workspace=principles-disciple
            npm run build --workspace=@principles/pd-cli
          elif [ "$PKG_DIR" = "create-principles-disciple" ]; then
            # esbuild first (cleans dist, produces bundle.js), then tsc --emitDeclarationOnly
            # (adds .d.ts without overwriting esbuild's .js output). Both needed: pd-cli
            # imports types from principles-disciple, bundle-plugin.mjs needs bundle.js.
            npm run build:production --workspace=principles-disciple
            npm run build:types --workspace=principles-disciple
            npm run build --workspace=@principles/pd-cli
            npm run build --workspace=@principles/pd-console
            cd packages/create-principles-disciple && npm run build
          elif [ "$PKG_DIR" = "host-runtime" ]; then
            npm run build --workspace=@principles/host-runtime
          elif [ "$PKG_DIR" = "install-layout" ]; then
            npm run build --workspace=@principles/install-layout
          elif [ "$PKG_DIR" = "codex-adapter" ]; then
            npm run build --workspace=@principles/codex-adapter
          fi

      - name: Verify registry dependencies are published
        # host-runtime declares an EXACT runtime dependency on
        # @principles/install-layout@0.1.0; codex-adapter and pd-cli declare
        # @principles/host-runtime (and pd-cli also @principles/codex-adapter,
        # create-principles-disciple @principles/install-layout) as runtime
        # dependencies. Publishing while a dependency is absent from the
        # registry breaks `npm install -g` for every consumer. The retry
        # loop tolerates registry propagation lag from a package published
        # moments earlier (declaration order above + registry preflight
        # here are the guards on this path).
        if: matrix.pkg_dir == 'host-runtime' || matrix.pkg_dir == 'codex-adapter' || matrix.pkg_dir == 'pd-cli' || matrix.pkg_dir == 'create-principles-disciple'
        run: |
          check_published() {
            local PKG="$1"
            for attempt in 1 2 3 4 5; do
              if npm view "$PKG" version >/dev/null 2>&1; then
                echo "$PKG is published on the registry (lookup attempt $attempt)."
                return 0
              fi
              echo "Attempt $attempt/5: $PKG not yet visible on the registry; waiting 15s..."
              sleep 15
            done
            echo "::error::$PKG is not published. ${{ matrix.npm_name }} depends on it — publishing now would make 'npm install -g ${{ matrix.npm_name }}' fail dependency resolution. Publish $PKG first (workflow_dispatch: $PKG), then retry this package."
            exit 1
          }
          if [ "${{ matrix.pkg_dir }}" = "host-runtime" ]; then
            # Exact runtime dep — install-layout must be on the registry first.
            check_published "@principles/install-layout"
          else
            check_published "@principles/host-runtime"
            if [ "${{ matrix.pkg_dir }}" = "pd-cli" ]; then
              check_published "@principles/codex-adapter"
            fi
            if [ "${{ matrix.pkg_dir }}" = "pd-cli" ] || [ "${{ matrix.pkg_dir }}" = "create-principles-disciple" ]; then
              check_published "@principles/install-layout"
            fi
          fi

      - name: Verify package dry-run
        working-directory: packages/${{ matrix.pkg_dir }}
        run: |
          set -o pipefail
          npm pack --dry-run 2>&1 | head -50

      - name: Determine version bump type
        id: bump
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.version_bump }}" != "auto" ]; then
            echo "type=${{ github.event.inputs.version_bump }}" >> $GITHUB_OUTPUT
          else
            echo "type=${{ steps.analyze.outputs.bump || 'patch' }}" >> $GITHUB_OUTPUT
          fi

      - name: Bump version
        id: version
        working-directory: packages/${{ matrix.pkg_dir }}
        run: |
          BUMP="${{ steps.bump.outputs.type }}"
          NPM_VERSION="${{ steps.npm-version.outputs.npm_version }}"
          LOCAL_VERSION=$(node -p "require('./package.json').version")

          echo "Version check:"
          echo "  - npm latest: $NPM_VERSION"
          echo "  - local: $LOCAL_VERSION"

          if [ "$NPM_VERSION" = "0.0.0" ]; then
            echo "Package not yet published on npm — using local version $LOCAL_VERSION"
            echo "version=$LOCAL_VERSION" >> $GITHUB_OUTPUT
            echo "old_version=$NPM_VERSION" >> $GITHUB_OUTPUT
            echo "Bumped: new package at $LOCAL_VERSION"
          else
            if [ "$LOCAL_VERSION" != "$NPM_VERSION" ]; then
              echo "Local version ($LOCAL_VERSION) differs from npm ($NPM_VERSION)"
              echo "Resetting to npm version before bump..."
              npm version "$NPM_VERSION" --no-git-tag-version
            else
              echo "Local version ($LOCAL_VERSION) matches npm ($NPM_VERSION)"
            fi

            # --no-git-tag-version: only update package.json. Do NOT let
            # `npm version` create a git commit or a v$VERSION tag here —
            # the "Create Git tag and push" step below owns tag creation
            # (tag-only release; we no longer push to main). Letting npm
            # version create the tag would collide with `git tag -a` below
            # (same name) and would also require git identity on the
            # runner, which is not reliably set.
            npm version "$BUMP" --no-git-tag-version

            NEW_VERSION=$(node -p "require('./package.json').version")
            echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "old_version=$NPM_VERSION" >> $GITHUB_OUTPUT

            echo "Bumped: $NPM_VERSION -> $NEW_VERSION"
          fi

      - name: Sync version to all files
        if: matrix.pkg_dir == 'openclaw-plugin'
        run: |
          VERSION=$(node -p "require('./packages/openclaw-plugin/package.json').version")
          echo "Syncing version $VERSION to all files..."

          PLUGIN_JSON="packages/openclaw-plugin/openclaw.plugin.json"
          if [ -f "$PLUGIN_JSON" ]; then
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" "$PLUGIN_JSON"
            echo "Synced: $PLUGIN_JSON"
          fi

          DIST_PLUGIN_JSON="packages/openclaw-plugin/dist/openclaw.plugin.json"
          if [ -f "$DIST_PLUGIN_JSON" ]; then
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" "$DIST_PLUGIN_JSON"
            echo "Synced: $DIST_PLUGIN_JSON"
          fi

          ROOT_PKG="package.json"
          if [ -f "$ROOT_PKG" ]; then
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" "$ROOT_PKG"
            echo "Synced: $ROOT_PKG"
          fi

          README="README.md"
          if [ -f "$README" ]; then
            sed -i "s/(v[0-9]\+\.[0-9]\+\.[0-9]\+)/(v$VERSION)/g" "$README"
            echo "Synced: $README"
          fi

          README_ZH="README_ZH.md"
          if [ -f "$README_ZH" ]; then
            sed -i "s/(v[0-9]\+\.[0-9]\+\.[0-9]\+)/(v$VERSION)/g" "$README_ZH"
            echo "Synced: $README_ZH"
          fi

          echo "All files synced to version $VERSION"

      - name: Generate changelog
        id: changelog
        run: |
          NPM_VERSION="${{ steps.npm-version.outputs.npm_version }}"
          LAST_TAG="v$NPM_VERSION"

          if git rev-parse "$LAST_TAG" >/dev/null 2>&1; then
            COMMITS=$(git log "$LAST_TAG..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log -20 --pretty=format:"- %s (%h)" --no-merges)
          fi

          FEATURES=$(echo "$COMMITS" | grep -E "^- feat" || true)
          FIXES=$(echo "$COMMITS" | grep -E "^- fix" || true)
          OTHER=$(echo "$COMMITS" | grep -vE "^- (feat|fix)" || true)

          CHANGELOG="## What's Changed\n\n"

          if [ -n "$FEATURES" ]; then
            CHANGELOG+="### Features\n$FEATURES\n\n"
          fi

          if [ -n "$FIXES" ]; then
            CHANGELOG+="### Bug Fixes\n$FIXES\n\n"
          fi

          if [ -n "$OTHER" ]; then
            CHANGELOG+="### Other Changes\n$OTHER\n\n"
          fi

          CHANGELOG+="\n**Full Changelog**: https://github.com/${{ github.repository }}/compare/${LAST_TAG}...v${{ steps.version.outputs.version }}"

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo -e "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Publish to npm
        working-directory: packages/${{ matrix.pkg_dir }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Git tag and push
        if: matrix.pkg_dir == 'openclaw-plugin'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          OLD_VERSION="${{ steps.version.outputs.old_version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Tag the release on the current HEAD (the commit that triggered
          # this workflow run). We intentionally do NOT `git commit --amend`
          # the trigger commit nor `git push origin HEAD:main --force-with-lease`:
          # main is branch-protected (no force-push, requires PR + "Verify
          # Merge Gate" status check), so any direct push to refs/heads/main
          # is rejected with GH006, which has made this job fail on every
          # main push since the branch protection was enabled.
          #
          # Tag refs (refs/tags/*) are NOT covered by branch protection, and
          # this job already has `permissions: contents: write`, so pushing
          # the tag succeeds. The version-sync file edits made earlier in
          # this job (openclaw.plugin.json, README, root package.json) stay
          # in the runner working tree and are not written back to main;
          # that is acceptable because the next publish run's "Bump version"
          # step resets the local version to the npm version via
          # `npm version $NPM_VERSION --no-git-tag-version` before bumping.
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
          echo "Created and pushed tag: v$VERSION (from npm v$OLD_VERSION)"

      - name: Create GitHub Release
        if: matrix.pkg_dir == 'openclaw-plugin'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync to ClawHub marketplace
        # The ClawHub marketplace does NOT auto-sync from npm (no trusted
        # publisher configured), so without this step the marketplace stays
        # stale after every release. Runs after npm publish + release so a
        # marketplace failure never blocks the primary npm channel.
        #
        # Timeout fallback (known issue: server-side inspection of this
        # ~470-file package exceeds the CLI's 120s upload timeout, and the
        # CLI's built-in 5x p-retry then races and hangs):
        #   1. best-effort patch the freshly installed CLI's upload timeout
        #      up to 600s (same patch we verified locally);
        #   2. bound every attempt with an outer `timeout` guard +
        #      --wait-timeout, and retry once;
        #   3. success is judged by `clawhub package inspect` seeing the
        #      version, not by the publish command's exit code alone;
        #   4. if both attempts fail, degrade to a warning + manual
        #      fallback instructions instead of failing the release.
        if: matrix.pkg_dir == 'openclaw-plugin'
        continue-on-error: true
        timeout-minutes: 25
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          set -u

          if [ -z "${CLAWHUB_TOKEN:-}" ]; then
            echo "::warning::CLAWHUB_TOKEN secret is not set — skipping ClawHub marketplace sync. Add the secret (ClawHub API token) to enable it."
            exit 0
          fi

          # CI auth: the CLI reads its token from a global config file,
          # overridable via CLAWHUB_CONFIG_PATH.
          CFG_DIR="$(mktemp -d)"
          printf '{\n  "registry": "https://clawhub.ai",\n  "token": "%s"\n}\n' "$CLAWHUB_TOKEN" > "$CFG_DIR/config.json"
          chmod 600 "$CFG_DIR/config.json"
          export CLAWHUB_CONFIG_PATH="$CFG_DIR/config.json"

          npm install -g clawhub@latest
          clawhub -V  # note: this CLI exposes -V/--cli-version, not --version

          # Best-effort: raise the CLI's upload timeout (120s in published
          # builds) to 600s. Non-fatal — the outer timeout guard below
          # covers the case where the patch pattern does not match.
          GLOBAL_HTTP_JS="$(npm root -g)/clawhub/dist/http.js"
          if [ -f "$GLOBAL_HTTP_JS" ] && grep -q "UPLOAD_TIMEOUT_MS" "$GLOBAL_HTTP_JS"; then
            sed -i -E 's/(UPLOAD_TIMEOUT_MS = )[0-9_]+/\1600_000/' "$GLOBAL_HTTP_JS" || true
            grep -n "UPLOAD_TIMEOUT_MS =" "$GLOBAL_HTTP_JS" | head -1
          fi

          VERSION="$(node -p "require('./packages/openclaw-plugin/package.json').version")"
          SRC="packages/openclaw-plugin"
          echo "Publishing ClawHub marketplace version: $VERSION"

          attempt() {
            local N="$1"
            echo "--- ClawHub publish attempt $N ---"
            # Outer hard bound: upload (<=600s patched) + wait for scan.
            timeout 480 clawhub package publish "$SRC" --version "$VERSION" --wait --wait-timeout 240 || true
            # Judge success by the version being visible on the marketplace,
            # not by the publish exit code (a --wait-timeout expiry can
            # outlive a successful upload while the scan is still pending).
            if clawhub package inspect "principles-disciple" --version "$VERSION" >/dev/null 2>&1; then
              echo "::notice::ClawHub marketplace shows v$VERSION (attempt $N)."
              return 0
            fi
            echo "v$VERSION not visible on ClawHub yet (attempt $N)."
            return 1
          }

          if attempt 1; then
            echo "ClawHub marketplace sync succeeded."
            exit 0
          fi

          echo "Attempt 1 failed — waiting 30s before retry..."
          sleep 30
          if attempt 2; then
            echo "ClawHub marketplace sync succeeded on retry."
            exit 0
          fi

          {
            echo "## ⚠️ ClawHub marketplace sync failed"
            echo ""
            echo "npm \`${VERSION}\` published successfully; the ClawHub upload timed out twice."
            echo "The package may still appear later (server-side scan can be slow)."
            echo ""
            echo "Manual fallback (on a machine with ClawHub CLI login):"
            echo '```bash'
            echo "cd packages/openclaw-plugin"
            echo "clawhub package publish . --version ${VERSION} --wait"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::warning::ClawHub marketplace sync failed for v${VERSION} — npm publish succeeded. See step summary for the manual fallback command."
          exit 1

      - name: Summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Package | \`${{ matrix.npm_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Directory | \`packages/${{ matrix.pkg_dir }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`v${{ steps.version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Bump Type | \`${{ steps.bump.outputs.type }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Published to npm and GitHub" >> $GITHUB_STEP_SUMMARY

  publish-full-product:
    name: Publish full product (release train)
    needs: [detect, release-reproducibility]
    if: needs.detect.outputs.is_full_product == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      id-token: write
    steps:
      # ONE job, SEVEN sequential steps: the step order below IS the
      # dependency order. GitHub runs job steps strictly in sequence and a
      # failed step stops the job, so an upstream publish failure blocks
      # every downstream package — no matrix scheduling is involved
      # (max-parallel limits concurrent runners, it does not order matrix
      # entries; review P1 #1439 round 2, 2026-08-28). install-layout
      # precedes host-runtime because host-runtime declares an EXACT
      # runtime dependency on @principles/install-layout@0.1.0. The
      # installer runs LAST so it re-bundles the freshly published plugin
      # (lockstep preserved). Each step re-verifies its registry
      # dependencies before publishing (see the shared action).
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.NPM_TOKEN }}

      - name: Build core
        run: npm run build --workspace=@principles/core

      - name: Build host runtime
        run: npm run build --workspace=@principles/host-runtime

      - name: Build install layout
        run: npm run build --workspace=@principles/install-layout

      - name: Publish 1/7 @principles/core
        uses: ./.github/actions/publish-npm-package
        with:
          pkg_dir: principles-core
          npm_name: '@principles/core'
          version_bump: ${{ github.event.inputs.version_bump || 'auto' }}

      - name: Publish 2/7 @principles/install-layout
        uses: ./.github/actions/publish-npm-package
        with:
          pkg_dir: install-layout
          npm_name: '@principles/install-layout'
          version_bump: ${{ github.event.inputs.version_bump || 'auto' }}

      - name: Publish 3/7 @principles/host-runtime
        uses: ./.github/actions/publish-npm-package
        with:
          pkg_dir: host-runtime
          npm_name: '@principles/host-runtime'
          version_bump: ${{ github.event.inputs.version_bump || 'auto' }}

      - name: Publish 4/7 @principles/codex-adapter
        uses: ./.github/actions/publish-npm-package
        with:
          pkg_dir: codex-adapter
          npm_name: '@principles/codex-adapter'
          version_bump: ${{ github.event.inputs.version_bump || 'auto' }}

      - name: Publish 5/7 @principles/pd-cli
        uses: ./.github/actions/publish-npm-package
        with:
          pkg_dir: pd-cli
          npm_name: '@principles/pd-cli'
          version_bump: ${{ github.event.inputs.version_bump || 'auto' }}

      - name: Publish 6/7 principles-disciple (plugin)
        uses: ./.github/actions/publish-npm-package
        with:
          pkg_dir: openclaw-plugin
          npm_name: 'principles-disciple'
          version_bump: ${{ github.event.inputs.version_bump || 'auto' }}

      - name: Publish 7/7 create-principles-disciple (installer)
        uses: ./.github/actions/publish-npm-package
        with:
          pkg_dir: create-principles-disciple
          npm_name: 'create-principles-disciple'
          version_bump: ${{ github.event.inputs.version_bump || 'auto' }}
