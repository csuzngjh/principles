name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        default: 'principles-disciple'
        type: choice
        options:
          - principles-disciple
          - '@principles/core'
          - '@principles/pd-cli'
          - create-principles-disciple
      version_bump:
        description: 'Version bump type'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
  push:
    branches: [main]
    paths:
      - 'packages/openclaw-plugin/**'
      - 'packages/principles-core/**'
      - 'packages/pd-cli/**'
      - 'packages/create-principles-disciple/**'

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect Changed Packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ github.event.inputs.package }}"
            case "$INPUT" in
              "principles-disciple")
                echo 'matrix=[{"pkg_dir":"openclaw-plugin","npm_name":"principles-disciple"}]' >> $GITHUB_OUTPUT
                ;;
              "@principles/core")
                echo 'matrix=[{"pkg_dir":"principles-core","npm_name":"@principles/core"}]' >> $GITHUB_OUTPUT
                ;;
              "@principles/pd-cli")
                echo 'matrix=[{"pkg_dir":"pd-cli","npm_name":"@principles/pd-cli"}]' >> $GITHUB_OUTPUT
                ;;
              "create-principles-disciple")
                echo 'matrix=[{"pkg_dir":"create-principles-disciple","npm_name":"create-principles-disciple"}]' >> $GITHUB_OUTPUT
                ;;
              *)
                echo "Unknown package: $INPUT"
                exit 1
                ;;
            esac
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED_FILES=$(git diff --name-only HEAD~1..HEAD)
          else
            CHANGED_FILES=$(git diff --name-only "$BEFORE" "$AFTER" 2>/dev/null || git diff --name-only HEAD~1..HEAD)
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          MATRIX="["
          FIRST=true

          check_and_add() {
            local DIR="$1"
            local NPM_NAME="$2"
            if echo "$CHANGED_FILES" | grep -q "^packages/$DIR/"; then
              if [ "$FIRST" = true ]; then
                FIRST=false
              else
                MATRIX+=","
              fi
              MATRIX+="{\"pkg_dir\":\"$DIR\",\"npm_name\":\"$NPM_NAME\"}"
              echo "Detected change: $DIR ($NPM_NAME)"
            fi
          }

          check_and_add "principles-core" "@principles/core"
          check_and_add "openclaw-plugin" "principles-disciple"
          check_and_add "pd-cli" "@principles/pd-cli"
          check_and_add "create-principles-disciple" "create-principles-disciple"

          MATRIX+="]"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  publish:
    name: Publish ${{ matrix.npm_name }}
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    strategy:
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix) }}
      fail-fast: false
      max-parallel: 1
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get npm latest version
        id: npm-version
        run: |
          NPM_NAME="${{ matrix.npm_name }}"
          NPM_VERSION=$(npm view "$NPM_NAME" version 2>/dev/null || echo "0.0.0")
          echo "npm_version=$NPM_VERSION" >> $GITHUB_OUTPUT
          echo "Latest npm version of $NPM_NAME: $NPM_VERSION"

      - name: Analyze commits for version bump
        id: analyze
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.version_bump == 'auto')
        run: |
          NPM_VERSION="${{ steps.npm-version.outputs.npm_version }}"
          LAST_TAG="v$NPM_VERSION"

          if git rev-parse "$LAST_TAG" >/dev/null 2>&1; then
            COMMITS=$(git log "$LAST_TAG..HEAD" --oneline)
          else
            COMMITS=$(git log -10 --oneline)
          fi

          echo "Commits since npm v$NPM_VERSION:"
          echo "$COMMITS"

          BUMP="patch"

          if echo "$COMMITS" | grep -qE "^[a-f0-9]+ (feat|feature)(\(.+\))?!:"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE "^[a-f0-9]+ .+!:"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE "^[a-f0-9]+ (feat|feature)(\(.+\))?:"; then
            BUMP="minor"
          fi

          echo "Detected version bump: $BUMP"
          echo "bump=$BUMP" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.NPM_TOKEN }}

      - name: Build core
        run: npm run build --workspace=@principles/core

      - name: Build target package
        run: |
          PKG_DIR="${{ matrix.pkg_dir }}"
          if [ "$PKG_DIR" = "openclaw-plugin" ]; then
            npm run build --workspace=principles-disciple
          elif [ "$PKG_DIR" = "pd-cli" ]; then
            npm run build --workspace=@principles/pd-cli
          elif [ "$PKG_DIR" = "create-principles-disciple" ]; then
            npm run build --workspace=principles-disciple
            npm run build --workspace=@principles/pd-cli
            npm run build --workspace=@principles/pd-console
            cd packages/create-principles-disciple && npm ci && npm run build
          fi

      - name: Verify package dry-run
        working-directory: packages/${{ matrix.pkg_dir }}
        run: |
          set -o pipefail
          npm pack --dry-run 2>&1 | head -50

      - name: Determine version bump type
        id: bump
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.version_bump }}" != "auto" ]; then
            echo "type=${{ github.event.inputs.version_bump }}" >> $GITHUB_OUTPUT
          else
            echo "type=${{ steps.analyze.outputs.bump || 'patch' }}" >> $GITHUB_OUTPUT
          fi

      - name: Bump version
        id: version
        working-directory: packages/${{ matrix.pkg_dir }}
        run: |
          BUMP="${{ steps.bump.outputs.type }}"
          NPM_VERSION="${{ steps.npm-version.outputs.npm_version }}"
          LOCAL_VERSION=$(node -p "require('./package.json').version")

          echo "Version check:"
          echo "  - npm latest: $NPM_VERSION"
          echo "  - local: $LOCAL_VERSION"

          if [ "$NPM_VERSION" = "0.0.0" ]; then
            echo "Package not yet published on npm — using local version $LOCAL_VERSION"
            echo "version=$LOCAL_VERSION" >> $GITHUB_OUTPUT
            echo "old_version=$NPM_VERSION" >> $GITHUB_OUTPUT
            echo "Bumped: new package at $LOCAL_VERSION"
          else
            if [ "$LOCAL_VERSION" != "$NPM_VERSION" ]; then
              echo "Local version ($LOCAL_VERSION) differs from npm ($NPM_VERSION)"
              echo "Resetting to npm version before bump..."
              npm version "$NPM_VERSION" --no-git-tag-version
            else
              echo "Local version ($LOCAL_VERSION) matches npm ($NPM_VERSION)"
            fi

            npm version "$BUMP" -m "chore(release): %s [skip ci]"

            NEW_VERSION=$(node -p "require('./package.json').version")
            echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "old_version=$NPM_VERSION" >> $GITHUB_OUTPUT

            echo "Bumped: $NPM_VERSION -> $NEW_VERSION"
          fi

      - name: Sync version to all files
        if: matrix.pkg_dir == 'openclaw-plugin'
        run: |
          VERSION=$(node -p "require('./packages/openclaw-plugin/package.json').version")
          echo "Syncing version $VERSION to all files..."

          PLUGIN_JSON="packages/openclaw-plugin/openclaw.plugin.json"
          if [ -f "$PLUGIN_JSON" ]; then
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" "$PLUGIN_JSON"
            echo "Synced: $PLUGIN_JSON"
          fi

          DIST_PLUGIN_JSON="packages/openclaw-plugin/dist/openclaw.plugin.json"
          if [ -f "$DIST_PLUGIN_JSON" ]; then
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" "$DIST_PLUGIN_JSON"
            echo "Synced: $DIST_PLUGIN_JSON"
          fi

          ROOT_PKG="package.json"
          if [ -f "$ROOT_PKG" ]; then
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" "$ROOT_PKG"
            echo "Synced: $ROOT_PKG"
          fi

          README="README.md"
          if [ -f "$README" ]; then
            sed -i "s/(v[0-9]\+\.[0-9]\+\.[0-9]\+)/(v$VERSION)/g" "$README"
            echo "Synced: $README"
          fi

          README_ZH="README_ZH.md"
          if [ -f "$README_ZH" ]; then
            sed -i "s/(v[0-9]\+\.[0-9]\+\.[0-9]\+)/(v$VERSION)/g" "$README_ZH"
            echo "Synced: $README_ZH"
          fi

          echo "All files synced to version $VERSION"

      - name: Generate changelog
        id: changelog
        run: |
          NPM_VERSION="${{ steps.npm-version.outputs.npm_version }}"
          LAST_TAG="v$NPM_VERSION"

          if git rev-parse "$LAST_TAG" >/dev/null 2>&1; then
            COMMITS=$(git log "$LAST_TAG..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log -20 --pretty=format:"- %s (%h)" --no-merges)
          fi

          FEATURES=$(echo "$COMMITS" | grep -E "^- feat" || true)
          FIXES=$(echo "$COMMITS" | grep -E "^- fix" || true)
          OTHER=$(echo "$COMMITS" | grep -vE "^- (feat|fix)" || true)

          CHANGELOG="## What's Changed\n\n"

          if [ -n "$FEATURES" ]; then
            CHANGELOG+="### Features\n$FEATURES\n\n"
          fi

          if [ -n "$FIXES" ]; then
            CHANGELOG+="### Bug Fixes\n$FIXES\n\n"
          fi

          if [ -n "$OTHER" ]; then
            CHANGELOG+="### Other Changes\n$OTHER\n\n"
          fi

          CHANGELOG+="\n**Full Changelog**: https://github.com/${{ github.repository }}/compare/${LAST_TAG}...v${{ steps.version.outputs.version }}"

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo -e "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Publish to npm
        working-directory: packages/${{ matrix.pkg_dir }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Git tag and push
        if: matrix.pkg_dir == 'openclaw-plugin'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          OLD_VERSION="${{ steps.version.outputs.old_version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Tag the release on the current HEAD (the commit that triggered
          # this workflow run). We intentionally do NOT `git commit --amend`
          # the trigger commit nor `git push origin HEAD:main --force-with-lease`:
          # main is branch-protected (no force-push, requires PR + "Verify
          # Merge Gate" status check), so any direct push to refs/heads/main
          # is rejected with GH006, which has made this job fail on every
          # main push since the branch protection was enabled.
          #
          # Tag refs (refs/tags/*) are NOT covered by branch protection, and
          # this job already has `permissions: contents: write`, so pushing
          # the tag succeeds. The version-sync file edits made earlier in
          # this job (openclaw.plugin.json, README, root package.json) stay
          # in the runner working tree and are not written back to main;
          # that is acceptable because the next publish run's "Bump version"
          # step resets the local version to the npm version via
          # `npm version $NPM_VERSION --no-git-tag-version` before bumping.
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
          echo "Created and pushed tag: v$VERSION (from npm v$OLD_VERSION)"

      - name: Create GitHub Release
        if: matrix.pkg_dir == 'openclaw-plugin'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Package | \`${{ matrix.npm_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Directory | \`packages/${{ matrix.pkg_dir }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`v${{ steps.version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Bump Type | \`${{ steps.bump.outputs.type }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Published to npm and GitHub" >> $GITHUB_STEP_SUMMARY
