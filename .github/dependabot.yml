version: 2
updates:
  # 主项目依赖
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 5
    # @tufjs/models 是 tuf-js 的精确 peer（3.x ↔ 3.0.1 配对锁死）：
    # 单独升 models 会与锁定的 tuf-js 3.1.0 peer 分裂，npm 无法解析
    # （PR #1559 实证：root npm ci 直接 EUSAGE）。须与 tuf-js 6 作为一次
    # 专门迁移一起走（见 /packages/create-principles-disciple 目录下同款规则）。
    # @principles/* 是 monorepo workspace 内部包：dependabot 按 registry 版本
    # 改写 workspace manifest 的 spec，会让 npm 绕过 workspace link 装已发布
    # tarball，破坏 parity（PR #1541 实证；与 openclaw-plugin 目录同款规则）。
    # i18next 27 的 TFunction 类型不再可赋给项目内简单翻译函数签名，全线
    # typecheck 失败（PR #2765 实证）；须专门迁移，先挡 27.x 自动 PR，
    # 26.x 补丁照旧放行。
    ignore:
      - dependency-name: '@tufjs/models'
        update-types: ['version-update:semver-major']
      - dependency-name: '@principles/*'
      - dependency-name: 'i18next'
        versions: ['27.x']
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
    reviewers:
      - 'csuzngjh'

  # create-principles-disciple 包
  - package-ecosystem: 'npm'
    directory: '/packages/create-principles-disciple'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 3
    # tuf-js 是签名发布验证客户端（安全边界）：跨 major 升级会连带
    # @tufjs/models 精确 peer + node engines 门槛（6.0 要求 node ≥22.22.2，
    # 而安装器声明 >=22.0.0），必须作为专门迁移处理，不走自动 major PR
    # （PR #1543 实证）。minor/patch 仍自动提。
    # @tufjs/models 同理且配对锁死（3.x ↔ 3.0.1）：单独升 models 与锁定的
    # tuf-js 3.1.0 peer 分裂，npm 无法解析（PR #1558 实证）。两条规则
    # 必须一起进退。
    # @principles/* 内部包版本由 changesets 发布列车统一推进：dependabot
    # 从该目录的陈旧 package-lock.json 读取"当前版本"并按 registry 目标
    # 无条件重写 manifest spec，已造成真实降级回退（PR #2758：^0.10.0 被
    # 覆盖为 ^0.9.0，根 npm ci EUSAGE）。与 openclaw-plugin 目录同款规则。
    ignore:
      - dependency-name: 'tuf-js'
        update-types: ['version-update:semver-major']
      - dependency-name: '@tufjs/models'
        update-types: ['version-update:semver-major']
      - dependency-name: '@principles/*'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
    reviewers:
      - 'csuzngjh'

  # openclaw-plugin 包
  - package-ecosystem: 'npm'
    directory: '/packages/openclaw-plugin'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 3
    # @principles/* 是 monorepo workspace 内部包：本地版本永远落后于发布管线
    # 在 registry 上 bump 出的版本（CI publish 时 reset-then-bump，不回写 main），
    # dependabot 按 registry 版本提的 PR 会让 npm 绕过 workspace link 装到已发布
    # tarball，破坏 parity/本地开发环（PR #1541 实证）。
    ignore:
      - dependency-name: '@principles/*'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
    reviewers:
      - 'csuzngjh'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'ci'
    labels:
      - 'github-actions'
      - 'dependencies'
