name: Publish one npm package (exact committed version)
description: >-
  Shared per-package publish logic for the release train in publish-npm.yml.
  EXACT-VERSION CONTRACT (SPEC v1.2 §19): this action has NO authority to
  invent, bump, reset or compute a version. It reads the version committed
  in package.json at the release cohort SHA, checks the registry for that
  exact name@version, and publishes it only when absent. An existing exact
  version with matching provenance SKIPS the npm upload while the caller's
  closing-step reconciliation continues (SPEC §24). One job calls this
  action as sequential steps in dependency order; the caller MUST grant
  permissions contents:write and id-token:write, and MUST have checked out
  the PRODUCT at the cohort SHA (workspace root), the TOOLS at a trusted
  reviewed SHA (tools_dir), and run setup-node (registry-url), npm ci, and
  the common core/install-layout/host-runtime builds before invoking.
  IMMUTABLE CANDIDATE (G3.1 + G3.1-A): every ABSENT leg packs ONE candidate
  tarball, verifies its identity/file set and publishes that exact file. npm
  tarball publishes run no lifecycle scripts, so the uploaded bytes are the
  verified bytes; there is no directory-publish path.
  PRODUCT vs TOOLS separation (PRI-886): this action file and every
  scripts/release/* control script it calls come from the tools_dir
  checkout, while every manifest, build script and package payload comes
  from the cohort checkout at the workspace root — fixing publish tooling
  must never require burning a new product version. Closing steps (tag /
  GitHub Release / ClawHub) live in finalize-npm-release, AFTER all nine
  npm legs — they must never block an unuploaded package.
inputs:
  pkg_dir:
    description: 'Workspace directory under packages/ (e.g. principles-core)'
    required: true
    type: string
  npm_name:
    description: 'npm package name (e.g. @principles/core)'
    required: true
    type: string
  cohort_sha:
    description: 'Release cohort SHA (the Version Packages PR merge commit) — provenance expectation for the exact-version check'
    required: true
    type: string
  tools_dir:
    description: 'Directory (relative to the workspace root) holding the TOOLS checkout that provides scripts/release/* control scripts called by this action'
    required: true
    type: string
  train_order:
    description: 'Comma-separated package directories in publish (dependency topological) order — the workflow is the single source of the order'
    required: true
    type: string
  npm_token:
    description: 'npm registry token (composite actions cannot read the secrets context — the caller must pass it)'
    required: true
    type: string
  dry_run:
    description: >-
      Rehearsal mode (PRI-886): run the ENTIRE control path — exact-state
      check, dependency preflight wait, builds, and the ONE immutable-candidate
      pack/overlay/final verification — but skip the actual npm upload. Used by
      the no-write preflight workflow so publish-flow defects surface before
      the expensive matrix, without consuming a real registry version.
    required: false
    type: boolean
    default: false
  product_identity_version:
    description: >-
      The TRAIN product version to embed in the installer payload identity
      stamp (SPEC v0.3 §12 authority, unchanged). Used only by the
      create-principles-disciple step.
    required: false
    type: string
    default: ''
# Evidence-derived leg results (PD Release G3-R3 H1). The caller aggregates
# these instead of inferring "packed" from step success: a leg that resolved
# PRESENT_MATCH / PRESENT_PRIOR packed nothing at all.
outputs:
  leg_status:
    description: 'PACKED | SKIPPED_PRESENT | FAILED | UNKNOWN — classified from observed evidence, never from job success'
    value: ${{ steps.summary.outputs.leg_status }}
  leg_reason:
    description: 'Why the leg reached that status (empty when the evidence is complete)'
    value: ${{ steps.summary.outputs.leg_reason }}
  leg_pack_attempted:
    description: "true when this leg entered the candidate-pack path (registry state ABSENT)"
    value: ${{ steps.summary.outputs.leg_pack_attempted }}
  npm_name:
    description: 'npm package name for this leg'
    value: ${{ inputs.npm_name }}
  package_version:
    description: 'Version committed at the cohort SHA'
    value: ${{ steps.exact.outputs.version }}
  registry_status:
    description: 'registry-exact status for this exact name@version'
    value: ${{ steps.exact.outputs.status }}
  candidate_sha512_hex:
    description: 'SHA-512 (hex) of the verified candidate, empty when no candidate was packed'
    value: ${{ steps.candidate.outputs.sha512_hex }}

runs:
  using: composite
  steps:
    - name: Read committed version + exact registry state
      id: exact
      shell: bash
      env:
        TOOLS_DIR: ${{ inputs.tools_dir }}
        COHORT: ${{ inputs.cohort_sha }}
        PKG_REL: packages/${{ inputs.pkg_dir }}/package.json
        NAME: ${{ inputs.npm_name }}
      run: |
        set -euo pipefail
        # cwd = PRODUCT checkout (cohort SHA) at the workspace root.
        # Control scripts come from $TOOLS_DIR (the trusted, reviewed tools
        # SHA the caller records in the run summary alongside the cohort).
        LOCAL_VERSION=$(node -p "require('./$PKG_REL').version")
        echo "version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
        echo "Committed version at cohort SHA: $NAME@$LOCAL_VERSION"

        # Did THIS cohort introduce $LOCAL_VERSION, or is it unchanged across
        # the cohort? A Version PR merge's first parent is main before it
        # landed. A cohort bumps only SOME packages; an UNCHANGED package's
        # version was legitimately published by an EARLIER cohort commit, so
        # its registry gitHead can never equal this cohort SHA. Provenance
        # equality against the cohort is therefore only required for versions
        # this cohort actually introduces (SPEC §17).
        PREV_VERSION=$(git show "$COHORT^:$PKG_REL" | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
        if [ "$PREV_VERSION" = "$LOCAL_VERSION" ]; then INTRODUCED=false; else INTRODUCED=true; fi
        echo "introduced_by_cohort=$INTRODUCED" >> "$GITHUB_OUTPUT"

        # registry-exact (TOOLS) exits non-zero for CONFLICT/UNVERIFIED/ERROR/BEHIND;
        # its JSON payload is written regardless. Neutralize the exit and read
        # the status so the provenance decision below is explicit rather than
        # an abrupt `set -e` abort that hides the real reason.
        node "$TOOLS_DIR/scripts/release/registry-exact.mjs" "$NAME" "$LOCAL_VERSION" \
          --expect-git-head "$COHORT" --json > exact.json || true
        cat exact.json
        STATUS=$(node -p "require('./exact.json').status")
        GIT_HEAD=$(node -p "require('./exact.json').gitHead || ''")

        # A registry failure is never "absent", and publishing a version the
        # registry has already moved past forks the line — both always fatal
        # regardless of whether the cohort introduced the version (SPEC §18.3/§19).
        if [ "$STATUS" = "REGISTRY_ERROR" ] || [ "$STATUS" = "LOCAL_BEHIND_REGISTRY" ]; then
          echo "::error::Registry contract violation for $NAME@$LOCAL_VERSION: $STATUS (see exact.json above)."
          exit 1
        fi

        if [ "$STATUS" = "PRESENT_CONFLICT" ] || [ "$STATUS" = "PRESENT_UNVERIFIED" ]; then
          # A version THIS cohort introduces must match the cohort provenance;
          # a foreign gitHead (or an unverifiable tarball) is a real integrity
          # conflict and fails loud — this is the check that catches a version
          # already burned on npm from a different tree.
          # Only an UNCHANGED package may reuse a prior publish, and only when
          # that publish commit is provably an ancestor of this cohort (a
          # foreign commit is never an ancestor, so it still fails loud).
          if [ "$INTRODUCED" = "false" ] && [ -n "$GIT_HEAD" ] \
            && git cat-file -e "${GIT_HEAD}^{commit}" 2>/dev/null \
            && git merge-base --is-ancestor "$GIT_HEAD" "$COHORT"; then
            echo "npm upload skipped: $NAME@$LOCAL_VERSION is unchanged by this cohort and was published from ${GIT_HEAD:0:12}, an ancestor of $COHORT (a prior release)."
            STATUS="PRESENT_PRIOR"
          else
            echo "::error::Provenance conflict for $NAME@$LOCAL_VERSION ($STATUS, gitHead=${GIT_HEAD:-none}, introduced_by_cohort=$INTRODUCED): a version this cohort introduces is already on npm from a different or unverifiable commit. Refusing to assume it belongs to this release (SPEC §17/§19)."
            exit 1
          fi
        fi
        echo "status=$STATUS" >> "$GITHUB_OUTPUT"

    - name: Verify registry dependencies are published
      # Publish-order safety net, preserved (SPEC §20): a package whose
      # runtime dependency range resolves to nothing breaks `npm install`
      # for every consumer. PRI-886 replaced the legacy inline gate — a
      # version query whose every diagnostic was discarded, on a flat
      # 75-second budget, which misread registry propagation lag as a
      # committed-range error (production evidence: run 35596275911
      # failed at 4/7 on @principles/core@^1.287.1 minutes after 1/7
      # published it) — with the tools-checkout deps-preflight: static
      # range/order validation up front, then a classified bounded
      # backoff wait (5/10/20/40→≤60s, total window 10min, per-request
      # timeout) for dependencies published earlier in this same train.
      # Exit 10 = deterministic range/order error; 11 = not visible
      # within the window (NOT a range error); 12 = registry error class.
      if: ${{ steps.exact.outputs.status == 'ABSENT' }}
      shell: bash
      env:
        TOOLS_DIR: ${{ inputs.tools_dir }}
        TRAIN_ORDER: ${{ inputs.train_order }}
        PKG_DIR: ${{ inputs.pkg_dir }}
      run: |
        set -euo pipefail
        node "$TOOLS_DIR/scripts/release/deps-preflight.mjs" \
          --workspace-root . \
          --order "$TRAIN_ORDER" \
          --package "$PKG_DIR"

    - name: Build target package
      if: ${{ steps.exact.outputs.status == 'ABSENT' }}
      shell: bash
      env:
        TOOLS_DIR: ${{ inputs.tools_dir }}
        COHORT: ${{ inputs.cohort_sha }}
      run: |
        set -euo pipefail
        PKG_DIR="${{ inputs.pkg_dir }}"
        # G3.2 build-once: every leg runs in ONE job against ONE cohort
        # checkout, so a (workspace, script) pair already built by an EARLIER
        # LEG has identical inputs here. build-once.mjs reuses it only when its
        # job-scoped ledger records THIS cohort, the same package version and a
        # dist/ SHA-256 that still matches disk; any mismatch is announced as a
        # ::warning:: and the package is rebuilt (never a silent skip/fallback).
        # Absolute paths: later branches cd into a package directory.
        ROOT_ABS="$(pwd)"
        TOOLS_ABS="$(cd "$TOOLS_DIR" && pwd)"
        build_once() {
          node "$TOOLS_ABS/scripts/release/build-once.mjs" \
            --workspace "$1" --script "$2" --dir "$ROOT_ABS/$3" --cohort "$COHORT"
        }
        # Preamble-built packages (core, install-layout, host-runtime): every
        # caller of this action (publish-npm train AND publish-preflight
        # rehearsal) builds them in its own preamble, in this job, at this
        # cohort, before any leg. A leg rebuild is a pure duplicate (G3.2), so
        # the leg VERIFIES the preamble output instead — fail-closed, never a
        # silent rebuild and never a pack without dist/ (PRI-979).
        assert_preamble_dist() {
          if [ ! -s "$ROOT_ABS/packages/$1/dist/index.js" ]; then
            echo "::error::packages/$1/dist/index.js is missing — the caller's preamble must build $1 before this leg runs (G3.2 contract)."
            exit 1
          fi
          echo "Verified preamble build of $1 (no rebuild)."
        }
        if [ "$PKG_DIR" = "principles-core" ]; then
          assert_preamble_dist principles-core
        elif [ "$PKG_DIR" = "openclaw-plugin" ]; then
          # G3.1-A: the plugin's prepack (build:production && build:types) IS
          # its build. It is executed HERE, exactly once, and the candidate
          # pack runs with --ignore-scripts. Previously `npm pack --dry-run`
          # and the directory `npm publish` each ran that prepack again, so the
          # production bundle was built three times for one published artifact.
          # build:production cleans dist and emits the production bundle;
          # build:types emits the declarations the package `types` field needs.
          npm run build:production --workspace=principles-disciple
          npm run build:types --workspace=principles-disciple
        elif [ "$PKG_DIR" = "pd-cli" ]; then
          # pd-cli imports types from principles-disciple AND from
          # @principles/codex-adapter (codex-worker / codex-ingest-catchup /
          # health-codex) AND from @principles/workbuddy-adapter
          # (commands/workbuddy-worker). Those adapters must be built HERE, not
          # inherited from their own leg's side effect: when an adapter version
          # is unchanged from the prior cohort the leg resolves PRESENT_PRIOR
          # and every ABSENT-gated step — including its build — is skipped,
          # leaving no dist/ for pd-cli's tsc (run 35834470066, TS2307 x4;
          # same class as PRI-979).
          # G3.1-A: pd-cli's prepack is exactly `npm run build`, which is the
          # build_once command below — so the candidate pack uses
          # --ignore-scripts and that build still happens exactly once (or is
          # reused only when the ledger's cohort/version/dist identity matches).
          npm run build --workspace=principles-disciple
          build_once @principles/codex-adapter build packages/codex-adapter
          build_once @principles/workbuddy-adapter build packages/workbuddy-adapter
          build_once @principles/pd-cli build packages/pd-cli
        elif [ "$PKG_DIR" = "create-principles-disciple" ]; then
          # esbuild first (cleans dist, produces bundle.js), then tsc
          # --emitDeclarationOnly. codex-adapter must be built before the
          # installer (bundle-plugin.mjs bundles it); the installer before
          # pd_console (console typechecks against its dist types).
          #
          # PD_BUNDLE_PRESERVE_SOURCE_VERSIONS is NOT exported here: this step
          # does not run `bundle`. The bundle runs from prepack inside the
          # "Pack and verify immutable candidate" step, a separate shell that
          # cannot see this step's environment (release 1.150.1 shipped
          # pd-cli 2.1.0 over the cohort's 2.2.0 exactly because of that).
          # The preserve contract is set as `env:` on the pack step.
          npm run build:production --workspace=principles-disciple
          npm run build:types --workspace=principles-disciple
          build_once @principles/codex-adapter build packages/codex-adapter
          build_once @principles/workbuddy-adapter build packages/workbuddy-adapter
          # Gate 4 (PRI-1071): bundle-plugin.mjs copies the MCP server dist
          # verbatim; its own leg uses the same build-once entry.
          build_once @principles/pd-mcp-server build packages/pd-mcp-server
          build_once @principles/pd-cli build packages/pd-cli
          cd packages/create-principles-disciple && npm run build
          npm run build --workspace=@principles/pd-console
        elif [ "$PKG_DIR" = "host-runtime" ]; then
          assert_preamble_dist host-runtime
        elif [ "$PKG_DIR" = "install-layout" ]; then
          assert_preamble_dist install-layout
        elif [ "$PKG_DIR" = "codex-adapter" ]; then
          build_once @principles/codex-adapter build packages/codex-adapter
        elif [ "$PKG_DIR" = "workbuddy-adapter" ]; then
          build_once @principles/workbuddy-adapter build packages/workbuddy-adapter
        elif [ "$PKG_DIR" = "pd-mcp-server" ]; then
          # Gate 4 (PRI-1071): the shared MCP server's dist is a required
          # installer payload input (bundle-plugin.mjs copies it verbatim).
          build_once @principles/pd-mcp-server build packages/pd-mcp-server
        else
          # No silent no-op: an unmapped leg would pack without dist/ and ship
          # a package whose `files` entries simply are not there (PRI-979).
          echo "::error::No build branch for pkg_dir=$PKG_DIR in publish-npm-package/action.yml — add one before adding a train leg."
          exit 1
        fi

    - name: Stamp npm payload product identity
      # Unchanged authority (SPEC v0.3 §12): the installer payload carries
      # its own identity stamp; the product version comes from the TRAIN
      # resolver (root manifest at the cohort SHA), never from a package
      # version. The source commit is the cohort SHA this train publishes.
      if: ${{ steps.exact.outputs.status == 'ABSENT' && inputs.pkg_dir == 'create-principles-disciple' }}
      shell: bash
      run: |
        VERSION="${{ inputs.product_identity_version }}"
        SOURCE_COMMIT="${{ inputs.cohort_sha }}"
        node -e '
          const { writeFileSync, mkdirSync } = require("node:fs");
          const { join } = require("node:path");
          const [version, sourceCommit] = process.argv.slice(1);
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
            throw new Error(`Refusing to stamp: version is not a strict x.y.z product version: ${JSON.stringify(version)}`);
          }
          if (!/^[a-f0-9]{40}$/.test(sourceCommit)) {
            throw new Error(`Refusing to stamp: source commit is not a 40-char git sha: ${JSON.stringify(sourceCommit)}`);
          }
          const releaseDir = join("packages", "create-principles-disciple", "_release");
          mkdirSync(releaseDir, { recursive: true });
          const identity = { schemaVersion: 1, productVersion: version, sourceCommit };
          writeFileSync(join(releaseDir, "product-identity.json"), `${JSON.stringify(identity, null, 2)}\n`);
          console.log(`Stamped npm payload product identity: version=${version} commit=${sourceCommit.slice(0, 12)}`);
        ' "$VERSION" "$SOURCE_COMMIT"

    - name: Pack and verify immutable candidate
      id: candidate
      # The ONLY pack for this leg (G3.1 + G3.1-A). The helper runs one npm
      # pack, overlays the cohort gitHead in an unpacked copy, deterministically
      # repacks it, verifies the final tarball, and emits its SHA-512. Publish
      # consumes exactly that file, so the uploaded bytes are the verified
      # bytes for EVERY train package, not just the installer.
      if: ${{ steps.exact.outputs.status == 'ABSENT' }}
      shell: bash
      env:
        TOOLS_DIR: ${{ inputs.tools_dir }}
        PACKAGE_DIR: packages/${{ inputs.pkg_dir }}
        PKG_DIR: ${{ inputs.pkg_dir }}
        PACKAGE_NAME: ${{ inputs.npm_name }}
        COHORT: ${{ inputs.cohort_sha }}
        PACKAGE_VERSION: ${{ steps.exact.outputs.version }}
        PRODUCT_VERSION: ${{ inputs.product_identity_version }}
        # Step env is the ONLY channel that reaches prepack: the installer
        # bundle must carry the versions committed at the cohort SHA, never
        # the movable registry latest (SPEC v1.2 §21). prepare-npm-candidate
        # additionally fails closed if any payload component disagrees with
        # the cohort commit.
        PD_BUNDLE_PRESERVE_SOURCE_VERSIONS: '1'
      run: |
        set -euo pipefail
        if [[ ! "$PACKAGE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          echo "::error::Refusing candidate: package version is not strict x.y.z: $PACKAGE_VERSION"
          exit 1
        fi
        # Packages whose leg builds the prepack variant EXPLICITLY in "Build
        # target package" must not let pack run that lifecycle a second time.
        # Every other package's prepack/prepare (if any) belongs to the one
        # pack below — this is the same lifecycle the old dry-run pack ran,
        # except its output is now the verified published artifact.
        SKIP_PACK_SCRIPTS=0
        if [ "$PKG_DIR" = "openclaw-plugin" ] || [ "$PKG_DIR" = "pd-cli" ]; then
          SKIP_PACK_SCRIPTS=1
          # With the lifecycle skipped, a broken build branch would publish a
          # stale or empty dist. Fail closed instead of packing it.
          if [ ! -s "$PACKAGE_DIR/dist/index.js" ]; then
            echo "::error::$PACKAGE_DIR/dist/index.js is missing — this leg must build its payload before the candidate pack."
            exit 1
          fi
        fi
        CANDIDATE_DIR="$(mktemp -d "$RUNNER_TEMP/pd-candidate.XXXXXX")"
        SAFE_NAME="$(printf '%s' "$PACKAGE_NAME" | sed 's#^@##; s#/#-#g')"
        FINAL_TARBALL="$CANDIDATE_DIR/$SAFE_NAME-$PACKAGE_VERSION.tgz"
        ARGS=(
          --package-dir "$PACKAGE_DIR"
          --package-name "$PACKAGE_NAME"
          --output "$FINAL_TARBALL"
          --cohort "$COHORT"
          --package-version "$PACKAGE_VERSION"
          --github-output "$GITHUB_OUTPUT"
        )
        # Only the installer carries the product-identity stamp contract.
        if [ -n "$PRODUCT_VERSION" ]; then
          ARGS+=(--product-version "$PRODUCT_VERSION")
        fi
        if [ "$SKIP_PACK_SCRIPTS" = "1" ]; then
          ARGS+=(--skip-pack-scripts)
        fi
        node "$TOOLS_DIR/scripts/release/prepare-npm-candidate.mjs" "${ARGS[@]}"
        test -s "$FINAL_TARBALL"

    - name: Publish exact committed version
      id: publish
      if: ${{ steps.exact.outputs.status == 'ABSENT' }}
      shell: bash
      env:
        TOOLS_DIR: ${{ inputs.tools_dir }}
        COHORT: ${{ inputs.cohort_sha }}
        NAME: ${{ inputs.npm_name }}
        VERSION: ${{ steps.exact.outputs.version }}
        DRY_RUN: ${{ inputs.dry_run }}
        CANDIDATE_TARBALL: ${{ steps.candidate.outputs.tarball }}
        CANDIDATE_SHA512_HEX: ${{ steps.candidate.outputs.sha512_hex }}
        NODE_AUTH_TOKEN: ${{ inputs.npm_token }}
      run: |
        # Re-hash the same immutable file immediately before the upload. This
        # binds the publish command to the bytes verified in the candidate step
        # for EVERY package; there is no directory-publish fallback.
        if [ -z "$CANDIDATE_TARBALL" ] || [ ! -s "$CANDIDATE_TARBALL" ]; then
          echo "::error::Candidate tarball is missing; refusing to publish anything else."
          exit 1
        fi
        if [[ ! "$CANDIDATE_SHA512_HEX" =~ ^[a-f0-9]{128}$ ]]; then
          echo "::error::Candidate SHA-512 output is missing or malformed."
          exit 1
        fi
        # coreutils checksum tools prefix the whole line with a backslash in
        # escaped mode (file name containing a backslash — Windows dev paths).
        # The hash itself is plain hex, so stripping backslashes is exact.
        ACTUAL_SHA512_HEX="$(sha512sum "$CANDIDATE_TARBALL" | cut -d' ' -f1 | tr -d '\\')"
        if [ "$ACTUAL_SHA512_HEX" != "$CANDIDATE_SHA512_HEX" ]; then
          echo "::error::Candidate changed after verification; refusing to publish."
          exit 1
        fi

        # Rehearsal gate decided in BASH, not in a step-level `if`
        # expression: GitHub expressions coerce across boolean/string in
        # ways that are not reliable for input gating. Env values are
        # always strings; this comparison is exact.
        if [ "$DRY_RUN" = "true" ]; then
          echo "DRY RUN (rehearsal): immutable candidate verified (sha512=$CANDIDATE_SHA512_HEX); the real npm upload is SKIPPED."
          exit 0
        fi

        TOOLS_ABS="$(cd "$TOOLS_DIR" && pwd)"
        echo "Publishing exact committed version $NAME@$VERSION (no bump, no reset)."
        # npm's tarball-spec publish path runs NO pack/prepublish lifecycle, so
        # it cannot rebuild or replace the verified bytes; provenance attests
        # exactly this uploaded tarball.
        # On failure, re-verify registry exact state: PRESENT_MATCH from the
        # cohort commit continues; anything else fails loud (PRI-886).
        #
        # The upload's own output is captured because a SUCCESSFUL upload is
        # only evidence of OIDC trusted publishing when npm says it signed the
        # provenance statement. PRI-1200: a weaker CLI silently fell back to
        # NPM_TOKEN, published nothing (403 on a 2FA package) and no version
        # assertion could see it. The log line is the authentication proof.
        PUBLISH_LOG="$RUNNER_TEMP/npm-publish-${NAME//[^A-Za-z0-9._-]/_}-$VERSION.log"
        set +e
        npm publish "$CANDIDATE_TARBALL" --provenance --access public 2>&1 | tee "$PUBLISH_LOG"
        CODE=${PIPESTATUS[0]}
        set -e
        if [ "$CODE" -ne 0 ]; then
          echo "::warning::npm publish exited $CODE for $NAME@$VERSION — re-verifying the registry exact state before deciding."
          node "$TOOLS_ABS/scripts/release/verify-publish-outcome.mjs" "$NAME" "$VERSION" --expect-git-head "$COHORT"
        else
          if ! grep -q 'Signed provenance statement with source and build information from GitHub Actions' "$PUBLISH_LOG"; then
            echo "::error::npm publish succeeded for $NAME@$VERSION but its log has no 'Signed provenance statement ... from GitHub Actions' line — provenance/OIDC trusted publishing was NOT used. Refusing to treat this leg as published."
            exit 1
          fi
          echo "OIDC trusted publishing proven: npm signed the provenance statement for $NAME@$VERSION."
        fi

    - name: Summary
      id: summary
      # Evidence-derived (PD Release G3-R3 H1): the status is classified from
      # the candidate file, its SHA-512 and its packed manifest — never from
      # "this step ran". `always()` makes a failed leg report UNKNOWN instead
      # of silently omitting the line.
      if: always()
      shell: bash
      env:
        TOOLS_DIR: ${{ inputs.tools_dir }}
        REGISTRY_STATUS: ${{ steps.exact.outputs.status }}
        PACKAGE_NAME: ${{ inputs.npm_name }}
        PACKAGE_VERSION: ${{ steps.exact.outputs.version }}
        COHORT: ${{ inputs.cohort_sha }}
        CANDIDATE_TARBALL: ${{ steps.candidate.outputs.tarball }}
        CANDIDATE_SHA512_HEX: ${{ steps.candidate.outputs.sha512_hex }}
        DRY_RUN: ${{ inputs.dry_run }}
        PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
      run: |
        set -euo pipefail
        LEG_OUT=$(node "$TOOLS_DIR/scripts/release/preflight-summary.mjs" leg \
          --registry-status "$REGISTRY_STATUS" \
          --tarball "$CANDIDATE_TARBALL" \
          --sha512-hex "$CANDIDATE_SHA512_HEX" \
          --package-name "$PACKAGE_NAME" \
          --package-version "$PACKAGE_VERSION" \
          --cohort "$COHORT" \
          --github-output "$GITHUB_OUTPUT")
        echo "$LEG_OUT"
        LEG_STATUS=$(printf '%s\n' "$LEG_OUT" | sed -n 's/^leg_status=//p')
        LEG_REASON=$(printf '%s\n' "$LEG_OUT" | sed -n 's/^leg_reason=//p')
        {
          echo "## Release Step Summary"
          echo ""
          echo "| Item | Value |"
          echo "|------|-------|"
          echo "| Package | \`$PACKAGE_NAME\` |"
          echo "| Version | \`$PACKAGE_VERSION\` (committed at cohort SHA) |"
          echo "| Registry state | \`$REGISTRY_STATUS\` |"
          echo "| Leg status | \`$LEG_STATUS\` |"
          echo "| Evidence | $LEG_REASON |"
          echo "| Cohort | \`$COHORT\` |"
          if [ -n "${CANDIDATE_SHA512_HEX:-}" ]; then
            echo "| Candidate SHA-512 (hex) | \`$CANDIDATE_SHA512_HEX\` |"
          fi
          echo ""
          case "$LEG_STATUS" in
            PACKED)
              echo "Candidate artifact independently re-verified in this step (file + SHA-512 + name/version/cohort)."
              if [ "$DRY_RUN" = "true" ]; then
                if [ "$PUBLISH_OUTCOME" = "success" ]; then
                  echo "REHEARSAL ONLY — the control path and artifact were verified, but NO npm upload happened; this is not evidence of a published version."
                else
                  echo "REHEARSAL DID NOT COMPLETE — the candidate artifact is verified, but the control path did not reach its end; no packaging claim is made."
                fi
              elif [ "$PUBLISH_OUTCOME" = "success" ]; then
                echo "Published exact committed version to npm."
              else
                echo "Candidate verified, but the npm upload did NOT complete (see the failed publish step) — this is not evidence of a published version."
              fi
              ;;
            SKIPPED_PRESENT)
              echo "npm upload skipped ($REGISTRY_STATUS) — closing steps reconciled."
              ;;
            *)
              echo "Candidate artifact could NOT be verified ($LEG_REASON); no packaging-success claim is made."
              ;;
          esac
        } >> "$GITHUB_STEP_SUMMARY"
