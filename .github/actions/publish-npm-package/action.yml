name: Publish one npm package (exact committed version)
description: >-
  Shared per-package publish logic for the release train in publish-npm.yml.
  EXACT-VERSION CONTRACT (SPEC v1.2 §19): this action has NO authority to
  invent, bump, reset or compute a version. It reads the version committed
  in package.json at the release cohort SHA, checks the registry for that
  exact name@version, and publishes it only when absent. An existing exact
  version with matching provenance SKIPS the npm upload while the caller's
  closing-step reconciliation continues (SPEC §24). One job calls this
  action as sequential steps in dependency order; the caller MUST grant
  permissions contents:write and id-token:write, and MUST have checked out
  the PRODUCT at the cohort SHA (workspace root), the TOOLS at a trusted
  reviewed SHA (tools_dir), and run setup-node (registry-url), npm ci, and
  the common core/install-layout/host-runtime builds before invoking.
  PRODUCT vs TOOLS separation (PRI-886): this action file and every
  scripts/release/* control script it calls come from the tools_dir
  checkout, while every manifest, build script and package payload comes
  from the cohort checkout at the workspace root — fixing publish tooling
  must never require burning a new product version. Closing steps (tag /
  GitHub Release / ClawHub) live in finalize-npm-release, AFTER all seven
  npm legs — they must never block an unuploaded package.
inputs:
  pkg_dir:
    description: 'Workspace directory under packages/ (e.g. principles-core)'
    required: true
    type: string
  npm_name:
    description: 'npm package name (e.g. @principles/core)'
    required: true
    type: string
  cohort_sha:
    description: 'Release cohort SHA (the Version Packages PR merge commit) — provenance expectation for the exact-version check'
    required: true
    type: string
  tools_dir:
    description: 'Directory (relative to the workspace root) holding the TOOLS checkout that provides scripts/release/* control scripts called by this action'
    required: true
    type: string
  train_order:
    description: 'Comma-separated package directories in publish (dependency topological) order — the workflow is the single source of the order'
    required: true
    type: string
  npm_token:
    description: 'npm registry token (composite actions cannot read the secrets context — the caller must pass it)'
    required: true
    type: string
  dry_run:
    description: >-
      Rehearsal mode (PRI-886): run the ENTIRE control path — exact-state
      check, dependency preflight wait, builds, dry-run pack, installer
      identity stamp + tarball verification — but skip the actual npm
      upload. Used by the no-write preflight workflow so publish-flow
      defects surface before the expensive matrix, without consuming a
      real registry version.
    required: false
    type: boolean
    default: false
  product_identity_version:
    description: >-
      The TRAIN product version to embed in the installer payload identity
      stamp (SPEC v0.3 §12 authority, unchanged). Used only by the
      create-principles-disciple step.
    required: false
    type: string
    default: ''

runs:
  using: composite
  steps:
    - name: Read committed version + exact registry state
      id: exact
      shell: bash
      env:
        TOOLS_DIR: ${{ inputs.tools_dir }}
        COHORT: ${{ inputs.cohort_sha }}
        PKG_REL: packages/${{ inputs.pkg_dir }}/package.json
        NAME: ${{ inputs.npm_name }}
      run: |
        set -euo pipefail
        # cwd = PRODUCT checkout (cohort SHA) at the workspace root.
        # Control scripts come from $TOOLS_DIR (the trusted, reviewed tools
        # SHA the caller records in the run summary alongside the cohort).
        LOCAL_VERSION=$(node -p "require('./$PKG_REL').version")
        echo "version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
        echo "Committed version at cohort SHA: $NAME@$LOCAL_VERSION"

        # Did THIS cohort introduce $LOCAL_VERSION, or is it unchanged across
        # the cohort? A Version PR merge's first parent is main before it
        # landed. A cohort bumps only SOME packages; an UNCHANGED package's
        # version was legitimately published by an EARLIER cohort commit, so
        # its registry gitHead can never equal this cohort SHA. Provenance
        # equality against the cohort is therefore only required for versions
        # this cohort actually introduces (SPEC §17).
        PREV_VERSION=$(git show "$COHORT^:$PKG_REL" | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
        if [ "$PREV_VERSION" = "$LOCAL_VERSION" ]; then INTRODUCED=false; else INTRODUCED=true; fi
        echo "introduced_by_cohort=$INTRODUCED" >> "$GITHUB_OUTPUT"

        # registry-exact (TOOLS) exits non-zero for CONFLICT/UNVERIFIED/ERROR/BEHIND;
        # its JSON payload is written regardless. Neutralize the exit and read
        # the status so the provenance decision below is explicit rather than
        # an abrupt `set -e` abort that hides the real reason.
        node "$TOOLS_DIR/scripts/release/registry-exact.mjs" "$NAME" "$LOCAL_VERSION" \
          --expect-git-head "$COHORT" --json > exact.json || true
        cat exact.json
        STATUS=$(node -p "require('./exact.json').status")
        GIT_HEAD=$(node -p "require('./exact.json').gitHead || ''")

        # A registry failure is never "absent", and publishing a version the
        # registry has already moved past forks the line — both always fatal
        # regardless of whether the cohort introduced the version (SPEC §18.3/§19).
        if [ "$STATUS" = "REGISTRY_ERROR" ] || [ "$STATUS" = "LOCAL_BEHIND_REGISTRY" ]; then
          echo "::error::Registry contract violation for $NAME@$LOCAL_VERSION: $STATUS (see exact.json above)."
          exit 1
        fi

        if [ "$STATUS" = "PRESENT_CONFLICT" ] || [ "$STATUS" = "PRESENT_UNVERIFIED" ]; then
          # A version THIS cohort introduces must match the cohort provenance;
          # a foreign gitHead (or an unverifiable tarball) is a real integrity
          # conflict and fails loud — this is the check that catches a version
          # already burned on npm from a different tree.
          # Only an UNCHANGED package may reuse a prior publish, and only when
          # that publish commit is provably an ancestor of this cohort (a
          # foreign commit is never an ancestor, so it still fails loud).
          if [ "$INTRODUCED" = "false" ] && [ -n "$GIT_HEAD" ] \
            && git cat-file -e "${GIT_HEAD}^{commit}" 2>/dev/null \
            && git merge-base --is-ancestor "$GIT_HEAD" "$COHORT"; then
            echo "npm upload skipped: $NAME@$LOCAL_VERSION is unchanged by this cohort and was published from ${GIT_HEAD:0:12}, an ancestor of $COHORT (a prior release)."
            STATUS="PRESENT_PRIOR"
          else
            echo "::error::Provenance conflict for $NAME@$LOCAL_VERSION ($STATUS, gitHead=${GIT_HEAD:-none}, introduced_by_cohort=$INTRODUCED): a version this cohort introduces is already on npm from a different or unverifiable commit. Refusing to assume it belongs to this release (SPEC §17/§19)."
            exit 1
          fi
        fi
        echo "status=$STATUS" >> "$GITHUB_OUTPUT"

    - name: Verify registry dependencies are published
      # Publish-order safety net, preserved (SPEC §20): a package whose
      # runtime dependency range resolves to nothing breaks `npm install`
      # for every consumer. PRI-886 replaced the legacy inline gate — a
      # version query whose every diagnostic was discarded, on a flat
      # 75-second budget, which misread registry propagation lag as a
      # committed-range error (production evidence: run 35596275911
      # failed at 4/7 on @principles/core@^1.287.1 minutes after 1/7
      # published it) — with the tools-checkout deps-preflight: static
      # range/order validation up front, then a classified bounded
      # backoff wait (5/10/20/40→≤60s, total window 10min, per-request
      # timeout) for dependencies published earlier in this same train.
      # Exit 10 = deterministic range/order error; 11 = not visible
      # within the window (NOT a range error); 12 = registry error class.
      if: ${{ steps.exact.outputs.status == 'ABSENT' }}
      shell: bash
      env:
        TOOLS_DIR: ${{ inputs.tools_dir }}
        TRAIN_ORDER: ${{ inputs.train_order }}
        PKG_DIR: ${{ inputs.pkg_dir }}
      run: |
        set -euo pipefail
        node "$TOOLS_DIR/scripts/release/deps-preflight.mjs" \
          --workspace-root . \
          --order "$TRAIN_ORDER" \
          --package "$PKG_DIR"

    - name: Build target package
      if: ${{ steps.exact.outputs.status == 'ABSENT' }}
      shell: bash
      run: |
        PKG_DIR="${{ inputs.pkg_dir }}"
        if [ "$PKG_DIR" = "openclaw-plugin" ]; then
          npm run build --workspace=principles-disciple
        elif [ "$PKG_DIR" = "pd-cli" ]; then
          # pd-cli imports types from principles-disciple — build it first.
          npm run build --workspace=principles-disciple
          npm run build --workspace=@principles/pd-cli
        elif [ "$PKG_DIR" = "create-principles-disciple" ]; then
          # esbuild first (cleans dist, produces bundle.js), then tsc
          # --emitDeclarationOnly. codex-adapter must be built before the
          # installer (bundle-plugin.mjs bundles it); the installer before
          # pd_console (console typechecks against its dist types).
          # PD_BUNDLE_PRESERVE_SOURCE_VERSIONS: the bundle is built at the
          # release cohort SHA — bundled payloads must carry the committed
          # versions, NOT the movable registry latest (SPEC v1.2 §21).
          export PD_BUNDLE_PRESERVE_SOURCE_VERSIONS=1
          npm run build:production --workspace=principles-disciple
          npm run build:types --workspace=principles-disciple
          npm run build --workspace=@principles/codex-adapter
          npm run build --workspace=@principles/pd-cli
          cd packages/create-principles-disciple && npm run build
          npm run build --workspace=@principles/pd-console
        elif [ "$PKG_DIR" = "host-runtime" ]; then
          npm run build --workspace=@principles/host-runtime
        elif [ "$PKG_DIR" = "install-layout" ]; then
          npm run build --workspace=@principles/install-layout
        elif [ "$PKG_DIR" = "codex-adapter" ]; then
          npm run build --workspace=@principles/codex-adapter
        fi

    - name: Verify package dry-run
      if: ${{ steps.exact.outputs.status == 'ABSENT' }}
      shell: bash
      run: |
        set -o pipefail
        cd "packages/${{ inputs.pkg_dir }}"
        npm pack --dry-run 2>&1 | head -50

    - name: Stamp npm payload product identity
      # Unchanged authority (SPEC v0.3 §12): the installer payload carries
      # its own identity stamp; the product version comes from the TRAIN
      # resolver (root manifest at the cohort SHA), never from a package
      # version. The source commit is the cohort SHA this train publishes.
      if: ${{ steps.exact.outputs.status == 'ABSENT' && inputs.pkg_dir == 'create-principles-disciple' }}
      shell: bash
      run: |
        VERSION="${{ inputs.product_identity_version }}"
        SOURCE_COMMIT="${{ inputs.cohort_sha }}"
        node -e '
          const { writeFileSync, mkdirSync } = require("node:fs");
          const { join } = require("node:path");
          const [version, sourceCommit] = process.argv.slice(1);
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
            throw new Error(`Refusing to stamp: version is not a strict x.y.z product version: ${JSON.stringify(version)}`);
          }
          if (!/^[a-f0-9]{40}$/.test(sourceCommit)) {
            throw new Error(`Refusing to stamp: source commit is not a 40-char git sha: ${JSON.stringify(sourceCommit)}`);
          }
          const releaseDir = join("packages", "create-principles-disciple", "_release");
          mkdirSync(releaseDir, { recursive: true });
          const identity = { schemaVersion: 1, productVersion: version, sourceCommit };
          writeFileSync(join(releaseDir, "product-identity.json"), `${JSON.stringify(identity, null, 2)}\n`);
          console.log(`Stamped npm payload product identity: version=${version} commit=${sourceCommit.slice(0, 12)}`);
        ' "$VERSION" "$SOURCE_COMMIT"

    - name: Verify the packed installer tarball carries the product identity
      # PRI-874: the stamp must survive into the ACTUAL npm tarball (files[]
      # inclusion, prepack effects) — checking the working directory is not
      # evidence. Final pre-publish identity gate for the installer leg.
      # PRI-881: pack into an isolated directory and verify the single
      # tarball it produces — `npm pack --json` stdout is polluted by the
      # prepack (build + bundle) progress lines. Restored into the exact-
      # version train by the changesets cutover merge (SPEC v1.2 §20
      # preserves this gate; tarball identity verification is unchanged
      # authority). Runs only when this leg will actually publish (ABSENT);
      # the already-published skip path has a verified registry tarball.
      if: ${{ steps.exact.outputs.status == 'ABSENT' && inputs.pkg_dir == 'create-principles-disciple' }}
      shell: bash
      run: |
        VERSION="${{ inputs.product_identity_version }}"
        node -e '
          const { execFileSync } = require("node:child_process");
          const { readFileSync, mkdtempSync, readdirSync, rmSync } = require("node:fs");
          const { join } = require("node:path");
          const { tmpdir } = require("node:os");
          const expected = process.argv[1];
          const work = mkdtempSync(join(tmpdir(), "pd-tarball-identity-"));
          try {
            execFileSync("npm", ["pack", "--pack-destination", work], { encoding: "utf8", cwd: "packages/create-principles-disciple" });
            const artifacts = readdirSync(work).filter((f) => f.endsWith(".tgz"));
            if (artifacts.length !== 1) {
              throw new Error(`expected exactly one packed tarball, got: ${JSON.stringify(artifacts)}`);
            }
            execFileSync("tar", ["-xzf", join(work, artifacts[0]), "-C", work, "package/_release/product-identity.json"]);
            const identity = JSON.parse(readFileSync(join(work, "package", "_release", "product-identity.json"), "utf8"));
            if (identity.productVersion !== expected) {
              throw new Error(`Packed tarball identity ${JSON.stringify(identity.productVersion)} != resolved product identity ${JSON.stringify(expected)}`);
            }
            console.log(`Tarball identity verified: version=${identity.productVersion} commit=${String(identity.sourceCommit).slice(0, 12)}`);
          } finally {
            rmSync(work, { recursive: true, force: true });
          }
        ' "$VERSION"

    - name: Publish exact committed version
      if: ${{ steps.exact.outputs.status == 'ABSENT' }}
      shell: bash
      env:
        TOOLS_DIR: ${{ inputs.tools_dir }}
        COHORT: ${{ inputs.cohort_sha }}
        NAME: ${{ inputs.npm_name }}
        VERSION: ${{ steps.exact.outputs.version }}
        DRY_RUN: ${{ inputs.dry_run }}
        NODE_AUTH_TOKEN: ${{ inputs.npm_token }}
      run: |
        # Rehearsal gate decided in BASH, not in a step-level `if`
        # expression: GitHub expressions coerce across boolean/string in
        # ways that are not reliable for input gating — the preflight
        # rehearsal (run 35666369142) proved a boolean-inequality gate on
        # this input OPENED for a boolean true and attempted a real
        # upload (blocked only by the job's missing id-token). Env values
        # are always strings; this comparison is exact.
        if [ "$DRY_RUN" = "true" ]; then
          echo "DRY RUN (rehearsal): the real npm upload is SKIPPED; the packed artifact and control-path checks above are the rehearsal evidence."
          exit 0
        fi
        # Resolve the tools checkout to an ABSOLUTE path BEFORE cd-ing into
        # the package directory — the failure fallback below must stay
        # valid from inside packages/<dir> (rehearsal run 35666369142:
        # relative release-tools/ resolved to packages/<dir>/release-tools
        # and crashed with MODULE_NOT_FOUND instead of deciding).
        TOOLS_ABS="$(cd "$TOOLS_DIR" && pwd)"
        cd "packages/${{ inputs.pkg_dir }}"
        echo "Publishing exact committed version $NAME@$VERSION (no bump, no reset)."
        # An npm exit code is not always the truth: the upload can land and
        # the ack get lost. On failure, re-verify the registry exact state
        # from the TOOLS checkout before deciding — PRESENT_MATCH from the
        # cohort commit continues, anything else fails loud (PRI-886).
        set +e
        npm publish --provenance --access public
        CODE=$?
        set -e
        if [ "$CODE" -ne 0 ]; then
          echo "::warning::npm publish exited $CODE for $NAME@$VERSION — re-verifying the registry exact state before deciding."
          node "$TOOLS_ABS/scripts/release/verify-publish-outcome.mjs" "$NAME" "$VERSION" --expect-git-head "$COHORT"
        fi

    - name: Summary
      shell: bash
      run: |
        echo "## Release Step Summary" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
        echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
        echo "| Package | \`${{ inputs.npm_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Version | \`${{ steps.exact.outputs.version }}\` (committed at cohort SHA) |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Registry state | \`${{ steps.exact.outputs.status }}\` |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Cohort | \`${{ inputs.cohort_sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Tools | \`${{ inputs.tools_dir }}\` |" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        if [ "${{ steps.exact.outputs.status }}" = "ABSENT" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
          echo "REHEARSAL ONLY — control path exercised and artifact packed, but NO npm upload happened; this is not evidence of a published version." >> "$GITHUB_STEP_SUMMARY"
        elif [ "${{ steps.exact.outputs.status }}" = "ABSENT" ]; then
          echo "Published exact committed version to npm." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "npm upload skipped (${{ steps.exact.outputs.status }}) — closing steps reconciled." >> "$GITHUB_STEP_SUMMARY"
        fi
