name: Publish one npm package (exact committed version)
description: >-
  Shared per-package publish logic for the release train in publish-npm.yml.
  EXACT-VERSION CONTRACT (SPEC v1.2 §19): this action has NO authority to
  invent, bump, reset or compute a version. It reads the version committed
  in package.json at the release cohort SHA, checks the registry for that
  exact name@version, and publishes it only when absent. An existing exact
  version with matching provenance SKIPS the npm upload while the caller's
  closing-step reconciliation continues (SPEC §24). One job calls this
  action as sequential steps in dependency order; the caller MUST grant
  permissions contents:write and id-token:write, and MUST have run checkout
  of the cohort SHA, setup-node (registry-url), npm ci, and the common
  core/install-layout/host-runtime builds before invoking.
inputs:
  pkg_dir:
    description: 'Workspace directory under packages/ (e.g. principles-core)'
    required: true
    type: string
  npm_name:
    description: 'npm package name (e.g. @principles/core)'
    required: true
    type: string
  cohort_sha:
    description: 'Release cohort SHA (the Version Packages PR merge commit) — provenance expectation for the exact-version check'
    required: true
    type: string
  npm_token:
    description: 'npm registry token (composite actions cannot read the secrets context — the caller must pass it)'
    required: true
    type: string
  github_token:
    description: 'GitHub token for the plugin release closing steps (passed in by the caller)'
    required: false
    type: string
    default: ''
  clawhub_token:
    description: 'ClawHub marketplace token; empty skips the sync (passed in by the caller)'
    required: false
    type: string
    default: ''
  product_identity_version:
    description: >-
      The TRAIN product version to embed in the installer payload identity
      stamp (SPEC v0.3 §12 authority, unchanged). Used only by the
      create-principles-disciple step.
    required: false
    type: string
    default: ''

runs:
  using: composite
  steps:
    - name: Read committed version + exact registry state
      id: exact
      shell: bash
      run: |
        set -euo pipefail
        LOCAL_VERSION=$(node -p "require('./packages/${{ inputs.pkg_dir }}/package.json').version")
        echo "version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
        echo "Committed version at cohort SHA: ${{ inputs.npm_name }}@$LOCAL_VERSION"

        node scripts/release/registry-exact.mjs "${{ inputs.npm_name }}" "$LOCAL_VERSION" \
          --expect-git-head "${{ inputs.cohort_sha }}" --json > exact.json
        cat exact.json
        STATUS=$(node -p "require('./exact.json').status")
        echo "status=$STATUS" >> "$GITHUB_OUTPUT"
        if [ "$STATUS" = "REGISTRY_ERROR" ] || [ "$STATUS" = "PRESENT_CONFLICT" ] \
          || [ "$STATUS" = "PRESENT_UNVERIFIED" ] || [ "$STATUS" = "LOCAL_BEHIND_REGISTRY" ]; then
          echo "::error::Registry contract violation for ${{ inputs.npm_name }}@$LOCAL_VERSION: $STATUS (see exact.json above)."
          exit 1
        fi

    - name: Verify registry dependencies are published
      # Publish-order safety net, preserved (SPEC §20): a package whose
      # runtime dependency range resolves to nothing breaks `npm install`
      # for every consumer. The retry loop tolerates registry propagation
      # lag from a package published moments earlier in the release train.
      # The ranges checked are THIS package's own committed declarations.
      if: ${{ steps.exact.outputs.status == 'ABSENT' }}
      shell: bash
      run: |
        check_resolvable() {
          local PKG="$1"
          local RANGE="$2"
          for attempt in 1 2 3 4 5; do
            if npm view "$PKG@$RANGE" version >/dev/null 2>&1; then
              echo "$PKG@$RANGE resolves on the registry (attempt $attempt)."
              return 0
            fi
            echo "Attempt $attempt/5: $PKG@$RANGE not resolvable yet; waiting 15s..."
            sleep 15
          done
          echo "::error::$PKG@$RANGE (declared by ${{ inputs.npm_name }}) does not resolve on the registry — publishing now would break 'npm install ${{ inputs.npm_name }}'. The dependency's cohort version publishes earlier in the train; a persistent failure means the committed range excludes it."
          exit 1
        }
        node -e '
          const deps = require("./packages/${{ inputs.pkg_dir }}/package.json").dependencies ?? {};
          for (const [k, v] of Object.entries(deps)) {
            if (k.startsWith("@principles/") || k === "principles-disciple") console.log(`${k}\t${v}`);
          }
        ' | while IFS=$'\t' read -r PKG RANGE; do
          check_resolvable "$PKG" "$RANGE"
        done

    - name: Build target package
      if: ${{ steps.exact.outputs.status == 'ABSENT' }}
      shell: bash
      run: |
        PKG_DIR="${{ inputs.pkg_dir }}"
        if [ "$PKG_DIR" = "openclaw-plugin" ]; then
          npm run build --workspace=principles-disciple
        elif [ "$PKG_DIR" = "pd-cli" ]; then
          # pd-cli imports types from principles-disciple — build it first.
          npm run build --workspace=principles-disciple
          npm run build --workspace=@principles/pd-cli
        elif [ "$PKG_DIR" = "create-principles-disciple" ]; then
          # esbuild first (cleans dist, produces bundle.js), then tsc
          # --emitDeclarationOnly. codex-adapter must be built before the
          # installer (bundle-plugin.mjs bundles it); the installer before
          # pd_console (console typechecks against its dist types).
          # PD_BUNDLE_PRESERVE_SOURCE_VERSIONS: the bundle is built at the
          # release cohort SHA — bundled payloads must carry the committed
          # versions, NOT the movable registry latest (SPEC v1.2 §21).
          export PD_BUNDLE_PRESERVE_SOURCE_VERSIONS=1
          npm run build:production --workspace=principles-disciple
          npm run build:types --workspace=principles-disciple
          npm run build --workspace=@principles/codex-adapter
          npm run build --workspace=@principles/pd-cli
          cd packages/create-principles-disciple && npm run build
          npm run build --workspace=@principles/pd-console
        elif [ "$PKG_DIR" = "host-runtime" ]; then
          npm run build --workspace=@principles/host-runtime
        elif [ "$PKG_DIR" = "install-layout" ]; then
          npm run build --workspace=@principles/install-layout
        elif [ "$PKG_DIR" = "codex-adapter" ]; then
          npm run build --workspace=@principles/codex-adapter
        fi

    - name: Verify package dry-run
      if: ${{ steps.exact.outputs.status == 'ABSENT' }}
      shell: bash
      run: |
        set -o pipefail
        cd "packages/${{ inputs.pkg_dir }}"
        npm pack --dry-run 2>&1 | head -50

    - name: Stamp npm payload product identity
      # Unchanged authority (SPEC v0.3 §12): the installer payload carries
      # its own identity stamp; the product version comes from the TRAIN
      # resolver (root manifest at the cohort SHA), never from a package
      # version. The source commit is the cohort SHA this train publishes.
      if: ${{ steps.exact.outputs.status == 'ABSENT' && inputs.pkg_dir == 'create-principles-disciple' }}
      shell: bash
      run: |
        VERSION="${{ inputs.product_identity_version }}"
        SOURCE_COMMIT="${{ inputs.cohort_sha }}"
        node -e '
          const { writeFileSync, mkdirSync } = require("node:fs");
          const { join } = require("node:path");
          const [version, sourceCommit] = process.argv.slice(1);
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
            throw new Error(`Refusing to stamp: version is not a strict x.y.z product version: ${JSON.stringify(version)}`);
          }
          if (!/^[a-f0-9]{40}$/.test(sourceCommit)) {
            throw new Error(`Refusing to stamp: source commit is not a 40-char git sha: ${JSON.stringify(sourceCommit)}`);
          }
          const releaseDir = join("packages", "create-principles-disciple", "_release");
          mkdirSync(releaseDir, { recursive: true });
          const identity = { schemaVersion: 1, productVersion: version, sourceCommit };
          writeFileSync(join(releaseDir, "product-identity.json"), `${JSON.stringify(identity, null, 2)}\n`);
          console.log(`Stamped npm payload product identity: version=${version} commit=${sourceCommit.slice(0, 12)}`);
        ' "$VERSION" "$SOURCE_COMMIT"

    - name: Publish exact committed version
      if: ${{ steps.exact.outputs.status == 'ABSENT' }}
      shell: bash
      run: |
        cd "packages/${{ inputs.pkg_dir }}"
        echo "Publishing exact committed version ${{ inputs.npm_name }}@${{ steps.exact.outputs.version }} (no bump, no reset)."
        npm publish --provenance --access public
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm_token }}

    - name: Reconcile Git tag (idempotent)
      # The vX.Y.Z tag keeps its real semantics: it marks the PLUGIN
      # release (SPEC §25) — it has never represented the other packages'
      # independent versions and must not start now. Idempotent per SPEC
      # §24.2: absent -> create; present at the cohort commit -> skip;
      # present elsewhere -> FAIL loud.
      if: ${{ inputs.pkg_dir == 'openclaw-plugin' }}
      shell: bash
      run: |
        set -euo pipefail
        VERSION="${{ steps.exact.outputs.version }}"
        TAG="v$VERSION"
        EXISTING=$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')
        if [ -z "$EXISTING" ]; then
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG (plugin; bound to cohort ${{ inputs.cohort_sha }})"
          git push origin "$TAG"
          echo "Created and pushed tag: $TAG"
        else
          git fetch origin "refs/tags/$TAG" --quiet
          TAGGED_COMMIT=$(git rev-parse "$TAG^{commit}" 2>/dev/null || echo "")
          if [ "$TAGGED_COMMIT" = "${{ inputs.cohort_sha }}" ]; then
            echo "Tag $TAG already exists at the cohort commit — skip (idempotent)."
          else
            echo "::error::Tag $TAG exists at $TAGGED_COMMIT but this release cohort is ${{ inputs.cohort_sha }}. Refusing to move an existing tag."
            exit 1
          fi
        fi

    - name: Generate release notes
      if: ${{ inputs.pkg_dir == 'openclaw-plugin' }}
      id: changelog
      shell: bash
      run: |
        # "What's Changed" model retained for this round (SPEC §27.2).
        LAST_TAG=$(git tag --list 'v*' | sort -V | tail -1 || true)
        if [ -n "$LAST_TAG" ] && [ "$LAST_TAG" != "v${{ steps.exact.outputs.version }}" ]; then
          COMMITS=$(git log "$LAST_TAG..HEAD" --pretty=format:"- %s (%h)" --no-merges | head -80)
        else
          COMMITS=$(git log -20 --pretty=format:"- %s (%h)" --no-merges)
        fi
        FEATURES=$(echo "$COMMITS" | grep -E "^- feat" || true)
        FIXES=$(echo "$COMMITS" | grep -E "^- fix" || true)
        OTHER=$(echo "$COMMITS" | grep -vE "^- (feat|fix)" || true)
        CHANGELOG="## What's Changed\n\n"
        if [ -n "$FEATURES" ]; then CHANGELOG+="### Features\n$FEATURES\n\n"; fi
        if [ -n "$FIXES" ]; then CHANGELOG+="### Bug Fixes\n$FIXES\n\n"; fi
        if [ -n "$OTHER" ]; then CHANGELOG+="### Other Changes\n$OTHER\n\n"; fi
        CHANGELOG+="\n**Release cohort**: ${{ inputs.cohort_sha }}"
        {
          echo "changelog<<EOF"
          echo -e "$CHANGELOG"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Reconcile GitHub Release (idempotent)
      if: ${{ inputs.pkg_dir == 'openclaw-plugin' }}
      shell: bash
      run: |
        set -euo pipefail
        VERSION="${{ steps.exact.outputs.version }}"
        if gh release view "v$VERSION" >/dev/null 2>&1; then
          echo "GitHub Release v$VERSION already exists — skip (idempotent)."
          exit 0
        fi
        echo "Creating GitHub Release v$VERSION."
        echo -e "${{ steps.changelog.outputs.changelog }}" > release-notes.md
        gh release create "v$VERSION" \
          --title "Release v$VERSION" \
          --notes-file release-notes.md \
          --target "${{ inputs.cohort_sha }}"
      env:
        GH_TOKEN: ${{ inputs.github_token }}

    - name: Reconcile ClawHub marketplace (idempotent)
      # The marketplace does not auto-sync from npm. Idempotency: if the
      # version is already visible on ClawHub, skip the upload entirely
      # (SPEC §24.2). Judge success by `clawhub package inspect` seeing the
      # version, never by the publish exit code alone. A failure degrades
      # to a warning + manual fallback — it must not block npm/tag/release
      # that already succeeded.
      if: ${{ inputs.pkg_dir == 'openclaw-plugin' }}
      continue-on-error: true
      env:
        CLAWHUB_TOKEN: ${{ inputs.clawhub_token }}
      shell: bash
      run: |
        set -u

        if [ -z "${CLAWHUB_TOKEN:-}" ]; then
          echo "::warning::CLAWHUB_TOKEN secret is not set — skipping ClawHub marketplace sync."
          exit 0
        fi

        CFG_DIR="$(mktemp -d)"
        printf '{\n  "registry": "https://clawhub.ai",\n  "token": "%s"\n}\n' "$CLAWHUB_TOKEN" > "$CFG_DIR/config.json"
        chmod 600 "$CFG_DIR/config.json"
        export CLAWHUB_CONFIG_PATH="$CFG_DIR/config.json"

        npm install -g clawhub@latest
        clawhub -V  # this CLI exposes -V/--cli-version, not --version

        VERSION="$(node -p "require('./packages/openclaw-plugin/package.json').version")"
        SRC="packages/openclaw-plugin"

        if clawhub package inspect "principles-disciple" --version "$VERSION" >/dev/null 2>&1; then
          echo "::notice::ClawHub marketplace already shows v$VERSION — skip upload (idempotent)."
          exit 0
        fi
        echo "Publishing ClawHub marketplace version: $VERSION"

        # Best-effort: raise the CLI's upload timeout (120s in published
        # builds) to 600s. Non-fatal — the outer timeout guard below
        # covers a non-matching patch.
        GLOBAL_HTTP_JS="$(npm root -g)/clawhub/dist/http.js"
        if [ -f "$GLOBAL_HTTP_JS" ] && grep -q "UPLOAD_TIMEOUT_MS" "$GLOBAL_HTTP_JS"; then
          sed -i -E 's/(UPLOAD_TIMEOUT_MS = )[0-9_]+/\1600_000/' "$GLOBAL_HTTP_JS" || true
        fi

        attempt() {
          local N="$1"
          echo "--- ClawHub publish attempt $N ---"
          timeout 480 clawhub package publish "$SRC" --version "$VERSION" --wait --wait-timeout 240 || true
          if clawhub package inspect "principles-disciple" --version "$VERSION" >/dev/null 2>&1; then
            echo "::notice::ClawHub marketplace shows v$VERSION (attempt $N)."
            return 0
          fi
          echo "v$VERSION not visible on ClawHub yet (attempt $N)."
          return 1
        }

        if attempt 1; then exit 0; fi
        echo "Attempt 1 failed — waiting 30s before retry..."
        sleep 30
        if attempt 2; then exit 0; fi

        {
          echo "## ⚠️ ClawHub marketplace sync failed"
          echo ""
          echo "npm \`${VERSION}\` published successfully; the ClawHub upload timed out twice."
          echo "The package may still appear later (server-side scan can be slow)."
          echo ""
          echo "Manual fallback (on a machine with ClawHub CLI login):"
          echo '```bash'
          echo "cd packages/openclaw-plugin"
          echo "clawhub package publish . --version ${VERSION} --wait"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        echo "::warning::ClawHub marketplace sync failed for v${VERSION} — npm publish succeeded. See step summary for the manual fallback command."
        exit 1

    - name: Summary
      shell: bash
      run: |
        echo "## Release Step Summary" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
        echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
        echo "| Package | \`${{ inputs.npm_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Version | \`${{ steps.exact.outputs.version }}\` (committed at cohort SHA) |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Registry state | \`${{ steps.exact.outputs.status }}\` |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Cohort | \`${{ inputs.cohort_sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        if [ "${{ steps.exact.outputs.status }}" = "ABSENT" ]; then
          echo "Published exact committed version to npm." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "npm upload skipped (${{ steps.exact.outputs.status }}) — closing steps reconciled." >> "$GITHUB_STEP_SUMMARY"
        fi
