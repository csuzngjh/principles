<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Principles Disciple (PD) - Promo Video</title>

    <!-- Google Fonts Import -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=JetBrains+Mono:ital,wght@0,400;0,700;0,800;1,400&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />

    <style>
      /* Global Design System tokens — aligned with PD website */
      :root {
        --bg-deep: #050608;
        --bg-surface: #13151A;
        --text-main: #E0E2E6;
        --text-dim: #8A8F99;
        --text-muted: #555960;
        --accent: #7EB8DA;
        --accent-dim: rgba(126, 184, 218, 0.10);
        --accent-border: rgba(126, 184, 218, 0.12);
        --brand-gradient-start: #38bdf8;
        --brand-gradient-end: #a855f7;
        --pain-muted: rgba(180, 80, 80, 0.85);
        --border: rgba(255, 255, 255, 0.06);
        --card-radius: 14px;

        --font-heading: 'Inter', 'Noto Sans SC', system-ui, sans-serif;
        --font-code: 'JetBrains Mono', monospace;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 1920px;
        height: 1080px;
        background-color: var(--bg-deep);
        overflow: hidden;
        user-select: none;
      }

      /* Global Texture: SVG Noise Overlay */
      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 999;
      }

      /* Base composition container */
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      /* Transition Overlay - Deep Space Crossfade with Heavy Blur */
      .transition-overlay {
        position: absolute;
        inset: 0;
        background: rgba(5, 6, 8, 0.4);
        backdrop-filter: blur(0px);
        -webkit-backdrop-filter: blur(0px);
        opacity: 0;
        z-index: 90;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- Standalone composition starts here -->
    <div id="root" class="clip" data-composition-id="root" data-width="1920" data-height="1080" data-start="0" data-duration="45" data-track-index="0">
      
      <!-- Sub-compositions linked to tracks -->
      <!-- Scene 1: Cyber Garbage (0 - 9s) -->
      <div id="comp-s1" class="clip"
           data-composition-id="scene-01-hook" 
           data-composition-src="compositions/scene-01-hook.html" 
           data-start="0" 
           data-duration="9" 
           data-track-index="1"></div>

      <!-- Scene 2: Context Collapse (9 - 20s) -->
      <div id="comp-s2" class="clip"
           data-composition-id="scene-02-context" 
           data-composition-src="compositions/scene-02-context.html" 
           data-start="9" 
           data-duration="11" 
           data-track-index="1"></div>

      <!-- Scene 3: Constructive Friction (20 - 33s) -->
      <div id="comp-s3" class="clip"
           data-composition-id="scene-03-friction" 
           data-composition-src="compositions/scene-03-friction.html" 
           data-start="20" 
           data-duration="13" 
           data-track-index="1"></div>

      <!-- Scene 4: The Anchor (33 - 45s) -->
      <div id="comp-s4" class="clip"
           data-composition-id="scene-04-anchor" 
           data-composition-src="compositions/scene-04-anchor.html" 
           data-start="33" 
           data-duration="12" 
           data-track-index="1"></div>

      <!-- Narration Audio Tracks synced to corresponding scenes -->
      <audio id="audio-s1" src="assets/scene1.mp3" data-start="0" data-duration="9" data-track-index="2" data-volume="1"></audio>
      <audio id="audio-s2" src="assets/scene2.mp3" data-start="9" data-duration="11" data-track-index="2" data-volume="1"></audio>
      <audio id="audio-s3" src="assets/scene3.mp3" data-start="20" data-duration="13" data-track-index="2" data-volume="1"></audio>
      <audio id="audio-s4" src="assets/scene4.mp3" data-start="33" data-duration="12" data-track-index="2" data-volume="1"></audio>

      <!-- Ambient Background Music Track (Looping across whole 45s) -->
      <audio id="audio-bgm" src="assets/music.mp3" data-start="0" data-duration="45" data-track-index="3" data-volume="0.15"></audio>

      <!-- Global Transition Layer -->
      <div class="transition-overlay" id="global-transition"></div>

    </div>

    <!-- GSAP for global transitions orchestration -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function() {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Initialize transition overlay state
        tl.set("#global-transition", { opacity: 0, backdropFilter: "blur(0px)" });

        // --- TRANSITION 1: Scene 1 -> Scene 2 (at 9.0s) ---
        // Blur and fade in from 8.5s to 9.0s
        tl.to("#global-transition", {
          opacity: 1,
          backdropFilter: "blur(30px)",
          duration: 0.5,
          ease: "power2.out"
        }, 8.5);

        // Fade back out from 9.0s to 9.8s as Scene 2 active state starts
        tl.to("#global-transition", {
          opacity: 0,
          backdropFilter: "blur(0px)",
          duration: 0.8,
          ease: "power2.in"
        }, 9.0);


        // --- TRANSITION 2: Scene 2 -> Scene 3 (at 20.0s) ---
        // Blur and fade in from 19.5s to 20.0s
        tl.to("#global-transition", {
          opacity: 1,
          backdropFilter: "blur(30px)",
          duration: 0.5,
          ease: "power2.out"
        }, 19.5);

        // Fade back out from 20.0s to 20.8s as Scene 3 starts
        tl.to("#global-transition", {
          opacity: 0,
          backdropFilter: "blur(0px)",
          duration: 0.8,
          ease: "power2.in"
        }, 20.0);


        // --- TRANSITION 3: Scene 3 -> Scene 4 (at 33.0s) ---
        // Blur and fade in from 32.5s to 33.0s
        tl.to("#global-transition", {
          opacity: 1,
          backdropFilter: "blur(30px)",
          duration: 0.5,
          ease: "power2.out"
        }, 32.5);

        // Fade back out from 33.0s to 33.8s as Scene 4 starts
        tl.to("#global-transition", {
          opacity: 0,
          backdropFilter: "blur(0px)",
          duration: 0.8,
          ease: "power2.in"
        }, 33.0);


        // --- FINAL OUTRO: Fade entire video to absolute black (at 43.0s) ---
        tl.to("#global-transition", {
          opacity: 1,
          backgroundColor: "#000000",
          duration: 2.0,
          ease: "power1.in"
        }, 43.0);

        // Register the root timeline
        window.__timelines["root"] = tl;
      })();
    </script>
  </body>
</html>
