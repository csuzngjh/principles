<template id="scene-01-hook-template">
  <div id="scene-01-hook" class="clip" data-composition-id="scene-01-hook" data-width="1920" data-height="1080" data-start="0" data-duration="9" data-track-index="1">
    <div class="scene-container">
      <!-- Ambient physical filters (Vignette) stay outside camera-rig for realism -->
      <div class="vignette"></div>

      <!-- Camera Rig: Group of layers affected by slow continuous camera zoom & impact shake -->
      <div class="camera-rig" id="s1-camera-rig">
        <!-- Floating Ambient Lighting Aura -->
        <div class="ambient-glow" id="s1-glow"></div>

        <!-- Technical Coordinates Mesh Grid -->
        <div class="tech-grid"></div>

        <!-- Infinite AI Agent Task Execution Loop -->
        <div class="infinite-loop-container" id="s1-loop-container">
          <svg class="loop-svg" viewBox="0 0 600 600">
            <!-- Glow underlay for the loop path -->
            <path class="loop-path-glow" d="M 300, 100 a 200,200 0 1,1 0,400 a 200,200 0 1,1 0,-400" fill="none" stroke="rgba(126, 184, 218, 0.02)" stroke-width="8" />
            <!-- The physical loop path background -->
            <path class="loop-path" id="s1-loop-path" d="M 300, 100 a 200,200 0 1,1 0,400 a 200,200 0 1,1 0,-400" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="2" />
            <!-- The moving trace path (cyan -> red) -->
            <path class="loop-trace" id="s1-loop-trace" d="M 300, 100 a 200,200 0 1,1 0,400 a 200,200 0 1,1 0,-400" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="1256.6" stroke-dashoffset="1256.6" />
          </svg>
          
          <!-- Running Agent Dot -->
          <div class="agent-dot" id="s1-agent-dot"></div>
          
          <!-- Crash Pulse Ring (flashes when crash happens) -->
          <div class="crash-ring" id="s1-crash-ring"></div>

          <!-- Centered Typography (Elegantly housed inside the monitoring circle) -->
          <div class="scene-content">
            <h1 class="main-title" id="s1-title">Again.</h1>
            <h2 class="sub-title" id="s1-subtitle">The same mistake, for the third time.</h2>
          </div>
        </div>
      </div>
    </div>

    <style>
      #scene-01-hook {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: #050608;
        overflow: hidden;
        font-family: 'Inter', 'Noto Sans SC', system-ui, sans-serif;
      }

      .scene-container {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Camera Rig - transforms entire scene container in 3D-like zoom & physical rumble shake */
      .camera-rig {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transform-origin: center center;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1;
      }

      /* Vignette for deep space contrast and mystery */
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, transparent 30%, rgba(5, 6, 8, 0.95) 100%);
        pointer-events: none;
        z-index: 15;
      }

      /* Atmospheric Ambient Light Aura */
      .ambient-glow {
        position: absolute;
        width: 1000px;
        height: 1000px;
        background: radial-gradient(circle, rgba(126, 184, 218, 0.06) 0%, rgba(126, 184, 218, 0.01) 45%, transparent 70%);
        border-radius: 50%;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
        pointer-events: none;
      }

      /* Technical Wireframe Coordinates Grid */
      .tech-grid {
        position: absolute;
        inset: 0;
        background-image: 
          linear-gradient(rgba(255, 255, 255, 0.01) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.01) 1px, transparent 1px);
        background-size: 80px 80px;
        background-position: center center;
        z-index: 3;
        pointer-events: none;
      }

      /* Infinite Loop Container */
      .infinite-loop-container {
        position: absolute;
        width: 600px;
        height: 600px;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 5;
        opacity: 0;
        will-change: opacity, transform;
      }

      .loop-svg {
        width: 100%;
        height: 100%;
      }

      .loop-path-glow {
        stroke: rgba(126, 184, 218, 0.02);
      }

      .loop-path {
        stroke: rgba(255, 255, 255, 0.035);
        transition: stroke 0.4s ease;
      }

      .loop-trace {
        stroke: var(--accent);
        transition: stroke 0.3s ease;
        will-change: stroke-dashoffset, stroke;
      }

      /* The traveling agent dot */
      .agent-dot {
        position: absolute;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #7EB8DA;
        box-shadow: 0 0 20px #7EB8DA, 0 0 45px rgba(126, 184, 218, 0.8);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(-90deg) translate(200px);
        transform-origin: center center;
        z-index: 10;
        will-change: transform, background, box-shadow;
      }

      /* Pulsing Crash Ring - triggers on third collision */
      .crash-ring {
        position: absolute;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        border: 2px dashed rgba(180, 80, 80, 0.4);
        box-shadow: 0 0 40px rgba(180, 80, 80, 0.2);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.9);
        z-index: 4;
        opacity: 0;
        will-change: transform, opacity;
      }

      /* Main Title & Content Styling (housed centrally in circle) */
      .scene-content {
        position: absolute;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 12;
        width: 320px;
        text-align: center;
      }

      .main-title {
        color: #E0E2E6;
        font-size: 56px;
        font-weight: 300;
        text-align: center;
        line-height: 1.2;
        letter-spacing: 0.1em;
        text-shadow: 0 0 20px rgba(224, 226, 230, 0.15);
        opacity: 0;
        filter: blur(12px);
        will-change: transform, opacity, filter, letter-spacing;
        margin: 0;
      }

      .sub-title {
        color: rgba(180, 80, 80, 0.95);
        font-size: 18px;
        font-weight: 400;
        text-align: center;
        margin-top: 16px;
        letter-spacing: 0.08em;
        text-shadow: 0 0 15px rgba(180, 80, 80, 0.35);
        opacity: 0;
        filter: blur(8px);
        will-change: transform, opacity, filter, letter-spacing;
        margin-bottom: 0;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function() {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Set initial states
        tl.set("#s1-camera-rig", { scale: 1.0 });
        tl.set("#s1-loop-container", { opacity: 0, scale: 0.96 });
        tl.set("#s1-loop-trace", { strokeDashoffset: 1256.6, stroke: "#7EB8DA" });
        tl.set("#s1-loop-path", { stroke: "rgba(255, 255, 255, 0.035)" });
        tl.set("#s1-agent-dot", {
          background: "#7EB8DA",
          boxShadow: "0 0 20px #7EB8DA, 0 0 45px rgba(126, 184, 218, 0.8)",
          opacity: 1
        });
        tl.set("#s1-crash-ring", { opacity: 0, scale: 0.9 });

        // Cinematic Camera Rig Dolly-in (Continuous very slow zoom across 9s)
        tl.to("#s1-camera-rig", {
          scale: 1.05,
          duration: 9.0,
          ease: "sine.out"
        }, 0);

        // Slowly drift ambient glow behind text to make it alive
        tl.to("#s1-glow", {
          x: "6%",
          y: "-4%",
          duration: 4.5,
          yoyo: true,
          repeat: 1,
          ease: "sine.inOut"
        }, 0);

        // Phase A: Container Fade in
        tl.to("#s1-loop-container", {
          opacity: 1,
          scale: 1,
          duration: 1.5,
          ease: "power2.out"
        }, 0.2);

        // Central Premium Text Reveal
        tl.to("#s1-title", {
          opacity: 1,
          letterSpacing: "0.08em",
          filter: "blur(0px)",
          duration: 1.8,
          ease: "power2.out"
        }, 0.5);

        tl.to("#s1-subtitle", {
          opacity: 1,
          letterSpacing: "0.08em",
          filter: "blur(0px)",
          duration: 1.5,
          ease: "power2.out"
        }, 1.2);

        // --- Infinite Agent Dot Rotation Animation (GSAP Math-less Circle Movement) ---
        // We will animate a proxy object containing the angle.
        let dotAngle = { rotation: 0 };
        let traceOffset = { offset: 1256.6 };

        // Cycle 1: Smooth operation (0.5s - 2.8s) -> 360 degrees rotation
        tl.to(dotAngle, {
          rotation: 360,
          duration: 2.3,
          ease: "sine.inOut",
          onUpdate: function() {
            gsap.set("#s1-agent-dot", {
              transform: `translate(-50%, -50%) rotate(${dotAngle.rotation - 90}deg) translate(200px)`
            });
          }
        }, 0.5);

        tl.to(traceOffset, {
          offset: 0,
          duration: 2.3,
          ease: "sine.inOut",
          onUpdate: function() {
            gsap.set("#s1-loop-trace", { strokeDashoffset: traceOffset.offset });
          }
        }, 0.5);

        // Reset trace offset instantly at 2.8s to begin cycle 2 drawing
        tl.set(traceOffset, { offset: 1256.6 }, 2.8);

        // Cycle 2: Slightly unstable / forgetting stutter (2.8s - 5.0s) -> 360 to 720 degrees
        tl.to(dotAngle, {
          rotation: 720,
          duration: 2.2,
          ease: "power1.inOut",
          onUpdate: function() {
            gsap.set("#s1-agent-dot", {
              transform: `translate(-50%, -50%) rotate(${dotAngle.rotation - 90}deg) translate(200px)`
            });
          }
        }, 2.8);

        tl.to(traceOffset, {
          offset: 0,
          duration: 2.2,
          ease: "power1.inOut",
          onUpdate: function() {
            gsap.set("#s1-loop-trace", { strokeDashoffset: traceOffset.offset });
          }
        }, 2.8);

        // Quick forgetting jitter/flicker overlays (simulate instability)
        tl.to("#s1-agent-dot", {
          opacity: 0.35,
          scale: 0.85,
          duration: 0.12,
          yoyo: true,
          repeat: 4,
          ease: "power2.inOut"
        }, 3.8);

        tl.to("#s1-loop-trace", {
          opacity: 0.4,
          duration: 0.1,
          yoyo: true,
          repeat: 3
        }, 4.0);

        // Restore trace/dot opacity fully before third run
        tl.to(["#s1-agent-dot", "#s1-loop-trace"], { opacity: 1, scale: 1, duration: 0.3 }, 4.7);
        tl.set(traceOffset, { offset: 1256.6 }, 5.0);

        // Cycle 3: The Fatal Collision / repeated error (5.0s - 6.2s) -> 720 to 900 degrees (crashes at 9 o'clock)
        tl.to(dotAngle, {
          rotation: 900, // stops at 9 o'clock (900 - 90 = 810deg rotation)
          duration: 1.2,
          ease: "sine.in",
          onUpdate: function() {
            gsap.set("#s1-agent-dot", {
              transform: `translate(-50%, -50%) rotate(${dotAngle.rotation - 90}deg) translate(200px)`
            });
          }
        }, 5.0);

        tl.to(traceOffset, {
          offset: 628.3, // draws half circle up to 900deg
          duration: 1.2,
          ease: "sine.in",
          onUpdate: function() {
            gsap.set("#s1-loop-trace", { strokeDashoffset: traceOffset.offset });
          }
        }, 5.0);

        // --- THE CRASH MOMENT (6.2s) ---
        // Dot hits wall, colors morph to red, camera violently shakes, crash ring pulses
        tl.to("#s1-agent-dot", {
          background: "#B45050",
          boxShadow: "0 0 25px #B45050, 0 0 50px rgba(180, 80, 80, 0.9)",
          duration: 0.15,
          ease: "expo.out"
        }, 6.2);

        tl.to("#s1-loop-trace", {
          stroke: "rgba(180, 80, 80, 0.8)",
          duration: 0.15,
          ease: "expo.out"
        }, 6.2);

        tl.to("#s1-loop-path", {
          stroke: "rgba(180, 80, 80, 0.15)",
          duration: 0.25
        }, 6.2);

        // Violently shake camera rig inside 3D space to represent the punch of the failure
        tl.to("#s1-camera-rig", {
          x: -12,
          y: 7,
          rotation: 0.3,
          duration: 0.05,
          yoyo: true,
          repeat: 6,
          ease: "power2.inOut"
        }, 6.2);

        // Restore camera center position after shake
        tl.to("#s1-camera-rig", { x: 0, y: 0, rotation: 0, duration: 0.25 }, 6.55);

        // Pulsing crash ring expands
        tl.to("#s1-crash-ring", {
          opacity: 1,
          scale: 1.25,
          duration: 0.6,
          ease: "expo.out"
        }, 6.2);

        // Fade crash ring out
        tl.to("#s1-crash-ring", {
          opacity: 0,
          scale: 1.35,
          duration: 0.8,
          ease: "sine.in"
        }, 6.8);

        // Gentle persistent jitter on crashed dot to show it is stuck/broken
        tl.to("#s1-agent-dot", {
          x: "+=2",
          y: "-=1",
          duration: 0.04,
          yoyo: true,
          repeat: 20
        }, 6.3);

        // Elegant exit animation: fade out elements before transition to avoid stale text lingering
        tl.to(["#s1-loop-container", "#s1-title", "#s1-subtitle"], {
          opacity: 0,
          scale: 0.96,
          filter: "blur(12px)",
          duration: 1.3,
          ease: "power2.in"
        }, 7.5);

        window.__timelines["scene-01-hook"] = tl;
      })();
    </script>
  </div>
</template>
