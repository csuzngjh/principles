# Lefthook configuration
# https://github.com/evilmartians/lefthook/blob/master/docs/configuration.md

pre-commit:
  parallel: true
  commands:
    worktree-guard:
      # Single authority for safe-write-clone judgement (AGENTS.md §23A):
      # protected branch / detached HEAD / unsafe git state / primary
      # checkout all fail closed. Judge-only — never mutates anything.
      run: node scripts/dev/check-dev-worktree.mjs
    lint:
      glob: "*.ts"
      run: npx eslint --fix {staged_files}
      stage_fixed: true
    repo-hygiene:
      run: node scripts/check-repo-hygiene.js staged
    commit-identity:
      # Reject commits attributed to a Git email GitHub maps to a foreign
      # account (2026-09-21 incident: pd@users.noreply.github.com →
      # github.com/pd instead of the repository owner). `git var` sees
      # -c and env overrides, so inline injection fails closed too.
      # Judge-only — never mutates anything.
      run: node scripts/dev/check-commit-identity.mjs

pre-push:
  parallel: false
  commands:
    worktree-guard:
      # Same guard as pre-commit (see AGENTS.md §23A) — also replaces the old
      # protect-branch.cjs main/master push block, which it subsumes.
      run: node scripts/dev/check-dev-worktree.mjs
    verify-merge:
      # Canonical merge gate. Keep this in sync with the required CI check.
      run: npm run verify:merge
    # gitleaks removed by Owner decision (2026-10-17, push-latency review):
    # the full-history scan added push latency and duplicated no CI check;
    # secret hygiene remains covered by repo-hygiene (pre-commit) and the
    # Owner's own operational controls.
