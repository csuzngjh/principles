# Lefthook configuration
# https://github.com/evilmartians/lefthook/blob/master/docs/configuration.md

pre-commit:
  parallel: true
  commands:
    worktree-guard:
      # Single authority for safe-write-clone judgement (AGENTS.md §23A):
      # protected branch / detached HEAD / unsafe git state / primary
      # checkout all fail closed. Judge-only — never mutates anything.
      run: node scripts/dev/check-dev-worktree.mjs
    lint:
      glob: "*.ts"
      run: npx eslint --fix {staged_files}
      stage_fixed: true
    repo-hygiene:
      run: node scripts/check-repo-hygiene.js staged

pre-push:
  parallel: false
  commands:
    worktree-guard:
      # Same guard as pre-commit (see AGENTS.md §23A) — also replaces the old
      # protect-branch.cjs main/master push block, which it subsumes.
      run: node scripts/dev/check-dev-worktree.mjs
    verify-merge:
      # Canonical merge gate. Keep this in sync with the required CI check.
      run: npm run verify:merge
    gitleaks:
      # `protect --staged` is deprecated in gitleaks v8.18+; `detect` scans
      # the full git history so outgoing commits are covered at pre-push.
      run: gitleaks detect --source . --redact --verbose
