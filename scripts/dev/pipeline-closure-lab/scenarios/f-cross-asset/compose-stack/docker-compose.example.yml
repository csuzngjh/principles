version: "3.9"
services:
  api:
    image: orders-api:latest
    ports:
      - "8080:8080"
    environment:
      REGION: "us-east-1"
    log_level: info
    retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  monitor:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    environment:
      REGION: "us-east-1"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
